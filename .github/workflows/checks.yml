name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Documentation lint
        run: python tools/check-docs.py --strict
      - name: Card lint
        run: python tools/cardlint.py
      - name: The cost document matches the cost model
        run: |
          python tools/cost-model.py --check docs/design/10-cost-and-finops.md
          python tools/cost-model.py --dev-hub > /dev/null
      - name: Unit tests of the tools
        run: python -m unittest discover -s tools/tests
      - name: Unit tests of the learning demonstration
        run: python -m unittest discover -s evaluation/c14/tests -t evaluation/c14
      - name: The learning demonstration runs end to end on its template pack
        run: python evaluation/c14/run.py demo --out "$RUNNER_TEMP/c14-demo"
      - name: The workflows follow the rules, and are valid YAML
        run: |
          python tools/workflow-lint.py
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "#{f}: valid YAML" }' .github/workflows/*.yml
      - name: A real YAML parser agrees that the deploy workflow is guarded
        run: |
          ruby - <<'RUBY'
          require "yaml"
          file = ".github/workflows/deploy-hub.yml"
          doc = YAML.load_file(file)
          guard = "github.actor == 'tinodo' && github.ref == 'refs/heads/main'"
          problems = []
          jobs = doc["jobs"]
          problems << "it must have exactly one job" unless jobs.is_a?(Hash) && jobs.size == 1
          (jobs.is_a?(Hash) ? jobs : {}).each do |name, job|
            condition = job["if"].to_s.strip.sub(/\A\$\{\{\s*(.*?)\s*\}\}\z/m, '\1')
            problems << "job #{name}: its if is not the owner-and-main guard" unless condition == guard
            problems << "job #{name}: continue-on-error is set" if job["continue-on-error"].to_s == "true"
          end
          trigger = doc.key?("on") ? doc["on"] : doc[true]
          events = trigger.is_a?(Hash) ? trigger.keys : Array(trigger)
          problems << "it must run on workflow_dispatch alone, not on #{events.inspect}" unless events == ["workflow_dispatch"]
          problems << "it has no concurrency group" unless doc["concurrency"]
          problems.each { |problem| puts "#{file}: #{problem}" }
          abort "#{file}: not guarded as the rules say" unless problems.empty?
          puts "#{file}: one job, for the owner on main only, started by hand alone"
          RUBY
      - name: The Bicep templates compile and lint
        run: |
          for template in infra/budgets/*.bicep hub/main.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
            az bicep lint --file "$template"
          done
