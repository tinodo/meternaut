name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Documentation lint
        run: python tools/check-docs.py --strict
      - name: Card lint
        run: python tools/cardlint.py
      - name: The cost document matches the cost model
        run: python tools/cost-model.py --check docs/design/10-cost-and-finops.md
      - name: Unit tests of the tools
        run: python -m unittest discover -s tools/tests
      - name: Unit tests of the case functions, with the libraries that they run with
        run: |
          python -m pip install --quiet --disable-pip-version-check --require-hashes --requirement src/case-functions/requirements.txt
          python -m unittest discover -s src/case-functions/tests -v
      - name: The function app's package builds for its runtime, and the app loads from its package with its functions
        run: |
          bash tools/build-function-app.sh case-functions cases "$RUNNER_TEMP/case-functions" "$RUNNER_TEMP/case-functions.zip"
          (cd "$RUNNER_TEMP/case-functions" && PYTHONPATH=.python_packages/lib/site-packages python -c "import function_app; print(sorted(f.get_function_name() for f in function_app.app.get_functions()))")
      - name: The workflows follow the rules, and are valid YAML
        run: |
          python tools/workflow-lint.py
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "#{f}: valid YAML" }' .github/workflows/*.yml
      - name: A real YAML parser agrees that the deploy workflow is guarded
        run: |
          ruby - <<'RUBY'
          require "yaml"
          file = ".github/workflows/deploy-hub.yml"
          doc = YAML.load_file(file)
          guard = "github.actor == 'tinodo' && github.ref == 'refs/heads/main'"
          problems = []
          jobs = doc["jobs"]
          problems << "it must have exactly one job" unless jobs.is_a?(Hash) && jobs.size == 1
          (jobs.is_a?(Hash) ? jobs : {}).each do |name, job|
            condition = job["if"].to_s.strip.sub(/\A\$\{\{\s*(.*?)\s*\}\}\z/m, '\1')
            problems << "job #{name}: its if is not the owner-and-main guard" unless condition == guard
            problems << "job #{name}: continue-on-error is set" if job["continue-on-error"].to_s == "true"
          end
          trigger = doc.key?("on") ? doc["on"] : doc[true]
          events = trigger.is_a?(Hash) ? trigger.keys : Array(trigger)
          problems << "it must run on workflow_dispatch and workflow_call alone, not on #{events.inspect}" unless events.sort == ["workflow_call", "workflow_dispatch"]
          problems << "it has no concurrency group" unless doc["concurrency"]
          problems.each { |problem| puts "#{file}: #{problem}" }
          abort "#{file}: not guarded as the rules say" unless problems.empty?
          puts "#{file}: one job, for the owner on main only, started by hand or called by the deploy repository's workflow"
          RUBY
      - name: A real YAML parser agrees that the read-only drift workflow is guarded and never uses the deploy identity
        run: |
          ruby - <<'RUBY'
          require "yaml"
          file = ".github/workflows/drift.yml"
          doc = YAML.load_file(file)
          guard = "github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.actor == 'tinodo')"
          problems = []
          jobs = doc["jobs"]
          problems << "it must have exactly one job" unless jobs.is_a?(Hash) && jobs.size == 1
          (jobs.is_a?(Hash) ? jobs : {}).each do |name, job|
            condition = job["if"].to_s.strip.sub(/\A\$\{\{\s*(.*?)\s*\}\}\z/m, '\1')
            problems << "job #{name}: its if is not the main-and-owner-or-timer guard" unless condition == guard
            problems << "job #{name}: continue-on-error is set" if job["continue-on-error"].to_s == "true"
          end
          trigger = doc.key?("on") ? doc["on"] : doc[true]
          events = trigger.is_a?(Hash) ? trigger.keys : Array(trigger)
          problems << "it must run on workflow_dispatch, and on a timer (schedule) at most, not on #{events.inspect}" unless events.include?("workflow_dispatch") && (events - ["workflow_dispatch", "schedule"]).empty?
          problems << "it has no concurrency group" unless doc["concurrency"]
          permissions = doc["permissions"]
          problems << "its permissions must be contents: read and id-token: write, and nothing else" unless permissions == { "contents" => "read", "id-token" => "write" }
          problems << "it must not sign in with the deploy identity" if File.read(file).lines.reject { |line| line.strip.start_with?("#") }.any? { |line| line.include?("secrets.AZURE_CLIENT_ID") }
          problems.each { |problem| puts "#{file}: #{problem}" }
          abort "#{file}: not guarded as the rules say" unless problems.empty?
          puts "#{file}: one job, on main, for the owner or the timer, read-only identity of its own"
          RUBY
      - name: The Bicep templates compile and lint
        run: |
          for template in environment/main.bicep environment/base/main.bicep environment/foundry/main.bicep environment/cases/main.bicep environment/operator/main.bicep environment/aigateway/main.bicep environment/aigateway/subnet.bicep environment/aigateway/telemetry.bicep environment/governance/main.bicep environment/powerplatform/main.bicep infra/budgets/*.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
            az bicep lint --file "$template"
          done
      - name: The drift check of the AI security runs its own selftest, with no call to Azure
        run: python tools/drift-check.py --selftest
      - name: The parameter files fit the compiled templates
        env:
          ENV_SUBSCRIPTION_ID: 11111111-2222-3333-4444-555555555555
          ENV_RESOURCE_GROUP: rg-example
          ENV_LOCATION: swedencentral
          ENV_VNET_PREFIX: 10.53.0.0/24
          ENV_PE_SUBNET_PREFIX: 10.53.0.0/27
          ENV_DNS_SERVERS: 10.20.0.4
          ENV_OWNER: owner@example.com
          ENV_BUDGET_AMOUNT: "25"
          ENV_ALERT_EMAILS: owner@example.com
          ENV_BUDGET_START: "2026-11-01"
          CASES_SYSTEM_PRINCIPAL_ID: 12345678-dddd-eeee-ffff-123456789012
          ENV_FOUNDRY_PROJECT_EXISTS: "true"
          FOUNDRY_PROJECT_PRINCIPAL_ID: 12345678-eeee-ffff-1111-123456789012
          OPERATOR_PRINCIPAL_ID: 12345678-aaaa-bbbb-cccc-123456789012
          ENV_FOUNDRY_DIAGNOSTICS_EXIST: "true"
          GUARDRAIL_INITIATIVE_AVAILABLE: "true"
          BUILD_COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PACKAGE_SHA256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          AIGATEWAY_HOST: aigw-meternaut-0123abcd.swedencentral.ai.gateway.azure.com
        run: |
          out="$RUNNER_TEMP/params"
          mkdir -p "$out"
          python tools/environment-params.py build --models environment/models.json --out-dir "$out" --aigateway-policies environment/aigateway/policies.json --governance environment/aigateway/contracts.json --powerplatform > /dev/null
          az bicep build --file environment/main.bicep --outfile "$out/environment.json"
          az bicep build --file environment/base/main.bicep --outfile "$out/base.json"
          az bicep build --file environment/foundry/main.bicep --outfile "$out/foundry.json"
          az bicep build --file environment/cases/main.bicep --outfile "$out/cases.json"
          az bicep build --file environment/operator/main.bicep --outfile "$out/operator.json"
          az bicep build --file environment/aigateway/main.bicep --outfile "$out/aigateway.json"
          az bicep build --file environment/aigateway/subnet.bicep --outfile "$out/aigateway-subnet.json"
          az bicep build --file environment/aigateway/telemetry.bicep --outfile "$out/gateway-telemetry.json"
          az bicep build --file environment/governance/main.bicep --outfile "$out/governance.json"
          az bicep build --file environment/powerplatform/main.bicep --outfile "$out/powerplatform.json"
          python tools/environment-params.py check --params "$out/environment.parameters.json" --template "$out/environment.json" --label environment
          python tools/environment-params.py check --params "$out/base.parameters.json" --template "$out/base.json" --label base
          python tools/environment-params.py check --params "$out/foundry.parameters.json" --template "$out/foundry.json" --label foundry
          python tools/environment-params.py check --params "$out/cases.parameters.json" --template "$out/cases.json" --label cases
          python tools/environment-params.py check --params "$out/operator.parameters.json" --template "$out/operator.json" --label operator
          python tools/environment-params.py check --params "$out/aigateway.parameters.json" --template "$out/aigateway.json" --label aigateway
          python tools/environment-params.py check --params "$out/aigateway-subnet.parameters.json" --template "$out/aigateway-subnet.json" --label aigateway-subnet
          python tools/environment-params.py check --params "$out/gateway-telemetry.parameters.json" --template "$out/gateway-telemetry.json" --label gateway-telemetry
          python tools/environment-params.py check --params "$out/governance.parameters.json" --template "$out/governance.json" --label governance
          python tools/environment-params.py check --params "$out/powerplatform.parameters.json" --template "$out/powerplatform.json" --label powerplatform
