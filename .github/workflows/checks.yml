name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Documentation lint
        run: python tools/check-docs.py --strict
      - name: Card lint
        run: python tools/cardlint.py
      - name: The cost document matches the cost model
        run: |
          python tools/cost-model.py --check docs/design/10-cost-and-finops.md
          python tools/cost-model.py --dev-hub > /dev/null
      - name: Unit tests of the tools
        run: python -m unittest discover -s tools/tests
      - name: Unit tests of the learning demonstration
        run: python -m unittest discover -s evaluation/c14/tests -t evaluation/c14
      - name: The learning demonstration runs end to end on its template pack
        run: python evaluation/c14/run.py demo --out "$RUNNER_TEMP/c14-demo"
      - name: The Bicep templates compile and lint
        run: |
          for template in infra/budgets/*.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
            az bicep lint --file "$template"
          done
      - name: The hub's patch applies to the pinned accelerator, and its files compile
        env:
          HUB_OWNER: ci
          HUB_RESOURCE_GROUP: ci-hub-rg
          HUB_APIM_NAME: ci-hub
          HUB_KEY_VAULT_NAME: ci-hub-kv
          HUB_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000000
        run: |
          commit=$(python -c "import json; print(json.load(open('hub/accelerator.json'))['commit'])")
          git init --quiet local/accelerator
          git -C local/accelerator fetch --quiet --depth 1 https://github.com/Azure-Samples/ai-hub-gateway-solution-accelerator "$commit"
          git -C local/accelerator checkout --quiet FETCH_HEAD
          git -C local/accelerator apply --ignore-whitespace ../../hub/accelerator-changes.patch
          az bicep build --file local/accelerator/bicep/infra/main.bicep --stdout > /dev/null
          az bicep build-params --file hub/meternaut-dev.bicepparam --stdout > /dev/null
          az bicep build-params --file hub/contracts/learning-demo-dev/main.bicepparam --stdout > /dev/null
          az bicep build --file hub/dns-gateway.bicep --stdout > /dev/null
          az bicep lint --file hub/dns-gateway.bicep
