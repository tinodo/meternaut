name: Hub

# The only way anything of the hub reaches Azure (AGENTS.md rule 18). Nothing starts it but a click on "Run workflow"
# in the Actions tab. It signs in to Azure with OpenID Connect and a credential that exists only for the main
# branch, so a copy of this file on any other branch cannot sign in. "what-if" reads and changes nothing.
# What it does, and what to set up once before the first run: hub/README.md and hub/BOOTSTRAP.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "what-if: show what a deploy would change and change nothing. deploy: build or update the hub. pause: take the gateway objects and the private endpoint away, the only fixed cost. remove: take everything away."
        type: choice
        required: true
        default: what-if
        options:
          - what-if
          - deploy
          - pause
          - remove
      check_limits:
        description: "With deploy: also check that the token rate is enforced. It uses about a minute's allowance of tokens and blocks the key for up to a minute."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  hub:
    name: Hub (${{ inputs.action }})
    if: github.actor == 'tinodo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACTION: ${{ inputs.action }}
      HUB_RESOURCE_GROUP: ${{ vars.HUB_RESOURCE_GROUP }}
      HUB_LOCATION: ${{ vars.HUB_LOCATION }}
      HUB_VNET_PREFIX: ${{ vars.HUB_VNET_PREFIX }}
      HUB_PE_SUBNET_PREFIX: ${{ vars.HUB_PE_SUBNET_PREFIX }}
      HUB_DNS_SERVERS: ${{ vars.HUB_DNS_SERVERS }}
      HUB_OWNER: ${{ vars.HUB_OWNER }}
      HUB_BUDGET_AMOUNT: ${{ vars.HUB_BUDGET_AMOUNT }}
      HUB_ALERT_EMAILS: ${{ vars.HUB_ALERT_EMAILS }}
      HUB_APIM_LOGGER: ${{ vars.HUB_APIM_LOGGER }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tools and the template pass their checks
        run: |
          python3 -m unittest discover -s tools/tests
          python3 tools/workflow-lint.py
          az bicep build --file hub/main.bicep --stdout > /dev/null

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the API Management instance
        id: apim
        env:
          HUB_APIM_RESOURCE_ID: ${{ secrets.HUB_APIM_RESOURCE_ID }}
        run: |
          url="https://management.azure.com${HUB_APIM_RESOURCE_ID}?api-version=2024-05-01"
          principal=$(az rest --method get --url "$url" --query "identity.principalId" --output tsv)
          gateway=$(az rest --method get --url "$url" --query "properties.gatewayUrl" --output tsv)
          if [ -z "$principal" ] || [ "$principal" = "None" ]; then
            echo "::error::The API Management instance has no system-assigned identity. This workflow does not change the instance itself, so its owner turns the identity on once, and the workflow is run again."
            exit 1
          fi
          case "$gateway" in
            https://*.azure-api.net) ;;
            *) echo "::error::The instance's gateway address is not an azure-api.net address."; exit 1 ;;
          esac
          echo "principal_id=$principal" >> "$GITHUB_OUTPUT"
          echo "gateway_url=$gateway" >> "$GITHUB_OUTPUT"

      - name: Read the start date of the budget
        id: budget
        run: |
          # A budget keeps its start date, so an existing one is read and passed on again; a new one starts in the current month.
          # The group's budgets are listed and filtered by name: a missing budget is an empty answer, so no error text is read
          # (the service's text for "not found" differs from one API to the next).
          url="https://management.azure.com/subscriptions/$(az account show --query id --output tsv)/resourceGroups/$HUB_RESOURCE_GROUP/providers/Microsoft.Consumption/budgets?api-version=2024-08-01"
          start=$(az rest --method get --url "$url" --query "value[?name=='meternaut-hub'].properties.timePeriod.startDate | [0]" --output tsv)
          if [ -n "$start" ] && [ "$start" != "None" ]; then
            start="${start:0:10}"
            echo "The budget exists and started on $start."
          else
            start="$(date -u +%Y-%m-01)"
            echo "There is no budget yet; a new one starts on $start."
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Work out the settings
        id: params
        env:
          HUB_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          HUB_APIM_PRINCIPAL_ID: ${{ steps.apim.outputs.principal_id }}
          HUB_BUDGET_START: ${{ steps.budget.outputs.start }}
        run: python3 tools/hub-params.py --out "$RUNNER_TEMP/hub.parameters.json" >> "$GITHUB_OUTPUT"

      - name: The resource group is there
        run: az group show --name "$HUB_RESOURCE_GROUP" --query "{name:name, location:location, state:properties.provisioningState}" --output table

      - name: What a deploy would change in Azure
        if: inputs.action == 'what-if' || inputs.action == 'deploy'
        run: |
          whatif() {
            az deployment group what-if --only-show-errors --resource-group "$HUB_RESOURCE_GROUP" \
              --template-file hub/main.bicep --parameters "@$RUNNER_TEMP/hub.parameters.json" "$@" \
              --result-format FullResourcePayloads
          }
          if whatif 2> "$RUNNER_TEMP/whatif.err"; then
            cat "$RUNNER_TEMP/whatif.err" >&2
          elif grep -q FlagMustBeSetForRestore "$RUNNER_TEMP/whatif.err"; then
            echo "A soft-deleted account of this name is left from an earlier removal; the preview, like the deploy, restores it (it holds nothing)."
            whatif restoreAccount=true
          else
            cat "$RUNNER_TEMP/whatif.err" >&2
            exit 1
          fi

      - name: What would change in the API Management instance
        if: inputs.action == 'what-if'
        env:
          HUB_APIM_RESOURCE_ID: ${{ secrets.HUB_APIM_RESOURCE_ID }}
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.endpoint }}
        run: |
          python3 tools/apim-sync.py plan --apim "$HUB_APIM_RESOURCE_ID" \
            --var "FOUNDRY_ENDPOINT=$FOUNDRY_ENDPOINT" --var "APPINSIGHTS_LOGGER=$HUB_APIM_LOGGER"

      - name: Deploy the network, the model account and its private endpoint
        if: inputs.action == 'deploy'
        env:
          EXPECTED_ENDPOINT: ${{ steps.params.outputs.endpoint }}
        run: |
          deploy() {
            az deployment group create --only-show-errors --resource-group "$HUB_RESOURCE_GROUP" \
              --name "hub-$GITHUB_RUN_ID" --template-file hub/main.bicep \
              --parameters "@$RUNNER_TEMP/hub.parameters.json" "$@" \
              --query properties.outputs.endpoint.value --output tsv
          }
          # Three answers of the service are not failures of the template. A soft-deleted account of the name is restored with
          # restoreAccount=true. A write to the account that collides with another change to it (IfMatchPreconditionFailed), and a
          # stop of the Azure CLI itself on the runner ("deadlock detected by _ModuleLock", an import lock of its Python, seen once),
          # are made again after a minute: the deployment is idempotent. Anything else stops the run at once.
          extra=()
          endpoint=""
          for attempt in 1 2 3; do
            if endpoint=$(deploy "${extra[@]}" 2> "$RUNNER_TEMP/deploy.err"); then
              cat "$RUNNER_TEMP/deploy.err" >&2
              break
            fi
            if [ "${#extra[@]}" -eq 0 ] && grep -q FlagMustBeSetForRestore "$RUNNER_TEMP/deploy.err"; then
              echo "A soft-deleted account of this name is left from an earlier removal; it is restored (it holds nothing)."
              extra=(restoreAccount=true)
            elif [ "$attempt" -lt 3 ] && grep -qE 'IfMatchPreconditionFailed|deadlock detected by _ModuleLock' "$RUNNER_TEMP/deploy.err"; then
              echo "The deployment stopped on an answer that a second try usually clears (a write to the model account that collided with another change to it, or the Azure CLI stopping on its own). Trying again in a minute (attempt $attempt of 3)."
              sleep 60
            else
              cat "$RUNNER_TEMP/deploy.err" >&2
              exit 1
            fi
          done
          if [ -z "$endpoint" ]; then
            echo "::error::The deployment did not finish after three tries."
            exit 1
          fi
          if [ "${endpoint%/}" != "$EXPECTED_ENDPOINT" ]; then
            echo "::error::The deployed account answers on ${endpoint%/}, not on $EXPECTED_ENDPOINT. Nothing was added to the API Management instance."
            exit 1
          fi

      - name: Wait until the landing zone has registered the endpoint's name
        if: inputs.action == 'deploy'
        env:
          PRIVATE_ENDPOINT: ${{ steps.params.outputs.private_endpoint }}
        run: |
          for attempt in $(seq 1 40); do
            zones=$(az network private-endpoint dns-zone-group list --resource-group "$HUB_RESOURCE_GROUP" \
              --endpoint-name "$PRIVATE_ENDPOINT" --query "[].privateDnsZoneConfigs[].privateDnsZoneId" --output tsv || true)
            if grep -qi 'privatelink.cognitiveservices.azure.com' <<< "$zones"; then
              echo "The landing zone's policy has registered $PRIVATE_ENDPOINT in the central private DNS zone."
              exit 0
            fi
            echo "Not registered yet (check $attempt of 40). The policy acts about ten minutes after the endpoint exists."
            sleep 60
          done
          echo "::error::The landing zone's policy has not registered $PRIVATE_ENDPOINT in the central private DNS zone after 40 minutes. Nothing was added to the API Management instance. Look at the policy compliance of the endpoint; do not create a private DNS zone."
          exit 1

      - name: What changes in the API Management instance
        if: inputs.action == 'deploy'
        env:
          HUB_APIM_RESOURCE_ID: ${{ secrets.HUB_APIM_RESOURCE_ID }}
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.endpoint }}
        run: |
          python3 tools/apim-sync.py plan --apim "$HUB_APIM_RESOURCE_ID" \
            --var "FOUNDRY_ENDPOINT=$FOUNDRY_ENDPOINT" --var "APPINSIGHTS_LOGGER=$HUB_APIM_LOGGER"

      - name: Add the Meternaut objects to the API Management instance
        if: inputs.action == 'deploy'
        env:
          HUB_APIM_RESOURCE_ID: ${{ secrets.HUB_APIM_RESOURCE_ID }}
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.endpoint }}
        run: |
          python3 tools/apim-sync.py apply --apim "$HUB_APIM_RESOURCE_ID" \
            --var "FOUNDRY_ENDPOINT=$FOUNDRY_ENDPOINT" --var "APPINSIGHTS_LOGGER=$HUB_APIM_LOGGER"

      - name: The hub answers as its contract says
        if: inputs.action == 'deploy'
        env:
          HUB_APIM_RESOURCE_ID: ${{ secrets.HUB_APIM_RESOURCE_ID }}
          GATEWAY_URL: ${{ steps.apim.outputs.gateway_url }}
          CHECK_LIMITS: ${{ inputs.check_limits }}
        run: |
          key="$(python3 tools/apim-sync.py key --apim "$HUB_APIM_RESOURCE_ID")"
          echo "::add-mask::$key"
          flags=()
          if [ "$CHECK_LIMITS" = "true" ]; then flags+=(--limits); fi
          HUB_SMOKE_KEY="$key" python3 tools/hub-smoke.py --url "${GATEWAY_URL%/}/meternaut/llm/v1/chat/completions" "${flags[@]}"

      - name: Take the Meternaut objects out of the API Management instance
        if: inputs.action == 'pause' || inputs.action == 'remove'
        env:
          HUB_APIM_RESOURCE_ID: ${{ secrets.HUB_APIM_RESOURCE_ID }}
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.endpoint }}
        run: |
          python3 tools/apim-sync.py remove --apim "$HUB_APIM_RESOURCE_ID" \
            --var "FOUNDRY_ENDPOINT=$FOUNDRY_ENDPOINT" --var "APPINSIGHTS_LOGGER=$HUB_APIM_LOGGER"

      - name: Take the resources away
        if: inputs.action == 'pause' || inputs.action == 'remove'
        env:
          ACCOUNT_NAME: ${{ steps.params.outputs.account_name }}
          PRIVATE_ENDPOINT: ${{ steps.params.outputs.private_endpoint }}
          VNET_NAME: ${{ steps.params.outputs.vnet_name }}
          NSG_NAME: ${{ steps.params.outputs.nsg_name }}
        run: |
          # Only what hub/main.bicep names is deleted, in the order that lets each delete succeed.
          # present: success when the resource exists, failure when the platform says it does not, and a stop on any other error.
          present() {
            local err
            if err=$("$@" 2>&1 > /dev/null); then return 0; fi
            case "$err" in
              *NotFound*|*"Not Found"*|*"was not found"*|*"could not be found"*) return 1 ;;
              *) echo "$err" >&2; exit 1 ;;
            esac
          }
          if present az network private-endpoint show --resource-group "$HUB_RESOURCE_GROUP" --name "$PRIVATE_ENDPOINT"; then
            az network private-endpoint delete --resource-group "$HUB_RESOURCE_GROUP" --name "$PRIVATE_ENDPOINT"
            echo "Deleted the private endpoint $PRIVATE_ENDPOINT."
          else
            echo "The private endpoint $PRIVATE_ENDPOINT is not there."
          fi
          if [ "$ACTION" = "remove" ]; then
            if present az cognitiveservices account show --resource-group "$HUB_RESOURCE_GROUP" --name "$ACCOUNT_NAME"; then
              az cognitiveservices account delete --resource-group "$HUB_RESOURCE_GROUP" --name "$ACCOUNT_NAME"
              echo "Deleted the model account $ACCOUNT_NAME. It is soft-deleted; the next deploy restores it by itself."
            else
              echo "The model account $ACCOUNT_NAME is not there."
            fi
            if present az network vnet show --resource-group "$HUB_RESOURCE_GROUP" --name "$VNET_NAME"; then
              az network vnet delete --resource-group "$HUB_RESOURCE_GROUP" --name "$VNET_NAME"
              echo "Deleted the virtual network $VNET_NAME."
            else
              echo "The virtual network $VNET_NAME is not there."
            fi
            if present az network nsg show --resource-group "$HUB_RESOURCE_GROUP" --name "$NSG_NAME"; then
              az network nsg delete --resource-group "$HUB_RESOURCE_GROUP" --name "$NSG_NAME"
              echo "Deleted the network security group $NSG_NAME."
            else
              echo "The network security group $NSG_NAME is not there."
            fi
            budgets="https://management.azure.com/subscriptions/$(az account show --query id --output tsv)/resourceGroups/$HUB_RESOURCE_GROUP/providers/Microsoft.Consumption/budgets"
            # A plain assignment, not a command inside a condition: if the list cannot be read, the step stops here.
            found=$(az rest --method get --url "$budgets?api-version=2024-08-01" --query "length(value[?name=='meternaut-hub'])" --output tsv)
            case "$found" in
              0) echo "The budget meternaut-hub is not there." ;;
              1)
                az rest --method delete --url "$budgets/meternaut-hub?api-version=2024-08-01"
                echo "Deleted the budget meternaut-hub."
                ;;
              *)
                echo "::error::Could not tell whether the budget meternaut-hub exists (the list gave '$found')."
                exit 1
                ;;
            esac
          fi

      - name: What was done
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECK_LIMITS: ${{ inputs.check_limits }}
          ACCOUNT_NAME: ${{ steps.params.outputs.account_name }}
          GATEWAY_URL: ${{ steps.apim.outputs.gateway_url }}
        run: |
          {
            echo "### Hub: $ACTION, $JOB_STATUS"
            echo
            if [ "$JOB_STATUS" != "success" ]; then
              echo "**The run did not finish.** The log shows the step that failed; nothing below is promised."
              case "$ACTION" in
                what-if) echo "A what-if changes nothing." ;;
                deploy) echo "The network, the model account and the private endpoint may exist now (the endpoint costs a few euros a month while it does), and some Meternaut objects may already be in the API Management instance. Running \`deploy\` again is safe and repeats only what is missing. \`what-if\` shows what is there; \`pause\` and \`remove\` take it away." ;;
                pause|remove) echo "Part of it may still exist, the private endpoint included: it costs a few euros a month while it does. Running the same action again is safe." ;;
              esac
            else
              case "$ACTION" in
                what-if) echo "Nothing was changed. Read the two lists above: what a deploy would do in Azure, and in the API Management instance." ;;
                deploy)
                  echo "The model account \`$ACCOUNT_NAME\` is behind a private endpoint in resource group \`$HUB_RESOURCE_GROUP\`, the Meternaut objects are in the API Management instance, and the checks of the hub passed."
                  echo "Route for the learning demonstration: \`${GATEWAY_URL%/}/meternaut/llm/v1/chat/completions\` (the key is the \`meternaut-learning-demo-dev-sub-01\` subscription; it is not shown here)."
                  if [ "$CHECK_LIMITS" = "true" ]; then echo "The token rate was checked and the gateway refused as designed."; else echo "The token rate was not checked in this run (check_limits)."; fi ;;
                pause) echo "The Meternaut objects and the private endpoint are gone. The model account, the network and the budget stay and cost nothing while idle. Deploy again to bring it back." ;;
                remove) echo "Everything this workflow made is gone, and the Meternaut objects are out of the API Management instance. The model account is soft-deleted; the next deploy restores it by itself." ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"
