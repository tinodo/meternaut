name: Hub

# The only way anything of Meternaut reaches Azure (AGENTS.md rule 18). It began as the workflow of the Citadel governance hub: the owner's existing API Management instance with Microsoft's
# Citadel rules, and the private model account behind it. Since 2026-11-07 Meternaut makes, changes and reads nothing on that instance (the owner ordered the undo of what it added): the actions
# that made objects on it are gone. The AI Gateway (Azure's separate service) was deployed on 2026-11-07, at the owner's written request, and it is the governance hub now: every model call of Meternaut
# goes through it, with no direct path (AGENTS.md rule 15 (c)). The Detective and the Skeptic of the cases app call it, so the action cases needs the gateway first. The agents in Foundry go through it too: the switch
# of step 2 (AGENTS_VIA_AI_GATEWAY in tools/environment-params.py) is on in code, and the order of the real run is aigateway, about ten minutes, foundry, cases, cases-run. The outcome of that run is recorded in the
# changelog afterwards. Its front door is public only: the action aigateway stops at its first step unless the input public_ai_gateway_requested is set, which only the owner's written request for a public AI Gateway allows.
# The usage recording (made for the calls of that instance) and the first model account were removed on 2026-11-07 because nothing used them any more: the action retire-old deletes what is left of them.
# Nothing starts this workflow but a click on "Run workflow" in the Actions tab (workflow_dispatch), by the owner's account, on main: the guard of the job says so, and tools/workflow-lint.py fails a change that would
# make it start any other way. It runs in this repository, which is public, so a run costs no minutes of GitHub Actions and its log is readable by anyone. That is why every identifier of the owner's estate is a secret of
# the GitHub environment hub: GitHub masks a secret in the log and in a step summary from the first line, the `env:` block that the runner prints at the head of a step before any step of ours could mask anything
# included, and it does not mask a variable. Only plain configuration (the resource group, the region, the budget and the switch of the Teams bot) is a variable. Nothing is published as an output of the job: GitHub redacts
# an output that holds a registered secret, so it would arrive empty. The step "Mask the identifiers of the estate" is the second line (it also covers the forms of a secret that GitHub does not know), and a step that reads an
# identity or a client id from Azure masks it as soon as it has read it.
# The job is bound to the environment hub, which accepts a deployment from the branch main alone. It signs in to Azure with OpenID Connect and azure/login, as the deploy identity, whose federated credential trusts the subject
# of that environment and no other: no pull request, no other branch and no other environment can sign in, and no credential is stored anywhere. main is protected by a ruleset (a pull request and the check `checks`, no force push,
# no deletion, no bypass), and what is on main is what runs with the deploy identity, so a change to .github/, tools/, environment/, the tests or AGENTS.md is read in full before it is merged (AGENTS.md rule 37).
# "what-if" reads and changes nothing.
# It does not run the tests again (AGENTS.md rule 35). The unit tests, the workflow lint, the Bicep lint and the selftest of the drift tool run once, in CI (checks.yml), when a commit is pushed to main, and an early step of every
# run here asks GitHub, read only, whether CI passed for exactly this commit and stops the run, whatever its action, when it did not.
# What it does, and what to set up once before the first run: environment/BOOTSTRAP.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "what-if: show what the next steps would change and change nothing. model-side: the virtual network with its subnets, and the budget (the name is old, from the time when it also made a model account; it makes none now). base: the parts that the other actions build on, which are a Log Analytics workspace, an Application Insights component and a storage account, with the storage account's private endpoints and without any key; the storage account takes no public traffic (its public network access is Disabled and its private endpoints are the only way in, so from then on only the apps and the Operator reach its queue), and after its deploy the action reads that back from Azure. retire-old: delete what Meternaut does not use any more, in the project's resource group and nowhere else, and nothing else: the usage recording that was made for the calls of the owner's old API Management instance (the usage function app, its plan and its private endpoint, the Cosmos DB account and its private endpoint, and the event hubs ai-usage, pii-usage and usage-control), the old model account (its private endpoint, and then the account itself, which it purges so that its name and its quota are free) and the identity id-meternaut-usage; it reads each one first, deletes it when it is there, reads back until it is gone, and says on one line for each one whether it was deleted or was not there, and then reads back that the function subnet snet-func is free (no app but the cases app and the Teams bot's app is integrated with it), which the action cases needs only while the web page's app is on Flex Consumption; it takes no input, needs no other action first and is safe to run twice. retire-event-hubs: delete the Event Hubs namespace that carried the control event of the cases app before the control message moved to a Storage queue, and its private endpoint, in the project's resource group and nowhere else: the private endpoint, then the namespace (which takes its hub cases-control and that hub's consumer group with it), then the container azure-webjobs-eventhub in the storage account, which held the namespace's checkpoints; run it only after the action cases-run has proved the queue path, because it removes the old channel; it reads each one first, deletes it when it is there, reads back until it is gone, and says on one line for each one whether it was deleted or was not there; it refuses to delete anything while the control queue cases-control is not there, takes no input and is safe to run twice, and on an estate that never had a namespace it finds nothing and passes. cases: the first cases, which is the function app that serves the web page and runs the Watch, on the plan that CASES_APP_PLAN in tools/environment-params.py names (Basic, which is B1 and always on, or Flex Consumption, which scales to zero and bills per execution and waits for a later try; when that value changes, the action first deletes the app of the other kind and its plan, and then makes the new ones; whatever an earlier run that stopped half way left in the way is cleared from the state that Azure shows, each thing read first and read again after, and a gateway time-out of the platform is tried again: a private endpoint of the app that is Disconnected, a plan of the other kind with no app, and the role assignments of an identity that is gone that the deploy would rewrite), on the base's network and storage, with its own system-assigned identity and one user-assigned identity for the console's sign-in, a control queue (cases-control, in the base's storage account), a longer retention of the traces and the History workbook; its Watch changes no resource of the estate (with the investigation on it also creates agents and conversations in its own Foundry project), and it needs the base and the AI Gateway first: every model call of its Detective and Skeptic goes through the gateway (AGENTS.md rule 15 (c)), so it reads the gateway's host name from the service and stops before it changes anything when the gateway is not there (a what-if previews with a placeholder). The switch AGENTS_VIA_AI_GATEWAY in tools/environment-params.py is on, so it gives the app the model names `aigateway/<alias>` for the agents, which name the project's connection to the AI Gateway, and needs that connection first. With the switch set to False, which is the way back, it gives the plain model names. It publishes the app's code from inside the network, in a container group of the Operator that signs in as the deploy identity with a token of the run and goes through the app's private endpoint, so on an estate that has no Operator yet it deploys and stops at the publish: the order is then base, cases, operator, and then cases again. It then checks the web page's front door as loop-check does.         cases-run: start one Watch through the control queue (the Operator puts one message in it) and read its History from the telemetry, both by the Operator from inside the network: it needs operator first. page-latency: measure how fast the web page answers, by the Operator from inside the network over the app's private endpoint and with no credential: a request to /healthz every ten seconds for the minutes of the input minutes (20 at the most), then a quiet gap and three requests after it, so that a start from zero shows; the step summary gets the count, the median, the 95th percentile, the slowest, and how many requests were not 200 or took more than 5 and more than 15 seconds. It only reads, and it needs operator first. The rule that it serves is in docs/proposals/07-private-by-default.md (the web page on Flex Consumption). plant: make waste of Meternaut's own (an unattached disk, and with plant_public_ip an unassigned public IP address, and with plant_vm a virtual machine that nothing uses, with its network interface and its OS disk) in the project's resource group,         tagged for the loop, so that the whole loop can be shown on something that belongs to nobody else. loop-check: knock at the web page's front door without a sign-in and pass only when nobody gets a page: from this runner, at the name that people open, and, when the cases app takes no public traffic and no host name of a gateway is set, from inside the network, in a short-lived container group of the Operator, at the app's own name (it then needs operator first). foundry: the Foundry resource of the agents (the model account cannot hold projects, so this is a second resource): a project, the same models, a guardrail, one private endpoint and the connection that sends the agents' traces, with no key; it needs base and cases to have run once, and it is run before the next cases, which is then given the project's address. The switch AGENTS_VIA_AI_GATEWAY in tools/environment-params.py is on, so it also makes the project's connection to the AI Gateway, with the project's own identity and no key, and reads it back: it needs aigateway first. With the switch set to False, which is the way back, it makes no connection and leaves an existing one alone. operator: the Operator, the executor that works inside the virtual network for what the workflow cannot do from outside it once the services are private (docs/proposals/07-private-by-default.md): its identity, the subnet of its container groups and two roles (Reader on the project's group, and Storage Queue Data Contributor on the control queue cases-control, which the action cases makes, so it runs after it); it waits until the landing zone has put its route table on that subnet, and it starts nothing, so nothing is paid until a run uses it. The action cases publishes its code through it, as the deploy identity. operator-probe: run operator/probe.sh once in a short-lived container group of the Operator and print what it finds (does the identity sign in, do the names of private endpoints resolve to private addresses, which addresses can a group reach, and how does a package get in); the group is deleted at the end whatever happens, and it costs cents. It needs operator first. aigateway: refused at its first step unless the input public_ai_gateway_requested is set, which only the owner's written request for a public AI Gateway allows (its frontend is public and cannot be made private). When it is set: the AI Gateway of the agents' model calls (Azure's AI Gateway, a preview service that is not API Management): first its subnet, which is delegated to it and made only when it is not there, and, after the landing zone's route table is on that subnet, the gateway with a system-assigned identity, a model and an alias for each model of the agents' Foundry resource, content safety on each model, and AI Gateway Models User for the Operator's identity and for the cases app's identity (the Detective and the Skeptic call the gateway with it; the role is made once the app has an identity, which the action cases makes), with no key; it needs foundry and operator first. The gateway is made on the subnet as the landing zone leaves it, so the action makes the subnet, waits for the landing zone's route table on it (20 minutes at most: when the table does not come the gateway is not made, and a second run repeats only what is missing), signs in again and then makes the gateway. Its frontend is public whatever is asked, because the service has no private frontend, so access is by Microsoft Entra ID and role assignments only. After the deploy the action applies the gateway-wide token, request and cost limits, deletes the built-in key master when the service lets it be deleted, and reads everything back; it changes nothing of the model names of the agents: they keep calling their model deployments until foundry and cases have run. The switch AGENTS_VIA_AI_GATEWAY is on, so it also gives the Foundry project's identity AI Gateway Models User on the gateway, and needs foundry to have run. The order of the real run is aigateway, about ten minutes, foundry, cases, cases-run. aigateway-check: call each alias of the AI Gateway once with the Operator's token, and once without a token and once with a wrong alias, by the Operator from inside the network (the check tool runs in a short-lived container group of the Operator):         it needs aigateway and operator first, and about ten minutes after aigateway, because a new role takes up to ten minutes to apply. governance: the policy, the alerts and the workbook of the AI security (AGENTS.md rule 33; docs/proposals/10-ai-security-and-governance.md), in the project's resource group and nowhere else: Azure Policy at the group (the built-in policies for approved models and for model eligibility, each with the effect Audit or Deny that APPROVED_MODELS_EFFECT and MODEL_ELIGIBILITY_EFFECT in tools/environment-params.py say, no exemption and no identity, and the guardrail initiative while the tenant offers it), the alert rules (one for each signal, every 15 minutes or less often) with an action group that mails ENV_ALERT_EMAILS, the workbook Meternaut AI security, the retention of the AI Gateway's two telemetry tables, and the Foundry resource's diagnostic setting only where the landing zone has made none. It reads first and stops, saying which right, who gives it and where, when the deploy identity does not hold Resource Policy Contributor on the group or an identity of the access list (environment/aigateway/contracts.json) is not there yet; afterwards it reads the result back with tools/drift-check.py. It needs cases, foundry and operator first. gateway-telemetry: the AI Gateway's telemetry exporter, which sends the gateway's logs, traces and metrics to the project's Application Insights component with the gateway's own identity, no key and no prompt or answer; it stops before it changes anything, and says what a person does, unless the resource provider Microsoft.Monitor is registered, the component reports its OpenTelemetry endpoints (the action base turns the ingestion on while GATEWAY_TELEMETRY in tools/environment-params.py is True) and the gateway's identity holds Monitoring Metrics Publisher on the component's data collection rule (environment/BOOTSTRAP.md). It needs aigateway and base first. drift-check: read Azure and say, for each control of the AI security, PASS, FAIL or UNKNOWN (tools/drift-check.py): the Foundry resource, its deployments and guardrail, the model lifecycle, the AI Gateway's policies, models, roles and telemetry, the project's connection, the policies and their compliance, the roles and the network exposure of the group, the release that the cases app runs against main, and the lines that the app's own daily check logged. It only reads (GET requests and two queries), as the deploy identity, so the check does not rest on the app; the run fails when a control fails, and the summary says which are fail-closed. The workflow drift.yml runs the same tool with an identity of its own that can only read. agents-drift: the second reader of the drift of the agents: from inside the network, in a short-lived container group of the Operator, read the Foundry project with GET calls only (the agents with their stored definitions, the project's connections) and judge it against agents.lock.json by the rules of the app's own daily check, one line for each control; it changes nothing and needs operator, aigateway and foundry first. foundry-evals: by the Operator from inside the network, run the command of the input evals_command: probe (reads which route of the evaluations API the project answers), run (replays the invented cases of evaluation/cases.jsonl through the Investigator and evaluates the answers; every model call goes through the AI Gateway and is held to evaluation/limits.json, and the number of calls is printed), rule (prints the continuous evaluation rule) or rule-apply (makes it); it needs operator, aigateway, foundry and cases first. foundry-redteam: by the Operator from inside the network, attack a synthetic copy of the Investigator (the locked instructions, the same model alias through the same connection, no tools, made and deleted by the tool, never the production agent) with the cloud red team of Foundry or, as the fallback, with the invented attacks of evaluation/redteam-prompts.jsonl, held to evaluation/limits.json; it needs the same first. agent365-check: by the Operator from inside the network, read with Microsoft Graph and the Foundry resource whether the tenant has the Agent 365 licence, whether the agents' identities have an owner and a sponsor and whether Agent 365 logging is on, and list what a person checks in the portals; it changes nothing. teams: the Teams bot (docs/proposals/13-teams-and-outlook.md), refused at its first step unless the input public_teams_bot_requested is set, which only the owner's written request for a public endpoint allows (the bot's messaging endpoint is public), and the repository variable TEAMS_BOT_ENABLED is True. When both are set: the user-assigned identity that is the bot, the Azure Bot resource (the free tier, with its Teams channel, no key), a Flex Consumption function app of its own with two functions (the messaging endpoint and the timer that offers cards), and its roles on the base's storage account (environment/teams/main.bicep); the code is built (tools/build-teams-bot.sh), published through the app's deployment site (not proved yet), read back from Azure and knocked at with no token (tools/teams-check.py); it needs model-side, base and cases first, and the resource provider Microsoft.BotService registered once by a person. It prints the bot's client id, which tools/teams-package.py needs; a Teams administrator uploads the package by hand."
        type: choice
        required: true
        default: what-if
        options:
          - what-if
          - model-side
          - base
          - retire-old
          - retire-event-hubs
          - foundry
          - cases
          - cases-run
          - page-latency
          - plant
          - loop-check
          - operator
          - operator-probe
          - aigateway
          - aigateway-check
          - governance
          - gateway-telemetry
          - drift-check
          - agents-drift
          - foundry-evals
          - foundry-redteam
          - agent365-check
          - teams
      minutes:
        description: "Only with page-latency: how many minutes the measurement takes, from 1 to 20 (the Operator's container group has to finish within 25 minutes). Every other action ignores it."
        type: string
        required: false
        default: "20"
      public_ai_gateway_requested:
        description: "Only with aigateway: set it only when the owner has asked in writing for a public AI Gateway. The AI Gateway's front door is public and cannot be made private, so the action aigateway stops at its first step, before it signs in to Azure, unless this is set. aigateway-check, what-if and every other action ignore it."
        type: boolean
        required: false
        default: false
      public_teams_bot_requested:
        description: "Only with teams: set it only when the owner has asked in writing for a public Teams bot. The bot's messaging endpoint is public by necessity (Teams calls it from the internet, and nothing documented closes it to the Bot Framework Connector by address), so the action teams stops at its first step, before it signs in to Azure, unless this is set and the repository variable TEAMS_BOT_ENABLED is True. what-if and every other action ignore it."
        type: boolean
        required: false
        default: false
      plant_public_ip:
        description: "Only with plant: also plant an unassigned public IP address (about 3.65 US dollars a month while it stays). The landing zone has to allow a public IP address in the project's group."
        type: boolean
        required: false
        default: false
      plant_vm:
        description: "Only with plant: also plant a virtual machine that nothing uses, so that the families of change that stop a machine and resize it can be shown on it: a Standard_B4als_v2 (tools/environment-params.py, PLANTED_VM_SIZE) with no public IP address, no account and no key, its network interface in the subnet snet-pe and an empty 4 GiB OS disk. At the price list of Sweden Central (the public Retail Prices API, read on 2026-11-09) it costs 0.138 US dollars an hour while it runs, nothing for compute once it is stopped and released, and 0.0389 an hour after a resize to Standard_B2als_v2; its OS disk adds 0.30 US dollars a month. The action deletes nothing, and a second planting makes a second machine under a new name."
        type: boolean
        required: false
        default: false
      evals_command:
        description: "Only with foundry-evals: probe (reads which route of the evaluations API the project answers: no model call), run (replays the invented cases of evaluation/cases.jsonl through the Investigator and evaluates them: every model call goes through the AI Gateway and is held to evaluation/limits.json), rule (prints the continuous evaluation rule and makes nothing) or rule-apply (makes it: a rule that evaluates a sample of the Investigator's real responses). Every other action ignores it."
        type: choice
        required: false
        default: probe
        options:
          - probe
          - run
          - rule
          - rule-apply
      evals_judge:
        description: "Only with foundry-evals and evals_command run: none (only the evaluators that need no judge model: the generally available fallback), connection (also the quality evaluators, with a judge model that is reached through the project's connection to the AI Gateway, a preview) or auto (connection first, and none when the service refuses it). A judge is never a direct deployment. Every other action ignores it."
        type: choice
        required: false
        default: none
        options:
          - none
          - connection
          - auto
      redteam_mode:
        description: "Only with foundry-redteam: cloud (the AI Red Teaming Agent of Foundry, a preview that is offered in some regions only), dataset (the invented attacks of evaluation/redteam-prompts.jsonl, graded by code: the fallback) or auto (cloud first, dataset when the service does not offer it). Either way the target is a synthetic copy of the Investigator that has no tools, never the production agent. Every other action ignores it."
        type: choice
        required: false
        default: auto
        options:
          - auto
          - cloud
          - dataset

permissions:
  contents: read
  # Only to read whether the checks of CI passed for this commit (the step "The checks of CI have passed for this commit"): the list of the runs of one workflow. Nothing here writes to the repository or to Actions.
  actions: read
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  hub:
    name: Hub (${{ inputs.action }})
    if: github.actor == 'tinodo' && github.ref == 'refs/heads/main'
    # The environment hub: it accepts a deployment from the branch main alone, it holds the identifiers of the estate as secrets, and the federated credential of the deploy identity trusts its subject and no other (environment/BOOTSTRAP.md).
    environment: hub
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ACTION: ${{ inputs.action }}
      # The identifiers of the owner's estate are secrets of the environment hub: this repository is public, its logs are public, GitHub masks a secret in the log and in a step summary and does not mask a variable. None is a
      # credential (each is an identifier, an address or a list of them), and an unset secret reads as an empty string, which the tools take as not set. The resource group, the region and the budget are plain configuration and stay variables.
      ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ENV_RESOURCE_GROUP: ${{ vars.ENV_RESOURCE_GROUP }}
      ENV_LOCATION: ${{ vars.ENV_LOCATION }}
      ENV_VNET_PREFIX: ${{ secrets.ENV_VNET_PREFIX }}
      ENV_PE_SUBNET_PREFIX: ${{ secrets.ENV_PE_SUBNET_PREFIX }}
      ENV_DNS_SERVERS: ${{ secrets.ENV_DNS_SERVERS }}
      ENV_OWNER: ${{ secrets.ENV_OWNER }}
      ENV_BUDGET_AMOUNT: ${{ vars.ENV_BUDGET_AMOUNT }}
      ENV_ALERT_EMAILS: ${{ secrets.ENV_ALERT_EMAILS }}
      CONSOLE_APP_CLIENT_ID: ${{ secrets.CONSOLE_APP_CLIENT_ID }}
      CONSOLE_PEOPLE: ${{ secrets.CONSOLE_PEOPLE }}
      CONSOLE_HOST_NAME: ${{ secrets.CONSOLE_HOST_NAME }}
      MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
      # What the owner has accepted of the policy state at the project's group (tools/drift-check.py): the policy exemptions that he knows of, and the policies with the effect Deny that are non-compliant and that he knows of.
      # They are secrets of the environment and not files, because they name the landing zone's own policies. Unset: those two controls say UNKNOWN and print what they found, so that he can accept it; the word none accepts nothing.
      DRIFT_ACCEPTED_EXEMPTIONS: ${{ secrets.DRIFT_ACCEPTED_EXEMPTIONS }}
      DRIFT_ACCEPTED_DENY: ${{ secrets.DRIFT_ACCEPTED_DENY }}
      PLANTED_ID: r${{ github.run_number }}
      PLANT_PUBLIC_IP: ${{ inputs.plant_public_ip }}
      PLANT_VM: ${{ inputs.plant_vm }}
      # The linux/amd64 manifest of mcr.microsoft.com/azure-cli 2.92.0, read from the registry on 2026-11-06: docs/proposals/07-private-by-default.md says how to read it again. Every step that runs
      # something in the Operator (the probe, and the check of the first cases) uses this one pin, which only a person changes, on purpose.
      OPERATOR_IMAGE: mcr.microsoft.com/azure-cli@sha256:67afdcb4f3efce0b33aadba0b8a72402b6f071741400fd75cc5cb8a1d7bf1d98
    steps:
      - name: Refuse the AI Gateway unless the owner asked for a public one in writing
        if: inputs.action == 'aigateway'
        env:
          PUBLIC_AI_GATEWAY_REQUESTED: ${{ inputs.public_ai_gateway_requested }}
        run: |
          # The AI Gateway's front door is public and cannot be made private (docs/proposals/08-ai-gateway.md), and the owner's rule is that nothing public is made unless he specifically asks for it
          # (AGENTS.md rule 15 (c)). So this action stops here, as the first step of the job, before anything is checked out, read or signed in to, unless the input says that he asked in writing.
          if [ "$PUBLIC_AI_GATEWAY_REQUESTED" != true ]; then
            echo "::error::This run does not deploy the AI Gateway: its front door is public and cannot be made private, and nothing public is made unless the owner has asked for it in writing. Set the input public_ai_gateway_requested only when he has. Nothing was changed."
            exit 1
          fi
          echo "The input public_ai_gateway_requested is set: the owner has asked in writing for a public AI Gateway."

      - name: Mask the identifiers of the estate in this run's log
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          # What a run prints is its log, and this repository is public, so the log is public. The identifiers of the estate are secrets of the environment hub, which GitHub masks by itself from the first line of the log, the `env:` block
          # that the runner prints at the head of a step included, so no step has to ask for that. This step is the second line, for what GitHub does not know: a secret that Azure writes in another case, the parts of a list and the
          # people of the console (a tool that prints one address of a list prints what no secret equals), the digest that ends the name of every resource of the project (it is worked out of the subscription and the resource group),
          # and the start of every address of a network range (a subnet and the address of a private endpoint are worked out of the range). The runner is asked to mask each of them from the next step on. A value of fewer than four
          # characters is not masked, so that the log stays readable, and neither is the word none, which is how the owner accepts nothing. Nothing is printed here but the mask commands, and a value is never shown. The resource group,
          # the region and the budget are plain configuration and are left alone.
          mask() {
            local value="${1//$'\r'/}"
            [ "${#value}" -ge 4 ] || return 0
            [ "${value,,}" != none ] || return 0
            value="${value//\%/%25}"
            value="${value//$'\n'/%0A}"
            echo "::add-mask::$value"
            echo "::add-mask::${value,,}"
            echo "::add-mask::${value^^}"
          }
          for value in "$ENV_SUBSCRIPTION_ID" "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$ENV_VNET_PREFIX" "$ENV_PE_SUBNET_PREFIX" "$ENV_OWNER" "$CONSOLE_APP_CLIENT_ID" "$CONSOLE_HOST_NAME" "$MAIL_SENDER"; do
            mask "$value"
          done
          for list in "$ENV_DNS_SERVERS" "$ENV_ALERT_EMAILS" "$DRIFT_ACCEPTED_EXEMPTIONS" "$DRIFT_ACCEPTED_DENY"; do
            mask "$list"
            read -ra items <<< "$(printf '%s' "$list" | tr ',\n\r\t' '    ')"
            for item in "${items[@]}"; do
              mask "$item"
            done
          done
          mask "$CONSOLE_PEOPLE"
          while IFS= read -r item; do
            mask "$item"
          done < <(printf '%s' "$CONSOLE_PEOPLE" | grep -oE '"(oid|name|mail)"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/^"[a-z]+"[[:space:]]*:[[:space:]]*"(.*)"$/\1/' || true)
          # The digest that ends the name of every resource: tools/environment-params.py digest(), the first eight digits of the SHA-256 of "<subscription>/<resource group>" in lower case.
          if [ -n "$ENV_SUBSCRIPTION_ID" ] && [ -n "$ENV_RESOURCE_GROUP" ]; then
            mask "$(printf '%s' "${ENV_SUBSCRIPTION_ID,,}/${ENV_RESOURCE_GROUP,,}" | sha256sum | cut -c1-8)"
          fi
          # The addresses that every address of a range starts with, as far as whole numbers go: 10.53.0. for 10.53.0.0/24, and 10.53. for 10.53.0.0/16 or a /22.
          starts() {
            local bits a b c d
            [[ "$1" == */* ]] || return 0
            bits="${1##*/}"
            IFS=. read -r a b c d <<< "${1%%/*}"
            [[ "$a.$b.$c.$d" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ && "$bits" =~ ^[0-9]{1,2}$ ]] || return 0
            if [ "$bits" -ge 24 ]; then mask "$a.$b.$c."; elif [ "$bits" -ge 16 ]; then mask "$a.$b."; fi
          }
          starts "$ENV_VNET_PREFIX"
          starts "$ENV_PE_SUBNET_PREFIX"

      - name: The checks of CI have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This run does not repeat the tests. The unit tests of the tools and of the app, the workflow lint, the Bicep lint and the selftest of the drift tool run once, in CI (checks.yml), when a commit is pushed
          # to main: about five of the eight minutes that a run of this workflow took on average were those tests, and a run still costs time (AGENTS.md rule 35). What is asked here instead takes seconds,
          # and it is asked of every action, the ones that only read as well: has the workflow checks.yml a completed, successful run for exactly this commit, started by a push to main? A run for a pull request, for another
          # commit, one that is still going and one that failed do not count, and nothing else of GitHub is looked at. It is a read of the list of runs with the run's own token (the permission actions: read); nothing is started or changed.
          if ! grep -Eq '^[0-9a-f]{40}$' <<< "$GITHUB_SHA"; then
            echo "::error::The commit of this run is not a git commit id, so the checks of CI cannot be looked up. Nothing was changed."
            exit 1
          fi
          if ! passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count' 2>&1); then
            echo "::error::GitHub did not say whether the checks of CI passed for commit $GITHUB_SHA ($(head -n 1 <<< "$passed")). Nothing was changed. Run the Hub again in a minute; if this stops it again, the workflow needs the permission actions: read."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+$' <<< "$passed" || [ "$passed" -lt 1 ]; then
            echo "::error::The checks have not passed for this commit: push it and let CI finish, then run the Hub again. What was looked for is a completed, successful run of the workflow checks.yml for commit $GITHUB_SHA that a push to main started; this run does not repeat the tests (AGENTS.md rule 35). Nothing was changed."
            exit 1
          fi
          echo "The checks of CI (checks.yml) have passed for commit $GITHUB_SHA, so this run does not repeat them."

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse the Teams bot unless the owner asked for a public endpoint in writing and the switch is on
        if: inputs.action == 'teams'
        env:
          PUBLIC_TEAMS_BOT_REQUESTED: ${{ inputs.public_teams_bot_requested }}
          TEAMS_BOT_ENABLED: ${{ vars.TEAMS_BOT_ENABLED }}
        run: |
          # The Teams bot's messaging endpoint is public by necessity (docs/proposals/13-teams-and-outlook.md): Teams calls it from the internet, and nothing documented closes it to the Bot Framework Connector by address. The owner's rule is that
          # nothing public is made unless he specifically asks for it (AGENTS.md rule 15 (c)). So this action stops here, before the tests, before any read of Azure and before any sign-in, unless the input says that he asked in writing
          # and the repository variable TEAMS_BOT_ENABLED, the switch of the bot, is True. Only the words true and True count.
          if [ "$PUBLIC_TEAMS_BOT_REQUESTED" != true ]; then
            echo "::error::This run does not deploy the Teams bot: its messaging endpoint is public, and nothing public is made unless the owner has asked for it in writing. Set the input public_teams_bot_requested only when he has. Nothing was changed."
            exit 1
          fi
          if [ "$TEAMS_BOT_ENABLED" != true ] && [ "$TEAMS_BOT_ENABLED" != True ]; then
            echo "::error::This run does not deploy the Teams bot: the repository variable TEAMS_BOT_ENABLED is not True. It is the switch of the bot, and it stays False until the owner says so. Nothing was changed."
            exit 1
          fi
          echo "The input public_teams_bot_requested is set and TEAMS_BOT_ENABLED is True: the owner has asked in writing for a public Teams bot."

      - name: Set up Python 3.13, the runtime of the function app
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: The templates compile, for the check of their parameter files
        run: |
          # Only what this run needs from Bicep: each template compiled, because the builder of the parameter files checks every file against the template that it is for (tools/environment-params.py check). The unit tests,
          # the workflow lint, the Bicep lint and the selftest of the drift tool are not run here: CI ran them for exactly this commit, which the second step of the job has just read.
          az bicep build --file environment/main.bicep --outfile "$RUNNER_TEMP/environment.json"
          az bicep build --file environment/base/main.bicep --outfile "$RUNNER_TEMP/base.json"
          az bicep build --file environment/foundry/main.bicep --outfile "$RUNNER_TEMP/foundry.json"
          az bicep build --file environment/cases/main.bicep --outfile "$RUNNER_TEMP/cases.json"
          az bicep build --file environment/cases/planted.bicep --outfile "$RUNNER_TEMP/planted.json"
          az bicep build --file environment/operator/main.bicep --outfile "$RUNNER_TEMP/operator.json"
          az bicep build --file environment/aigateway/main.bicep --outfile "$RUNNER_TEMP/aigateway.json"
          az bicep build --file environment/aigateway/subnet.bicep --outfile "$RUNNER_TEMP/aigateway-subnet.json"
          az bicep build --file environment/aigateway/telemetry.bicep --outfile "$RUNNER_TEMP/gateway-telemetry.json"
          az bicep build --file environment/governance/main.bicep --outfile "$RUNNER_TEMP/governance.json"
          az bicep build --file environment/teams/main.bicep --outfile "$RUNNER_TEMP/teams.json"

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the object id of the signed-in identity
        id: me
        run: |
          # The workflow's identity may not read the directory, so the id is read from the claims of its own token (nothing else of the
          # token is read or printed). The id is used by the action aigateway, which reads the condition of this identity's right to assign roles before it makes the gateway.
          oid=$(python3 tools/cases-check.py whoami)
          # The object id of the deploy identity is in the text of many Azure errors ("The client ... with object id ... does not have authorization"), and no secret equals it, so it is masked at once.
          [ -z "$oid" ] || printf '::add-mask::%s\n::add-mask::%s\n' "$oid" "${oid^^}"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: The resource group is there
        run: az group show --name "$ENV_RESOURCE_GROUP" --query "{name:name, location:location, state:properties.provisioningState}" --output table

      - name: Mask the identities that exist in the project's resource group
        run: |
          # The object id and the client id of an identity are in the text of Azure errors, in the output of a preview and in what a tool prints, and no secret equals them, so GitHub does not mask them, and this log is public.
          # The identities of the project's resource group are read once, here, and each id is masked for the rest of the run: the user-assigned identities (both ids) and the identity of every resource that has one of its own
          # (the apps, the Foundry resource, the AI Gateway). An identity that does not exist yet is masked by the step that reads it, the moment it is read. Nothing is changed, and nothing is printed but the mask commands and a count.
          # The user-assigned identities are listed by their resource provider in the project's group (a group holds a handful, which one page of the list holds), and the identity of every other resource by the list of the group's resources.
          url="https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities?api-version=2023-01-31"
          ids=$(az rest --method get --url "$url" --query "value[].[properties.principalId, properties.clientId]" --output tsv)
          ids="$ids"$'\n'"$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --query "[].identity.principalId" --output tsv)"
          masked=0
          for id in $ids; do
            if grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$id"; then
              printf '::add-mask::%s\n::add-mask::%s\n' "$id" "${id^^}"
              masked=$((masked + 1))
            fi
          done
          echo "Masked $masked identity ids of resource group $ENV_RESOURCE_GROUP."

      - name: Read the start date of the budget
        id: budget
        run: |
          # A budget keeps its start date, so an existing one is read and passed on again; a new one starts in the current month.
          # The group's budgets are listed and filtered by name: a missing budget is an empty answer, so no error text is read
          # (the service's text for "not found" differs from one API to the next).
          url="https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Consumption/budgets?api-version=2024-08-01"
          start=$(az rest --method get --url "$url" --query "value[?name=='meternaut-hub'].properties.timePeriod.startDate | [0]" --output tsv)
          if [ -n "$start" ] && [ "$start" != "None" ]; then
            start="${start:0:10}"
            echo "The budget exists and started on $start."
          else
            start="$(date -u +%Y-%m-01)"
            echo "There is no budget yet; a new one starts on $start."
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Find out what of the network is there already
        id: network
        run: |
          # A template that makes a network resource again at its next run takes away what the landing zone's network manager added to it: the manager puts a route table on every subnet some
          # minutes after the subnet is made, and a subnet that is written again without the table cannot reach the landing zone's DNS, so an app on it cannot start (CHANGELOG.md, 2026-11-05).
          # So the virtual network, the first cases' subnet and the Operator's subnet are made once and then left alone: the templates make them only while they are not there, and this is where the workflow finds out.
          vnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut"
          exists() {
            local found
            if found=$(az rest --method get --url "https://management.azure.com${1}?api-version=2025-05-01" --query name --output tsv 2>&1); then
              echo true
            elif grep -Eqi 'NotFound|404' <<< "$found"; then
              echo false
            else
              echo "::error::${1##*/} could not be read: $found" >&2
              return 1
            fi
          }
          network=$(exists "$vnet")
          if [ "$network" = true ]; then subnet=$(exists "$vnet/subnets/snet-cases"); else subnet=false; fi
          if [ "$network" = true ]; then ops=$(exists "$vnet/subnets/snet-ops"); else ops=false; fi
          echo "The virtual network is there: $network. The subnet snet-cases is there: $subnet. The subnet snet-ops is there: $ops."
          echo "network_exists=$network" >> "$GITHUB_OUTPUT"
          echo "web_subnet_exists=$subnet" >> "$GITHUB_OUTPUT"
          echo "ops_subnet_exists=$ops" >> "$GITHUB_OUTPUT"
          # The AI Gateway's subnet is made once too (AGENTS.md rule 27): the service takes the subnet when the gateway is made and treats it as read-only afterwards.
          if [ "$network" = true ]; then aigw=$(exists "$vnet/subnets/snet-aigw"); else aigw=false; fi
          echo "The subnet snet-aigw is there: $aigw."
          echo "aigw_subnet_exists=$aigw" >> "$GITHUB_OUTPUT"

      - name: Work out which release the cases app is given, the commit and the digest of its own files
        id: release
        if: inputs.action == 'cases' || inputs.action == 'what-if'
        run: |
          # The release that this run deploys (docs/proposals/10-ai-security-and-governance.md, "The release that runs"): the git commit that the run was made from, and the digest of the app's own files at that commit
          # (tools/source-digest.py: the files that the build puts in the package; the libraries are pinned by hash in requirements.txt, which is one of them, and a zip file would change with every run). The template
          # gives them to the app as the settings BUILD_COMMIT and PACKAGE_SHA256, and a later step writes them as tags of the app once the code has been published and the app answers, which is what a reader of the
          # resource group (and tools/drift-check.py) sees. Values, not secrets: nothing here is read from Azure. The preview (what-if) works it out too, so that it shows the two settings of the app changing to this
          # commit and not going away (a template that is given no value writes no setting, and a preview without one would say that the app loses them).
          commit="$GITHUB_SHA"
          if ! grep -Eq '^[0-9a-f]{40}$' <<< "$commit"; then
            echo "::error::The commit of this run is not a git commit id, so the release cannot be recorded. Nothing was changed."
            exit 1
          fi
          digest=$(python3 tools/source-digest.py src/case-functions)
          if ! grep -Eq '^[0-9a-f]{64}$' <<< "$digest"; then
            echo "::error::The digest of the cases app's files could not be worked out. Nothing was changed."
            exit 1
          fi
          echo "build_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "The release of this run: commit $commit, digest of the app's own files $digest."

      - name: Work out the settings
        id: params
        env:
          ENV_BUDGET_START: ${{ steps.budget.outputs.start }}
          BUILD_COMMIT: ${{ steps.release.outputs.build_commit }}
          PACKAGE_SHA256: ${{ steps.release.outputs.package_sha256 }}
          ENV_NETWORK_EXISTS: ${{ steps.network.outputs.network_exists }}
          ENV_WEB_SUBNET_EXISTS: ${{ steps.network.outputs.web_subnet_exists }}
          ENV_OPS_SUBNET_EXISTS: ${{ steps.network.outputs.ops_subnet_exists }}
          ENV_AIGW_SUBNET_EXISTS: ${{ steps.network.outputs.aigw_subnet_exists }}
        run: |
          # This first pass is a preview: it gives the names, before the facts that are read from Azure below are known. Nothing of the owner's API Management instance is read or made here: since 2026-11-07
          # no action looks at the instance, its identity or its loggers.
          # The AI Gateway's policy file goes in too: it is checked against the models and against the owner's standing limit, and its files are written only when the virtual network has a free range for the gateway's subnet.
          policies="--aigateway-policies environment/aigateway/policies.json"
          exists() {
            local found level="${3:-error}"
            if found=$(az rest --method get --url "https://management.azure.com${1}?api-version=${2}" --query name --output tsv 2>&1); then
              echo true
            elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
              echo false
            else
              echo "::${level}::${1##*/} could not be read: $found" >&2
              return 1
            fi
          }
          outputs=$(python3 tools/environment-params.py build --models environment/models.json --out-dir "$RUNNER_TEMP" --preview $policies)
          echo "$outputs" >> "$GITHUB_OUTPUT"
          {
            # The facts of the Foundry resource, which the cases app and the Foundry file need. The Foundry file names the cases app's identity
            # (its object id: the Foundry User role goes to it), and so does the AI Gateway file (the role AI Gateway Models User goes to it: the app's model calls go through the gateway). The cases app is given the project's address only while the project is
            # in Azure: an address with no project behind it would switch the investigation on and make every run fail. Only the actions that use an answer look for it, so that a read
            # that Azure throttles or refuses cannot stop an action that has nothing to do with the Foundry resource: what-if shows both, foundry and aigateway need the identity, cases needs the project.
            # The identity is the app's own system-assigned one, which is read from the app: it is "none yet" until the action cases has made the app, and the files then hold a placeholder (the Foundry file) or nothing (the gateway file).
            cases_app=$(sed -n 's/^cases_function_app_name=//p' <<< "$outputs")
            foundry_account=$(sed -n 's/^foundry_account_name=//p' <<< "$outputs")
            foundry_project=$(sed -n 's/^foundry_project_name=//p' <<< "$outputs")
            project_url="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$foundry_account/projects/$foundry_project"
            cases_site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$cases_app"
            cases_system_principal=""
            foundry_exists=false
            case "$ACTION" in
              what-if|foundry|aigateway)
                if cases_system_principal=$(az rest --method get --url "https://management.azure.com${cases_site}?api-version=2024-04-01" --query identity.principalId --output tsv 2>&1); then
                  :
                elif grep -Eqi 'NotFound|\b404\b' <<< "$cases_system_principal"; then
                  cases_system_principal=""
                else
                  echo "::error::The cases app could not be read: $cases_system_principal" >&2
                  exit 1
                fi
                if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$cases_system_principal"; then cases_system_principal=""; fi
                [ -z "$cases_system_principal" ] || printf '::add-mask::%s\n::add-mask::%s\n' "$cases_system_principal" "${cases_system_principal^^}"
                if [ -n "$cases_system_principal" ]; then echo "The cases app's system-assigned identity exists; its principal id goes into the Foundry file and the AI Gateway file."; else echo "The cases app has no system-assigned identity yet (the action cases makes the app with it); the Foundry file holds a placeholder and the AI Gateway file gives no role to the app."; fi ;;
            esac
            # The Operator's own identity (id-meternaut-operator): the Foundry file gives it the Foundry User role on the project, which the tools that check the agents from inside the network need (agents-drift, foundry-evals and foundry-redteam:
            # docs/proposals/11-agent-harness-and-evaluation.md). It is read as the AI security reads it. The action operator makes the identity, so "not there yet" is no error: the file then asks for no role, and a run of foundry
            # after operator makes it. Only foundry and what-if read it; every other action leaves it empty, which the builder takes as not given.
            operator_principal=""
            if [ "$ACTION" = foundry ] || [ "$ACTION" = what-if ]; then
              if operator_principal=$(az rest --method get --url "https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-meternaut-operator?api-version=2023-01-31" --query properties.principalId --output tsv 2>&1); then
                :
              elif grep -Eqi 'NotFound|\b404\b' <<< "$operator_principal"; then
                operator_principal=""
              elif [ "$ACTION" = what-if ]; then
                echo "::warning::The Operator's identity could not be read: $operator_principal"
                operator_principal=""
              else
                echo "::error::The Operator's identity could not be read: $operator_principal" >&2
                exit 1
              fi
              if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$operator_principal"; then operator_principal=""; fi
              [ -z "$operator_principal" ] || printf '::add-mask::%s\n::add-mask::%s\n' "$operator_principal" "${operator_principal^^}"
              if [ -n "$operator_principal" ]; then echo "The Operator's identity exists; its object id goes into the Foundry file (the Foundry User role on the project)."; else echo "The Operator's identity is not there yet (the action operator makes it); the Foundry file asks for no role for it: run foundry again after operator."; fi
            fi
            case "$ACTION" in
              cases)
                if ! foundry_exists=$(exists "$project_url" 2025-06-01); then
                  echo "::error::The action cases gives the cases app the address of the Foundry project only when the project is in Azure, so it has to know, and the read of the project failed (the message above). Nothing was changed: run cases again."
                  exit 1
                fi
                echo "The Foundry project is in Azure: $foundry_exists." ;;
              what-if)
                if ! foundry_exists=$(exists "$project_url" 2025-06-01 warning); then
                  echo "::warning::The preview of the cases app assumes that the Foundry project is not in Azure, because the read of the project failed (the message above)."
                  foundry_exists=false
                fi
                echo "The Foundry project is in Azure: $foundry_exists." ;;
              *) echo "The action $ACTION does not use the Foundry project, so it is not looked for." ;;
            esac
            # The AI Gateway. Every model call of the cases app goes through it (AGENTS.md rule 15 (c)), so the action cases reads the gateway's host name from the service and stops here, before anything is changed, when
            # the gateway is not there: the Detective and the Skeptic have no route without it. The host name is read from the service (properties.frontend.defaultHostname) and never made up. what-if reads it too, and
            # previews with a placeholder when the gateway is not there. The action foundry reads it only while the switch AGENTS_VIA_AI_GATEWAY in tools/environment-params.py is on (it is True since the owner's order of
            # 2026-11-07: docs/proposals/08-ai-gateway.md, step 2): the host is then the target of the project's connection. The builder says in its first answer whether the switch is on. The switch alone also decides whether
            # aigateway reads the object id of the Foundry project's identity, which then gets AI Gateway Models User on the gateway too, and what-if shows what it can.
            aigateway_host=""
            project_principal=""
            gateway_name=$(sed -n 's/^aigateway_name=//p' <<< "$outputs")
            agents_via_gateway=$(sed -n 's/^agents_via_ai_gateway=//p' <<< "$outputs")
            read_host=false
            case "$ACTION" in
              cases|what-if) read_host=true ;;
              foundry) if [ "$agents_via_gateway" = true ]; then read_host=true; fi ;;
            esac
            if [ "$read_host" = true ]; then
              if reported=$(az rest --method get --url "https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.ApiManagement/aigateways/${gateway_name}?api-version=2025-09-01-preview" --query properties.frontend.defaultHostname --output tsv 2>&1); then
                :
              elif grep -Eqi 'NotFound|\b404\b' <<< "$reported"; then
                reported=""
              elif [ "$ACTION" = what-if ]; then
                echo "::warning::The AI Gateway $gateway_name could not be read: $reported"
                reported=""
              else
                echo "::error::The AI Gateway $gateway_name could not be read: $reported" >&2
                exit 1
              fi
              if grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.ai\.gateway\.azure\.com$' <<< "$reported"; then
                aigateway_host="$reported"
                printf '::add-mask::%s\n' "$aigateway_host"
                echo "The service reports the host name of the AI Gateway $gateway_name; it goes into the cases file (and into the Foundry file while the switch is on)."
              elif [ "$ACTION" = cases ]; then
                echo "::error::The AI Gateway $gateway_name is not in Azure or has not reported its host name. Every model call of the cases app goes through it, so the Detective and the Skeptic have no route without it and the action cases does not deploy the app. Run aigateway first (the order is in environment/BOOTSTRAP.md). Nothing was changed." >&2
                exit 1
              elif [ "$ACTION" = foundry ]; then
                echo "::error::The switch AGENTS_VIA_AI_GATEWAY (tools/environment-params.py) is True, and the AI Gateway $gateway_name is not in Azure or has not reported its host name. Run aigateway first, or set the switch back to False. Nothing was changed." >&2
                exit 1
              else
                echo "::warning::The preview of the cases app holds a placeholder for the host name of the AI Gateway, because the gateway $gateway_name is not in Azure or has not reported its host name (run aigateway first)."
                if [ "$agents_via_gateway" = true ]; then
                  echo "::warning::The preview of the Foundry resource shows no connection to the AI Gateway, because the gateway $gateway_name is not in Azure or has not reported its host name (run aigateway first)."
                fi
              fi
            fi
            if [ "$agents_via_gateway" = true ]; then
              if [ "$ACTION" = aigateway ] || [ "$ACTION" = what-if ]; then
                if reported=$(az rest --method get --url "https://management.azure.com${project_url}?api-version=2025-06-01" --query identity.principalId --output tsv 2>&1); then
                  :
                elif grep -Eqi 'NotFound|\b404\b' <<< "$reported"; then
                  reported=""
                elif [ "$ACTION" = what-if ]; then
                  echo "::warning::The Foundry project could not be read: $reported"
                  reported=""
                else
                  echo "::error::The Foundry project could not be read: $reported" >&2
                  exit 1
                fi
                if grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$reported"; then
                  project_principal="$reported"
                  printf '::add-mask::%s\n::add-mask::%s\n' "$project_principal" "${project_principal^^}"
                  echo "The Foundry project's system-assigned identity exists; its object id goes into the AI Gateway file."
                elif [ "$ACTION" = aigateway ]; then
                  echo "::error::The switch AGENTS_VIA_AI_GATEWAY (tools/environment-params.py) is True, and the Foundry project $foundry_project is not in Azure or has no identity of its own, so it cannot be given AI Gateway Models User on the gateway. Run foundry first, or set the switch back to False. Nothing was changed." >&2
                  exit 1
                else
                  echo "::warning::The preview of the AI Gateway gives the Foundry project's identity no role, because the project is not in Azure or has no identity of its own (run foundry first)."
                fi
              fi
            fi
            echo "aigateway_host=$aigateway_host" >> "$GITHUB_OUTPUT"
            echo "foundry_project_principal=$project_principal" >> "$GITHUB_OUTPUT"
            echo "cases_app_principal=$cases_system_principal" >> "$GITHUB_OUTPUT"
          }
          # The Operator's identity (read above for foundry and what-if) goes to the builder too: the Foundry file asks for the role of that identity on the project only while the object id is there.
          export OPERATOR_PRINCIPAL_ID="$operator_principal"
          # The final build, with the facts above: the Foundry file and the cases file carry what was read from Azure.
          AIGATEWAY_HOST="$aigateway_host" FOUNDRY_PROJECT_PRINCIPAL_ID="$project_principal" CASES_SYSTEM_PRINCIPAL_ID="$cases_system_principal" ENV_FOUNDRY_PROJECT_EXISTS="$foundry_exists" python3 tools/environment-params.py build --models environment/models.json --out-dir "$RUNNER_TEMP" $policies > /dev/null
          # The files are checked against the templates that were compiled above, so a setting that no template takes is found before Azure is asked.
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/environment.parameters.json" --template "$RUNNER_TEMP/environment.json" --label environment
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/base.parameters.json" --template "$RUNNER_TEMP/base.json" --label base
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/foundry.parameters.json" --template "$RUNNER_TEMP/foundry.json" --label foundry
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/cases.parameters.json" --template "$RUNNER_TEMP/cases.json" --label cases
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/operator.parameters.json" --template "$RUNNER_TEMP/operator.json" --label operator
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/planted.parameters.json" --template "$RUNNER_TEMP/planted.json" --label planted
          # The AI Gateway's two files are there only when the virtual network has a free range for its subnet; the action aigateway says so and stops when it is not.
          if [ -f "$RUNNER_TEMP/aigateway.parameters.json" ]; then
            python3 tools/environment-params.py check --params "$RUNNER_TEMP/aigateway.parameters.json" --template "$RUNNER_TEMP/aigateway.json" --label aigateway
            python3 tools/environment-params.py check --params "$RUNNER_TEMP/aigateway-subnet.parameters.json" --template "$RUNNER_TEMP/aigateway-subnet.json" --label aigateway-subnet
          fi

      - name: Work out the settings of the AI security
        id: aisec
        if: inputs.action == 'what-if' || inputs.action == 'governance' || inputs.action == 'gateway-telemetry'
        env:
          ENV_BUDGET_START: ${{ steps.budget.outputs.start }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          FOUNDRY_PROJECT: ${{ steps.params.outputs.foundry_project_name }}
          CASES_APP: ${{ steps.params.outputs.cases_function_app_name }}
        run: |
          # The files of the governance template (the policy at the group, the alert rules, the workbook) and of the telemetry exporter, from the access list of the gateway (environment/aigateway/contracts.json), which the builder
          # checks against the models, the gateway's limits and the template's roles. They are built in a folder of their own, so that the files of the other actions are what they were. What the files need from Azure is read here and
          # nothing is changed: the object ids of the identities of the access list (the cases app's, the Foundry project's and the Operator's: the alert rule that watches the gateway for a call from outside the list is made
          # from them, and the action governance is refused, by name, while one is missing), whether a diagnostic setting of the Foundry resource that sends to a workspace is there already (the landing zone's policy makes one, and a
          # template never makes a second: AGENTS.md rule 19), and whether the tenant offers the preview initiative that the template may assign.
          group="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP"
          read_value() {
            local answer
            if answer=$(az rest --method get --url "https://management.azure.com${1}?api-version=${2}" --query "$3" --output tsv 2>&1); then
              if [ "$answer" = None ]; then answer=""; fi
              printf '%s' "$answer"
            elif grep -Eqi 'NotFound|\b404\b' <<< "$answer"; then
              printf ''
            else
              echo "::error::${1##*/} could not be read: $answer" >&2
              return 1
            fi
          }
          cases_principal=$(read_value "$group/providers/Microsoft.Web/sites/$CASES_APP" 2024-04-01 identity.principalId)
          project_principal=$(read_value "$group/providers/Microsoft.CognitiveServices/accounts/$FOUNDRY_ACCOUNT/projects/$FOUNDRY_PROJECT" 2025-06-01 identity.principalId)
          operator_principal=$(read_value "$group/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-meternaut-operator" 2023-01-31 properties.principalId)
          guid() { if grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$1"; then printf '%s' "$1"; fi; }
          yesno() { if [ -n "$1" ]; then echo yes; else echo no; fi; }
          cases_principal=$(guid "$cases_principal")
          project_principal=$(guid "$project_principal")
          operator_principal=$(guid "$operator_principal")
          for id in "$cases_principal" "$project_principal" "$operator_principal"; do
            [ -z "$id" ] || printf '::add-mask::%s\n::add-mask::%s\n' "$id" "${id^^}"
          done
          echo "The identities of the access list that are there: the cases app's $(yesno "$cases_principal"), the Foundry project's $(yesno "$project_principal"), the Operator's $(yesno "$operator_principal")."
          # The landing zone's diagnostic setting of the Foundry resource, as the template's own is not counted (it sends to this project's workspace, and a second run finds it).
          diagnostics=false
          if counted=$(az rest --method get --url "https://management.azure.com${group}/providers/Microsoft.CognitiveServices/accounts/${FOUNDRY_ACCOUNT}/providers/Microsoft.Insights/diagnosticSettings?api-version=2021-05-01-preview" \
            --query "length(value[?name!='meternaut-foundry-to-workspace' && properties.workspaceId])" --output tsv 2>&1); then
            if [ "$counted" -ge 1 ] 2> /dev/null; then diagnostics=true; fi
          elif ! grep -Eqi 'NotFound|\b404\b' <<< "$counted"; then
            echo "::error::The diagnostic settings of the Foundry resource could not be read: $counted" >&2
            exit 1
          fi
          echo "A diagnostic setting of the Foundry resource that sends to a workspace is there already: $diagnostics."
          initiative=/providers/Microsoft.Authorization/policySetDefinitions/5207647b-3e83-4e28-b836-c382cb5e2a2e
          offered=false
          if found=$(az rest --method get --url "https://management.azure.com${initiative}?api-version=2023-04-01" --query name --output tsv 2>&1); then
            offered=true
          elif ! grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
            echo "::warning::The preview initiative for the guardrail could not be read ($found): it is not assigned in this run."
          fi
          echo "The tenant offers the preview initiative for the guardrail: $offered."
          outputs=$(OPERATOR_PRINCIPAL_ID="$operator_principal" CASES_SYSTEM_PRINCIPAL_ID="$cases_principal" FOUNDRY_PROJECT_PRINCIPAL_ID="$project_principal" \
            ENV_FOUNDRY_DIAGNOSTICS_EXIST="$diagnostics" GUARDRAIL_INITIATIVE_AVAILABLE="$offered" \
            python3 tools/environment-params.py build --models environment/models.json --out-dir "$RUNNER_TEMP/aisec" \
            --aigateway-policies environment/aigateway/policies.json --governance environment/aigateway/contracts.json)
          grep -E '^(governance_|gateway_telemetry=)' <<< "$outputs" >> "$GITHUB_OUTPUT"
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/aisec/governance.parameters.json" --template "$RUNNER_TEMP/governance.json" --label governance
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/aisec/gateway-telemetry.parameters.json" --template "$RUNNER_TEMP/gateway-telemetry.json" --label gateway-telemetry

      - name: What the model side, the base, the Foundry resource, the first cases, the Operator and the AI Gateway's templates would change
        if: inputs.action == 'what-if'
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
          INSIGHTS_NAME: ${{ steps.params.outputs.appinsights_name }}
          NETWORK_EXISTS: ${{ steps.network.outputs.network_exists }}
          CASES_QUEUE: ${{ steps.params.outputs.cases_queue_name }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          CASES_APP_PLAN: ${{ steps.params.outputs.cases_app_plan }}
          CASES_PLAN_NAME: ${{ steps.params.outputs.cases_plan_name }}
          CASES_SUBNET: ${{ steps.params.outputs.cases_subnet_name }}
        run: |
          echo "::group::The network and the budget, in the project's resource group"
          python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/main.bicep --parameters "$RUNNER_TEMP/environment.parameters.json"
          echo "::endgroup::"
          echo "::group::The base, in the project's resource group (the workspace, Application Insights and the storage account)"
          echo "The Event Hubs namespace and its private endpoint are not in this template any more, and an incremental deployment never removes what a template stops declaring, so they are not listed below: the action retire-event-hubs deletes them, after cases-run has proved the queue path (the group after the next one says what is still there). The usage recording that used to live in this template is not listed either: the action retire-old deletes it."
          python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/base/main.bicep --parameters "$RUNNER_TEMP/base.parameters.json"
          echo "::endgroup::"
          echo "::group::What the action retire-old would delete (it is read here, and nothing is deleted)"
          python3 tools/retire-old.py show --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP"
          echo "::endgroup::"
          echo "::group::What the action retire-event-hubs would delete (it is read here, and nothing is deleted; an estate that never had an Event Hubs namespace shows nothing)"
          python3 tools/retire-old.py show --list event-hubs --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP"
          echo "::endgroup::"
          echo "::group::The Foundry resource of the agents, in the project's resource group (the cases app's role is shown with a placeholder until the action cases has made the app with its system-assigned identity)"
          insights_found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.Insights/components --query "[?name=='$INSIGHTS_NAME'].name | [0]" --output tsv)
          if [ -z "$insights_found" ] || [ "$insights_found" = "None" ]; then
            echo "The Foundry resource cannot be previewed yet: it connects its project to the Application Insights component of the base, and the action base makes it."
          else
            python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
              --template environment/foundry/main.bicep --parameters "$RUNNER_TEMP/foundry.parameters.json" --restore-param restoreAccount
          fi
          echo "::endgroup::"
          echo "::group::The first cases, in the project's resource group (they use the base's storage account, which holds their control queue, and the subnet of their plan kind)"
          echo "The plan kind that tools/environment-params.py asks for is $CASES_APP_PLAN: the plan $CASES_PLAN_NAME and the subnet $CASES_SUBNET. An app that runs on the other kind is not turned into this one in place: the action cases deletes that app and its plan first, and clears what an earlier run that stopped half way left in the way (a private endpoint of the app that is Disconnected, role assignments of an identity that is gone), and the template then makes both new. A preview compares the template with what is there, so for such an app it shows a change of plan that no deploy makes."
          echo "What this adds for the control message: the queue cases-control in the base's storage account, and the app's settings for it (the queue's name; the connection is the host storage's, which carries no key). The app's old settings for the Event Hubs namespace are not in the template any more, so the deploy takes them off the app."
          storage_found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.Storage/storageAccounts --query "[?name=='$STORAGE_ACCOUNT'].name | [0]" --output tsv)
          if [ -z "$storage_found" ] || [ "$storage_found" = "None" ]; then
            echo "The first cases cannot be previewed yet: they build on the base's storage account, and the action base makes it."
          else
            python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
              --template environment/cases/main.bicep --parameters "$RUNNER_TEMP/cases.parameters.json"
          fi
          echo "::endgroup::"
          echo "::group::The Operator, in the project's resource group (its identity, the subnet of its container groups and its two roles)"
          # Its role of Storage Queue Data Contributor goes on the control queue cases-control, which the action cases makes: a template that reads a queue that is not there cannot be previewed.
          queue=$(az rest --method get --url "https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT/queueServices/default/queues/$CASES_QUEUE?api-version=2023-05-01" --query name --output tsv 2> /dev/null || true)
          if [ "$NETWORK_EXISTS" != true ]; then
            echo "The Operator cannot be previewed yet: its subnet goes into the virtual network, and the action model-side makes the network."
          elif [ "$queue" != "$CASES_QUEUE" ]; then
            echo "The Operator cannot be previewed yet: its role goes on the control queue $CASES_QUEUE, which the action cases makes, and it is not there (or could not be read)."
          else
            python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
              --template environment/operator/main.bicep --parameters "$RUNNER_TEMP/operator.parameters.json"
          fi
          echo "::endgroup::"
          echo "::group::The AI Gateway's subnet, in the project's resource group (made first, and only while it is not there; the action then waits for the landing zone's route table on it)"
          # It is the first of the two templates of the AI Gateway: the subnet goes into the virtual network, and the gateway below is made on it once the landing zone has put its route table on it.
          if [ ! -f "$RUNNER_TEMP/aigateway-subnet.parameters.json" ]; then
            echo "The AI Gateway's subnet cannot be previewed: the virtual network has no free range for it (a /26, or a /27 at the least)."
          elif [ "$NETWORK_EXISTS" != true ]; then
            echo "The AI Gateway's subnet cannot be previewed yet: it goes into the virtual network, and the action model-side makes the network."
          else
            python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
              --template environment/aigateway/subnet.bicep --parameters "$RUNNER_TEMP/aigateway-subnet.parameters.json"
          fi
          echo "::endgroup::"
          echo "::group::The AI Gateway, in the project's resource group (the gateway, its models and aliases and its roles, which the action makes after the subnet above carries the landing zone's route table; the policies and the built-in key are not in the template)"
          # It reads the Foundry resource of the agents (the gateway's identity gets a role on it) and the Operator's identity (it gets a role on the gateway), and it names the subnet above, which it does not make.
          if [ ! -f "$RUNNER_TEMP/aigateway.parameters.json" ]; then
            echo "The AI Gateway cannot be previewed: the virtual network has no free range for its subnet (a /26, or a /27 at the least)."
          elif [ "$NETWORK_EXISTS" != true ]; then
            echo "The AI Gateway cannot be previewed yet: the subnet that it is made on goes into the virtual network, and the action model-side makes the network."
          else
            foundry_found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.CognitiveServices/accounts --query "[?name=='$FOUNDRY_ACCOUNT'].name | [0]" --output tsv)
            operator_found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].name" --output tsv)
            if [ -z "$foundry_found" ] || [ "$foundry_found" = "None" ] || [ -z "$operator_found" ] || [ "$operator_found" = "None" ]; then
              echo "The AI Gateway cannot be previewed yet: it reads the Foundry resource of the agents and the Operator's identity, and the actions foundry and operator make them."
            else
              python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
                --template environment/aigateway/main.bicep --parameters "$RUNNER_TEMP/aigateway.parameters.json"
            fi
          fi
          echo "::endgroup::"

      - name: What the AI security's templates would change
        if: inputs.action == 'what-if'
        env:
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
          INSIGHTS_NAME: ${{ steps.params.outputs.appinsights_name }}
        run: |
          # The two templates of the AI security (docs/proposals/10-ai-security-and-governance.md). Each reads what another action makes, so each is previewed only when that is there, and the lines say what is missing.
          echo "::group::The policy, the alert rules, the workbook and the table retention of the AI security, in the project's resource group (the action governance)"
          workspace_found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.OperationalInsights/workspaces --query "[?name=='log-meternaut'].name | [0]" --output tsv)
          foundry_found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.CognitiveServices/accounts --query "[?name=='$FOUNDRY_ACCOUNT'].name | [0]" --output tsv)
          if [ -z "$workspace_found" ] || [ "$workspace_found" = "None" ] || [ -z "$foundry_found" ] || [ "$foundry_found" = "None" ]; then
            echo "The AI security cannot be previewed yet: it reads the base's workspace and the Foundry resource of the agents, and the actions base and foundry make them."
          else
            python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
              --template environment/governance/main.bicep --parameters "$RUNNER_TEMP/aisec/governance.parameters.json"
          fi
          echo "::endgroup::"
          echo "::group::The telemetry exporter of the AI Gateway, in the project's resource group (the action gateway-telemetry)"
          group="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP"
          component="$group/providers/Microsoft.Insights/components/$INSIGHTS_NAME"
          gateway_found=$(az rest --method get --url "https://management.azure.com${group}/providers/Microsoft.ApiManagement/aigateways/${GATEWAY_NAME}?api-version=2025-09-01-preview" --query name --output tsv 2> /dev/null || true)
          endpoint=$(az rest --method get --url "https://management.azure.com${component}?api-version=2020-02-02" --query properties.OTLPLogsEndpoint --output tsv 2> /dev/null || true)
          if [ "$gateway_found" != "$GATEWAY_NAME" ]; then
            echo "The telemetry exporter cannot be previewed yet: it is a child of the AI Gateway, and the action aigateway makes the gateway."
          elif [ -z "$endpoint" ] || [ "$endpoint" = "None" ]; then
            echo "The telemetry exporter cannot be previewed yet: it names the OpenTelemetry endpoints that the component reports once its ingestion is on, and the component reports none (the action base turns the ingestion on, after the resource provider Microsoft.Monitor is registered; environment/BOOTSTRAP.md)."
          else
            python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
              --template environment/aigateway/telemetry.bicep --parameters "$RUNNER_TEMP/aisec/gateway-telemetry.parameters.json"
          fi
          echo "::endgroup::"

      - name: Deploy the network and the budget
        if: inputs.action == 'model-side'
        env:
          EXPECTED_NETWORK: ${{ steps.params.outputs.vnet_name }}
        run: |
          # The virtual network with its subnets (made once and then left alone: AGENTS.md rule 27) and the budget of the resource group (environment/main.bicep). No model account: it was removed on 2026-11-07.
          network=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/main.bicep --parameters "$RUNNER_TEMP/environment.parameters.json" \
            --name "environment-$GITHUB_RUN_ID" --output virtualNetworkName)
          if [ "$network" != "$EXPECTED_NETWORK" ]; then
            echo "::error::The deployment returned the network $network, not $EXPECTED_NETWORK."
            exit 1
          fi

      - name: The resource provider Microsoft.Monitor is registered, which the OpenTelemetry ingestion of the component needs
        if: inputs.action == 'base' && steps.params.outputs.gateway_telemetry == 'true'
        run: |
          # The base turns on the OpenTelemetry ingestion of the Application Insights component while GATEWAY_TELEMETRY in tools/environment-params.py is True: Azure then makes a managed Azure Monitor workspace, a data
          # collection endpoint and a data collection rule, and the AI Gateway's telemetry exporter (the action gateway-telemetry) sends to the endpoints that this gives. That needs the resource provider Microsoft.Monitor in
          # the subscription, and registering a provider is a right on the subscription that the deploy identity does not hold (it holds its rights on the project's resource group), so a person registers it once. It is read
          # here, before anything is changed, so that the deploy does not stop half way on a provider that is not there.
          if ! state=$(az provider show --namespace Microsoft.Monitor --query registrationState --output tsv 2>&1); then
            echo "::error::The registration of the resource provider Microsoft.Monitor could not be read: $state. Nothing was changed."
            exit 1
          fi
          if [ "$state" != "Registered" ]; then
            echo "::error::The resource provider Microsoft.Monitor is ${state:-not registered} in the subscription, and the action base turns on the OpenTelemetry ingestion of the Application Insights component (GATEWAY_TELEMETRY in tools/environment-params.py), which makes a managed Azure Monitor workspace and needs that provider. A person who may register a resource provider in the subscription (Contributor or Owner there) registers it once, with their own sign-in: environment/BOOTSTRAP.md, the section on the AI security, step G2 (az provider register --namespace Microsoft.Monitor). The deploy identity holds no right on the subscription, so it cannot. Nothing was changed. Or set GATEWAY_TELEMETRY back to False in tools/environment-params.py and run base again: the component is then left as it was."
            exit 1
          fi
          echo "The resource provider Microsoft.Monitor is registered."

      - name: Deploy the base
        id: base
        if: inputs.action == 'base'
        env:
          EXPECTED_STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
        run: |
          # A Log Analytics workspace and an Application Insights component, and a storage account with its three private endpoints and the containers that every Functions host of the account share (environment/base/main.bicep).
          # No function app, no Cosmos DB account, no Event Hubs namespace and no event hub: the cases app makes its own control queue in the storage account. No key anywhere.
          account=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/base/main.bicep --parameters "$RUNNER_TEMP/base.parameters.json" \
            --name "base-$GITHUB_RUN_ID" --output storageAccountName)
          if [ "$account" != "$EXPECTED_STORAGE_ACCOUNT" ]; then
            echo "::error::The deployment returned the storage account $account, not $EXPECTED_STORAGE_ACCOUNT."
            exit 1
          fi

      - name: Read the storage account back from Azure, which has no public network access and no key
        if: inputs.action == 'base'
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
        run: |
          # A deployment that says Succeeded does not say that the account came out as the template wrote it: the tenant's Modify policies rewrite a resource while it is made and do not refuse it (AGENTS.md rule 19).
          # The account holds the host storage of the cases app and its control queue, and it has no public endpoint, no key and private endpoints. The run fails unless Azure says that public network access is Disabled,
          # that Shared Key access is off and that the account has at least three private endpoint connections (blob, queue and table), every one of them Approved. Only a GET request is made. The answer is one line of
          # three words: the access, the Shared Key setting and the connections' states.
          account="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT"
          if ! state=$(az rest --method get --url "https://management.azure.com${account}?api-version=2023-05-01" \
            --query 'join(`" "`, [to_string(properties.publicNetworkAccess), to_string(properties.allowSharedKeyAccess), join(`","`, (properties.privateEndpointConnections || `[]`)[].properties.privateLinkServiceConnectionState.status)])' \
            --output tsv --only-show-errors 2>&1); then
            echo "::error::The storage account could not be read: $state"
            exit 1
          fi
          read -r access shared_key connections <<< "$state"
          problems=""
          if [ "$access" != "Disabled" ]; then problems="$problems Public network access is '$access', not 'Disabled'."; fi
          if [ "${shared_key,,}" != "false" ]; then problems="$problems Shared Key access is not off (allowSharedKeyAccess is '$shared_key')."; fi
          if [ "$(tr ',' '\n' <<< "$connections" | grep -c .)" -lt 3 ]; then
            problems="$problems The account has fewer than three private endpoint connections (blob, queue and table): '$connections'."
          elif [ -n "$(tr ',' '\n' <<< "$connections" | grep -vx Approved)" ]; then
            problems="$problems A private endpoint connection of the account is not Approved ($connections)."
          fi
          if [ -n "$problems" ]; then
            echo "::error::The storage account $STORAGE_ACCOUNT is not as the template wrote it:$problems Look at the policy compliance of the account. Nothing was changed by this step."
            exit 1
          fi
          echo "The storage account $STORAGE_ACCOUNT, read back from Azure: public network access is Disabled, Shared Key access is off, and its private endpoint connections are Approved."

      - name: Wait until the landing zone has registered the base's private endpoints in the central zones
        if: inputs.action == 'base'
        env:
          BASE_ENDPOINTS: ${{ steps.params.outputs.base_endpoints }}
        run: |
          # Each endpoint is "name:zone". An app reaches its storage, and with it the control queue, by name, and the name resolves to
          # the private address only after the policy has added the endpoint to the zone (about ten minutes). Without that, an app that starts after this deploy would
          # be sent to the public address of a service that has none for it, and its first start would fail. So the action does not end before the names are registered.
          attempts=40
          for attempt in $(seq 1 "$attempts"); do
            missing=""
            for pair in ${BASE_ENDPOINTS//,/ }; do
              endpoint="${pair%%:*}"
              zone="${pair#*:}"
              zones=$(az network private-endpoint dns-zone-group list --resource-group "$ENV_RESOURCE_GROUP" --endpoint-name "$endpoint" \
                --query "[].privateDnsZoneConfigs[].privateDnsZoneId" --output tsv || true)
              if ! grep -qi "/$zone\$" <<< "$zones"; then missing="$missing $endpoint"; fi
            done
            if [ -z "$missing" ]; then
              echo "The landing zone's policy has registered every private endpoint of the base in its central zone."
              exit 0
            fi
            echo "Not registered yet:$missing (check $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then sleep 60; fi
          done
          echo "::error::The landing zone's policy has not registered these private endpoints in their central zones:$missing. An app that starts now could not reach its storage by its private name. Wait, or look at the policy compliance of the endpoints; do not create a private DNS zone."
          exit 1

      - name: What the project's resource group holds now
        if: inputs.action == 'base'
        run: az resource list --resource-group "$ENV_RESOURCE_GROUP" --query "sort_by([].{name:name, type:type}, &type)" --output table

      - name: Sign in to Azure again for the retirement, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'retire-old'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete what Meternaut does not use any more, in the project's resource group
        id: retire_old
        if: inputs.action == 'retire-old'
        # The deletes are waited for one by one (the Cosmos DB account and the function app take minutes), and the old model account is purged at the end: the step is given an hour, and the tool stops at the first thing that does not go.
        timeout-minutes: 60
        run: |
          # The usage recording (made for the calls of the owner's old API Management instance, which Meternaut does not use or touch any more: nothing feeds it) and the old model account (nothing calls it: every model call goes to the
          # models of the agents' own Foundry resource) are deleted by their exact names, in the project's resource group and nowhere else, by tools/retire-old.py. It reads each one first, deletes it when it is there, reads back until it is gone,
          # and prints one line for each (deleted, or was not there); the old model account is purged after its delete, so that its name and its quota are free. The tool refuses unless the resource group it is given is the
          # ENV_RESOURCE_GROUP of this workflow. It takes no input, needs no other action first, and a second run finds nothing and says so. It deletes nothing that is not on its list: the base's storage account, the
          # workspace, Application Insights and every subnet stay (a test pins the list), and so does the Event Hubs namespace, which has an action of its own, retire-event-hubs, that is run only after cases-run has proved the
          # queue path. The role assignments that the deleted identities leave behind are listed, never deleted.
          python3 tools/retire-old.py run --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --summary "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure again for the retirement of the Event Hubs namespace, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'retire-event-hubs'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete the Event Hubs namespace that carried the control event, its private endpoint and its checkpoint container, in the project's resource group
        id: retire_event_hubs
        if: inputs.action == 'retire-event-hubs'
        # The deletes are waited for one by one, and the tool stops at the first thing that does not go.
        timeout-minutes: 60
        run: |
          # The control message of the cases app goes through a Storage queue now, and nothing reads the Event Hubs namespace any more. This action deletes the namespace and what belongs to it, by their exact names, in the project's
          # resource group and nowhere else, by tools/retire-old.py with its list of the event hubs: the private endpoint first, then the namespace (with its hub cases-control and the consumer group of that hub; no purge is
          # needed for Event Hubs), then the container azure-webjobs-eventhub in the storage account, which held the namespace's checkpoints. It reads each one first, deletes it when it is there, reads back until it is
          # gone, and prints one line for each (deleted, or was not there). The tool refuses unless the resource group it is given is the ENV_RESOURCE_GROUP of this workflow, and it refuses to delete anything while the control queue
          # cases-control is not there. It takes no input, a second run finds nothing and says so, and an estate that never had a namespace passes. Run it only after cases-run has proved the queue path:
          # nothing in this workflow checks that, because the proof is a run of the Watch that a person has read.
          python3 tools/retire-old.py run --list event-hubs --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --summary "$GITHUB_STEP_SUMMARY"

      - name: Find the Operator, which runs the check from inside the network
        id: operator
        if: inputs.action == 'cases-run' || inputs.action == 'page-latency'
        run: |
          # The control message that starts a Watch is put in the queue, and the telemetry that says how it went is read, by the check tool running inside the network, in a container group of the Operator
          # (docs/proposals/07-private-by-default.md): the storage account has no public endpoint once the action base has deployed its template, and a request from this runner cannot reach its queue. So the Operator has to be there first.
          # It is found by its name, as the probe finds it, and nothing is changed here.
          subnet_id="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          client=""
          if grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            client=$(az rest --method get --url "https://management.azure.com${identity_id}?api-version=2023-01-31" --query properties.clientId --output tsv || true)
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$client"; then
            echo "::error::The identity id-meternaut-operator is not there. The action $ACTION runs its check in the Operator, so run operator first (the order is base, cases, operator). Nothing was changed."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          if found=$(az rest --method get --url "https://management.azure.com${subnet_id}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
            echo "::error::The subnet snet-ops is not there. The action $ACTION runs its check in the Operator, so run operator first (the order is base, cases, operator). Nothing was changed."
            exit 1
          else
            echo "::error::The subnet snet-ops could not be read: $found"
            exit 1
          fi
          echo "The Operator's identity and its subnet are there."
          {
            echo "identity_id=$identity_id"
            echo "client_id=$client"
            echo "subnet_id=$subnet_id"
          } >> "$GITHUB_OUTPUT"

      - name: The base and the cases app's identity are there, which the Foundry resource builds on
        if: inputs.action == 'foundry'
        env:
          INSIGHTS_NAME: ${{ steps.params.outputs.appinsights_name }}
          CASES_APP: ${{ steps.params.outputs.cases_function_app_name }}
        run: |
          # The project is connected to the Application Insights component of the base, and its identity gets a role on that component. The cases app's own system-assigned identity (the action
          # cases makes the app with it) gets the Foundry User role on the project, so its object id has to be in the parameter file: no role is ever given to a placeholder.
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.Insights/components --query "[?name=='$INSIGHTS_NAME'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The Application Insights component $INSIGHTS_NAME is not in $ENV_RESOURCE_GROUP. Run base first: the Foundry resource sends the agents' traces to it."
            exit 1
          fi
          site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$CASES_APP"
          if ! principal=$(az rest --method get --url "https://management.azure.com${site}?api-version=2024-04-01" --query identity.principalId --output tsv 2>&1); then
            echo "::error::The cases app $CASES_APP could not be read, or it is not in $ENV_RESOURCE_GROUP: $principal. Run cases first: it makes the app with the identity that gets its role on the project."
            exit 1
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$principal"; then
            echo "::error::The cases app $CASES_APP has no system-assigned identity. Run cases first: it makes the identity that gets its role on the project."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$principal" "${principal^^}"
          if ! grep -Fqi "\"$principal\"" "$RUNNER_TEMP/foundry.parameters.json"; then
            echo "::error::The parameter file of the Foundry resource does not carry the object id of the identity of $CASES_APP: the settings step reads it from the app when it builds the file, and it did not find this one. Nothing was deployed."
            exit 1
          fi
          echo "The Application Insights component $INSIGHTS_NAME and the identity of the cases app $CASES_APP are there, and the parameter file carries the identity's object id."

      - name: Deploy the Foundry resource of the agents
        id: foundry
        if: inputs.action == 'foundry'
        env:
          EXPECTED_ENDPOINT: ${{ steps.params.outputs.foundry_project_endpoint }}
        run: |
          # A second Foundry resource, because the first model account (removed on 2026-11-07) was made with allowProjectManagement false and could never hold a project: its project, the models of environment/models.json,
          # a guardrail with Prompt Shields, one private endpoint, the connection that sends the agents' traces with the project's identity, and the roles (environment/foundry/main.bicep).
          # Local authentication and public network access are off, and no key exists. A resource of this name that was removed earlier is restored.
          # With the switch AGENTS_VIA_AI_GATEWAY on (tools/environment-params.py, True since the owner's order of 2026-11-07) the file also carries the host name of the AI Gateway and the aliases, and the template makes the
          # project's connection to the gateway too, with the project's own identity and no key: whether the service takes that connection is not known until this runs (docs/proposals/08-ai-gateway.md, step 2). If it is
          # refused, the deploy says so and the run stops there: the resource is as it was, and the owner decides. The way back is the switch set to False.
          endpoint=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/foundry/main.bicep --parameters "$RUNNER_TEMP/foundry.parameters.json" \
            --name "foundry-$GITHUB_RUN_ID" --output projectEndpoint --restore-param restoreAccount)
          if [ "${endpoint%/}" != "${EXPECTED_ENDPOINT%/}" ]; then
            echo "::error::The deployed project answers on ${endpoint%/}, not on $EXPECTED_ENDPOINT, which is the address that the cases app would be given. The cases app was not changed."
            exit 1
          fi
          echo "The project endpoint is $EXPECTED_ENDPOINT."

      - name: Wait until the landing zone has registered the Foundry resource's private endpoint in the central zones
        if: inputs.action == 'foundry'
        env:
          PRIVATE_ENDPOINT: ${{ steps.params.outputs.foundry_private_endpoint }}
        run: |
          # The cases app calls <resource>.services.ai.azure.com, and that name resolves to the private address only after the policy has added the endpoint to the central zone
          # privatelink.services.ai.azure.com (about ten minutes). The two other zones of a Foundry resource are said and not required: the app does not use those names.
          found=$(az network private-endpoint list --resource-group "$ENV_RESOURCE_GROUP" --query "[?name=='$PRIVATE_ENDPOINT'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The private endpoint $PRIVATE_ENDPOINT is not there."
            exit 1
          fi
          attempts=40
          for attempt in $(seq 1 "$attempts"); do
            zones=$(az network private-endpoint dns-zone-group list --resource-group "$ENV_RESOURCE_GROUP" \
              --endpoint-name "$PRIVATE_ENDPOINT" --query "[].privateDnsZoneConfigs[].privateDnsZoneId" --output tsv || true)
            if grep -qi 'privatelink.services.ai.azure.com' <<< "$zones"; then
              echo "The landing zone's policy has registered $PRIVATE_ENDPOINT in the central private DNS zone privatelink.services.ai.azure.com."
              for zone in privatelink.cognitiveservices.azure.com privatelink.openai.azure.com; do
                if grep -qi "$zone" <<< "$zones"; then echo "It is registered in $zone too."; else echo "It is not registered in $zone: the cases app does not use that name."; fi
              done
              exit 0
            fi
            echo "Not registered yet (check $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then sleep 60; fi
          done
          echo "::error::The landing zone's policy has not registered $PRIVATE_ENDPOINT in the central private DNS zone privatelink.services.ai.azure.com, so the cases app could not reach the project. Do not run cases yet. Wait, or ask the owners of the landing zone for that zone: do not create a private DNS zone."
          exit 1

      - name: Sign in to Azure again for the read-back of the Foundry resource, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'foundry'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the Foundry resource back
        if: inputs.action == 'foundry'
        # Each read of Azure waits two minutes at the most (the tool's --timeout); this limit holds the whole step even when many pages are slow.
        timeout-minutes: 20
        env:
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          FOUNDRY_PROJECT: ${{ steps.params.outputs.foundry_project_name }}
          FOUNDRY_GUARDRAIL: ${{ steps.params.outputs.foundry_guardrail_name }}
          PRIVATE_ENDPOINT: ${{ steps.params.outputs.foundry_private_endpoint }}
          PROJECT_ENDPOINT: ${{ steps.params.outputs.foundry_project_endpoint }}
          AIGATEWAY_HOST: ${{ steps.params.outputs.aigateway_host }}
          CONNECTION_NAME: ${{ steps.params.outputs.aigateway_connection_name }}
        run: |
          # A deployment that says Succeeded does not say that the resource came out as the template wrote it: the tenant's Modify policies rewrite a resource while it is made, and do not refuse it
          # (AGENTS.md rule 19). The run fails unless public network access is Disabled, local authentication is off, project management is on, the project, its identity, the private endpoint,
          # every model of environment/models.json, the guardrail and the connection for traces are there as the template says. Only GET requests; no key is listed.
          # With the switch AGENTS_VIA_AI_GATEWAY on (tools/environment-params.py, True since the owner's order of 2026-11-07), the settings step has read the gateway's host name, and the connection of the project to the gateway is
          # read back too, with a GET of its own: its category, its authentication with the project's own identity, its audience, its target, its models and that it holds no credentials. Off, the call is what it was.
          gateway=()
          if [ -n "$AIGATEWAY_HOST" ]; then gateway=(--ai-gateway-host "$AIGATEWAY_HOST" --connection "$CONNECTION_NAME"); fi
          python3 tools/foundry-check.py read-back --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --account "$FOUNDRY_ACCOUNT" \
            --project "$FOUNDRY_PROJECT" --guardrail "$FOUNDRY_GUARDRAIL" --private-endpoint "$PRIVATE_ENDPOINT" --endpoint "$PROJECT_ENDPOINT" \
            --models environment/models.json --summary "$GITHUB_STEP_SUMMARY" "${gateway[@]}"

      - name: The base is there, which the first cases build on
        if: inputs.action == 'cases'
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
          AGENTS_VIA_AI_GATEWAY: ${{ steps.params.outputs.agents_via_ai_gateway }}
          CONNECTION_NAME: ${{ steps.params.outputs.aigateway_connection_name }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          FOUNDRY_PROJECT: ${{ steps.params.outputs.foundry_project_name }}
        run: |
          # The app uses the base's storage account, which holds its control queue, and the subnets of the network. It needs nothing of the owner's API Management instance: it reads no key. Its Detective and Skeptic call the AI Gateway (every model call
          # of Meternaut goes through it: AGENTS.md rule 15 (c)), whose host name the settings step read from the service and which it stopped for when the gateway is not there; this step makes no call to it.
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.Storage/storageAccounts --query "[?name=='$STORAGE_ACCOUNT'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The storage account $STORAGE_ACCOUNT is not in $ENV_RESOURCE_GROUP. Run base first: the first cases use its storage account, and their control queue is made in it."
            exit 1
          fi
          echo "The base's storage account is there."
          # The agents' route through the AI Gateway (the switch AGENTS_VIA_AI_GATEWAY in tools/environment-params.py, True since the owner's order of 2026-11-07: docs/proposals/08-ai-gateway.md, step 2): the app is then given the model
          # names <connection>/<alias>, and an agent whose model names a connection that the project does not have cannot run. So the connection has to be in the project before the app is changed: aigateway gives the
          # project's identity its role on the gateway, and then foundry makes the connection. Off, nothing more is read.
          if [ "$AGENTS_VIA_AI_GATEWAY" = true ]; then
            connection="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$FOUNDRY_ACCOUNT/projects/$FOUNDRY_PROJECT/connections/$CONNECTION_NAME"
            if found=$(az rest --method get --url "https://management.azure.com${connection}?api-version=2026-09-01" --query name --output tsv 2>&1); then
              echo "The Foundry project $FOUNDRY_PROJECT has the connection $CONNECTION_NAME to the AI Gateway: the app is given the model names that name it."
            elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
              echo "::error::The switch AGENTS_VIA_AI_GATEWAY (tools/environment-params.py) is True, so the cases app is given model names that name the connection $CONNECTION_NAME, and the Foundry project $FOUNDRY_PROJECT has no such connection. Run aigateway and then foundry first (the order is in environment/BOOTSTRAP.md), or set the switch back to False. Nothing was deployed."
              exit 1
            else
              echo "::error::The connection $CONNECTION_NAME of the Foundry project $FOUNDRY_PROJECT could not be read: $found. Nothing was deployed."
              exit 1
            fi
          fi

      - name: The function subnet is free for the cases app, which runs on Flex Consumption
        if: inputs.action == 'cases' && steps.params.outputs.cases_app_plan == 'Flex'
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
          FUNCTION_SUBNET: ${{ steps.params.outputs.function_subnet_name }}
        run: |
          # A Flex Consumption app is integrated with a subnet that is delegated to Microsoft.App/environments, and the only one that the model side made is the function subnet snet-func, which the usage app
          # is on until the action retire-old deletes it. The owner's network is small, so no new subnet is made for the web page: the app uses this one, and the usage app has to be gone from it first. This step reads
          # before anything is changed, and it comes before the step that clears what is in the way of the deploy (the app of the other kind among it), so that a refusal leaves the web page where it was. Learn says that more than one Flex Consumption app can share a
          # subnet (Create and manage function apps in the Flex Consumption plan, Subnet sharing), but one app then affects the performance of the other, and the order is that the web page has the subnet to itself.
          # The one exception is the Teams bot's app (func-meternaut-teams-<digest>, docs/proposals/13-teams-and-outlook.md): it shares the subnet on purpose, because it has to reach the loop's tables through their private endpoints; it is small, scales to zero and has two instances at the most.
          vnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut"
          subnet="$vnet/subnets/$FUNCTION_SUBNET"
          if ! delegations=$(az rest --method get --url "https://management.azure.com${subnet}?api-version=2025-05-01" --query "properties.delegations[].properties.serviceName" --output tsv 2>&1); then
            if grep -Eqi 'NotFound|\b404\b' <<< "$delegations"; then
              echo "::error::The subnet $FUNCTION_SUBNET is not there. A Flex Consumption app uses the function subnet that model-side makes, and no new subnet is made for it (the owner's network is small): run model-side first, or set CASES_APP_PLAN back to Basic in tools/environment-params.py. Nothing was changed."
              exit 1
            fi
            echo "::error::The subnet $FUNCTION_SUBNET could not be read: $delegations"
            exit 1
          fi
          if ! grep -Fxq 'Microsoft.App/environments' <<< "$delegations"; then
            echo "::error::The subnet $FUNCTION_SUBNET is delegated to ${delegations:-nothing}, and a Flex Consumption app needs a subnet that is delegated to Microsoft.App/environments. Nothing was changed: a person looks at the subnet, or CASES_APP_PLAN goes back to Basic in tools/environment-params.py."
            exit 1
          fi
          echo "The subnet $FUNCTION_SUBNET is delegated to Microsoft.App/environments."
          links=$(az rest --method get --url "https://management.azure.com${subnet}?api-version=2025-05-01" --query "properties.serviceAssociationLinks[].[name, properties.linkedResourceType, properties.link]" --output tsv 2>/dev/null || true)
          if [ -n "$links" ]; then echo "The platform's links on the subnet (service association links), as read: $links"; else echo "The subnet carries no service association link."; fi
          apps=$(az rest --method get --url "https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites?api-version=2024-04-01" --query "value[].[name, properties.virtualNetworkSubnetId, properties.serverFarmId]" --output tsv)
          taken=""
          while IFS=$'\t' read -r name integrated plan; do
            if [ -z "$name" ] || [ "${name,,}" = "${FUNCTION_APP,,}" ] || [[ "${name,,}" == func-meternaut-teams-* ]]; then continue; fi
            if [[ "${integrated,,}" == */subnets/"${FUNCTION_SUBNET,,}" ]]; then taken="$taken $name (plan ${plan##*/})"; fi
          done <<< "$apps"
          if [ -n "$taken" ]; then
            echo "::error::The subnet $FUNCTION_SUBNET is still taken by another plan:$taken. The web page's Flex Consumption app needs it, and no other subnet is made for it. If that is the usage app, the action retire-old removes it and its plan: run that first, wait until it has finished, and run cases again. If it is something else, a person removes that app and its plan or moves it to another subnet, and then cases is run again. Nothing was changed: the web page's app is still where it was."
            exit 1
          fi
          echo "No other app is integrated with the subnet $FUNCTION_SUBNET: it is free for the cases app."

      - name: Clear what is in the way of the deploy of the cases app (an app and a plan of the other kind, a private endpoint that is Disconnected, role assignments of an identity that is gone)
        if: inputs.action == 'cases'
        timeout-minutes: 45
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
          WANTED_KIND: ${{ steps.params.outputs.cases_app_plan }}
          WANTED_TIER: ${{ steps.params.outputs.cases_plan_tier }}
          OTHER_PLAN: ${{ steps.params.outputs.cases_other_plan_name }}
          OTHER_TIER: ${{ steps.params.outputs.cases_other_plan_tier }}
        run: |
          # An app cannot move between a Flex Consumption plan and a Basic plan, so when CASES_APP_PLAN (tools/environment-params.py) names the other kind than the one that the app runs on, the app is deleted
          # and the deploy makes it again with the same name: the host name, the sign-in's reply address and the links in the letters stay as they are. A run that stops half way leaves part of that done (the first move
          # stopped on a gateway time-out of the platform, then on role assignments of the old identity, then on a private endpoint that was left Disconnected), so this step does not start from what an earlier run
          # did: tools/cases-move.py reads the state as it is now, deletes what is in the way, reads again, and prints one line for each. In the project's own resource group, by exact name: the app, while it
          # runs on the plan of the other kind (a plan that is neither stops the run); the plan of the other kind, while its tier is that kind's; the private endpoint of the app, when its connection is Disconnected or
          # the app that it points at is not there; and the role assignments that a preview of the deploy lists (the template names them after the app's id, so Azure refuses to change the identity of one that
          # exists, and a new app has a new identity), when they are not the app's own. A call that gets a gateway time-out, a bad gateway, a service that is not available or too many requests is made again, and a
          # delete that went through anyway is read and counted as gone. What a person gave the old identity outside the group (Reader and Cost Management Reader, the right to send letters) is not here to delete
          # or to give: the step summary says that it is given again, for the new identity (environment/BOOTSTRAP.md). The app holds no data (the records are in the storage account's tables, the History is
          # in Application Insights), and the tool deletes nothing else.
          python3 tools/cases-move.py run --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --app "$FUNCTION_APP" \
            --wanted-kind "$WANTED_KIND" --wanted-tier "$WANTED_TIER" --other-plan "$OTHER_PLAN" --other-tier "$OTHER_TIER" \
            --template environment/cases/main.bicep --parameters "$RUNNER_TEMP/cases.parameters.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Remove what the Flex Consumption version left in the storage account, when it is still there
        if: inputs.action == 'cases' && steps.params.outputs.cases_app_plan == 'Basic'
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
        run: |
          # Only for a Basic app (the step does not run while CASES_APP_PLAN is Flex: a Flex app keeps its package in this very container, which the template makes). The Flex Consumption app kept its package in the
          # container app-package-cases, and its identity had a role on that container. The Basic plan runs from a package on its own storage, so nothing uses either when the app has gone back to Basic. The role assigned
          # on the container itself goes first, then the container. Nothing else in the account is touched.
          container="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT/blobServices/default/containers/app-package-cases"
          if ! found=$(az rest --method get --url "https://management.azure.com${container}?api-version=2023-05-01" --query name --output tsv 2>&1); then
            if grep -Eqi 'ContainerNotFound|ResourceNotFound|NotFound|404' <<< "$found"; then
              echo "The container app-package-cases is not there: nothing to remove."
              exit 0
            fi
            echo "::error::The container app-package-cases could not be read: $found"
            exit 1
          fi
          for id in $(az role assignment list --scope "$container" --query "[].id" --output tsv); do
            echo "Removing the role assignment $id, which was assigned on the container itself."
            az role assignment delete --ids "$id"
          done
          az rest --method delete --url "https://management.azure.com${container}?api-version=2023-05-01" --only-show-errors
          echo "The container app-package-cases is removed."

      - name: Let the cases app go from an integration subnet that is not the one of the template
        if: inputs.action == 'cases'
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
          CASES_SUBNET: ${{ steps.params.outputs.cases_subnet_name }}
        run: |
          # An app is integrated with one subnet. The first one, snet-web, lost the route table of the landing zone's network manager to a deploy that made it again (CHANGELOG.md), and was
          # replaced by snet-cases. The integration is taken away first, so that the template then makes a new one, and the platform does not have to change a working one in place. An app
          # that is integrated with the subnet of the template (snet-func for a Flex app, snet-cases for a Basic one), or with none, is left alone. If the platform refuses, the template's own change of the subnet follows.
          site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$FUNCTION_APP"
          current=$(az rest --method get --url "https://management.azure.com${site}?api-version=2024-04-01" --query properties.virtualNetworkSubnetId --output tsv 2>/dev/null || true)
          if [ -z "$current" ] || [ "$current" = "None" ] || [ "${current##*/}" = "$CASES_SUBNET" ]; then
            echo "The cases app is integrated with no other subnet than $CASES_SUBNET: nothing to take away."
            exit 0
          fi
          echo "The cases app is integrated with ${current##*/}: that integration is taken away, and the template then integrates the app with $CASES_SUBNET."
          if ! az rest --method delete --url "https://management.azure.com${site}/networkConfig/virtualNetwork?api-version=2024-04-01" --only-show-errors; then
            echo "::warning::The integration with ${current##*/} could not be taken away; the template changes it instead."
          fi

      - name: Deploy the first cases
        id: cases
        if: inputs.action == 'cases'
        env:
          CASES_APP_PLAN: ${{ steps.params.outputs.cases_app_plan }}
          CASES_SUBNET: ${{ steps.params.outputs.cases_subnet_name }}
        run: |
          # The function app that serves the web page and runs the Watch, on the plan that CASES_APP_PLAN says (Flex Consumption: it scales to zero and bills per execution, on the function subnet snet-func and with a
          # package container of its own in the base's storage account; or Basic: B1, always on, on snet-cases), with its own system-assigned identity (it reads and stores) and one user-assigned identity
          # that only presents the console's sign-in; one Storage queue (the control queue) in the base's storage account; the roles that connect them; a year of retention for the traces; and the History
          # workbook (environment/cases/main.bicep). Meternaut holds no right to change Azure: a change runs with the permissions of the person who approves it. No key anywhere.
          if ! site=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/cases/main.bicep --parameters "$RUNNER_TEMP/cases.parameters.json" \
            --name "cases-$GITHUB_RUN_ID" --output functionAppId 2> "$RUNNER_TEMP/cases-deploy.err"); then
            cat "$RUNNER_TEMP/cases-deploy.err" >&2
            if [ "$CASES_APP_PLAN" = Flex ] && grep -Eqi 'subnet|ServiceAssociationLink|delegat|InUse' "$RUNNER_TEMP/cases-deploy.err"; then
              echo "::error::The deployment of the cases app on Flex Consumption was refused, and the text above names the subnet. The app uses the function subnet $CASES_SUBNET and no other (no new subnet is made: the owner's network is small). If the subnet is still taken by another plan, the usage app and its plan have to be removed first (the action retire-old does it), and the platform can take a while to let go of a subnet that an app has left: run cases again then. If it is something else, a person looks at the subnet's links. The app of the other kind was removed before this step and is not there: run cases again once the subnet is free, or set CASES_APP_PLAN back to Basic in tools/environment-params.py and run cases."
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/cases-deploy.err" >&2
          if ! printf '%s' "$site" | grep -Eq '^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+/providers/Microsoft\.Web/sites/[A-Za-z0-9-]+$'; then
            echo "::error::The deployment did not return the resource id of the function app."
            exit 1
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Wait until the landing zone has registered the cases app's private endpoint in the central zone
        if: inputs.action == 'cases'
        env:
          CASES_ENDPOINTS: ${{ steps.params.outputs.cases_endpoints }}
        run: |
          # The wait for the one endpoint of the cases app (the console's name and its deployment site), "name:zone". The publish below is made from inside the network, in the Operator, through that
          # endpoint: both names of the app have to resolve to private addresses there (the container checks that, and stops when they do not), the app's own name has to resolve inside the network once the endpoint is there (a deployment
          # site calls its app by that name), and a later probe from the Operator finds the names. The policy registers them about ten minutes after the endpoint is made, so a first run waits here, and a run
          # after that finds the zone group at once. The credential of the first sign-in is old by the end of a wait like this one, which is why the sign-in for the publish follows it.
          attempts=40
          for attempt in $(seq 1 "$attempts"); do
            missing=""
            for pair in ${CASES_ENDPOINTS//,/ }; do
              endpoint="${pair%%:*}"
              zone="${pair#*:}"
              zones=$(az network private-endpoint dns-zone-group list --resource-group "$ENV_RESOURCE_GROUP" --endpoint-name "$endpoint" \
                --query "[].privateDnsZoneConfigs[].privateDnsZoneId" --output tsv || true)
              if ! grep -qi "/$zone\$" <<< "$zones"; then missing="$missing $endpoint"; fi
            done
            if [ -z "$missing" ]; then
              echo "The landing zone's policy has registered the private endpoint of the cases app in its central zone."
              exit 0
            fi
            echo "Not registered yet:$missing (check $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then sleep 60; fi
          done
          echo "::error::The landing zone's policy has not registered the private endpoint of the cases app in its central zone:$missing. The cases app was not given its code. Wait, or look at the policy compliance of the endpoint; do not create a private DNS zone."
          exit 1

      - name: Sign in to Azure again for the publish of the cases, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'cases'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pack the cases app's sources for the Operator
        id: pack
        if: inputs.action == 'cases'
        run: |
          # The cases app is published from its sources. Its finished package is 614,068 bytes zipped, and a request with 632,656 bytes of files (that package and the container script) was refused with an
          # internal server error on 2026-11-06, because a request takes at most 480,000 bytes of files (tools/operator-run.py). So the sources go (about 300 KB, packed as one LZMA stream) and the container builds the libraries (from the
          # hash-locked requirements.txt in them) with the pip command of tools/build-function-app.sh (docs/proposals/07-private-by-default.md, phase 2). The same script makes this archive:
          # its copy of the app's files, and no libraries.
          FUNCTION_APP_SOURCES_ONLY=1 bash tools/build-function-app.sh case-functions cases "$RUNNER_TEMP/cases-source" "$RUNNER_TEMP/cases-source.zip"
          # Everything that the request carries is counted here, with the evidence, before the Operator is looked for: the sources, the build script and the container script. tools/operator-run.py refuses more than 480,000 bytes
          # of files (MAX_FILE_BYTES): a request with 466,104 bytes of files was taken, and one with 632,656 was refused with an internal server error on 2026-11-06 (the finished package, which this check now keeps out).
          limit=480000
          sources_bytes=$(wc -c < "$RUNNER_TEMP/cases-source.zip" | tr -d ' ')
          build_bytes=$(wc -c < tools/build-function-app.sh | tr -d ' ')
          script_bytes=$(wc -c < operator/publish.sh | tr -d ' ')
          total=$((sources_bytes + build_bytes + script_bytes))
          if [ "$total" -gt "$limit" ]; then
            echo "::error::The files that go to the Operator are $total bytes (the cases app's sources $sources_bytes, the build script $build_bytes, the container script $script_bytes), more than the $limit bytes of files that a container group's request may hold: a request with 466104 bytes of files was taken, and one with 632656 was refused with an internal server error (2026-11-06). The sources have to get smaller."
            exit 1
          fi
          echo "The files that go to the Operator are $total bytes, of the $limit that a container group's request may hold."
          # The SHA-256 of the exact archive that is sent (a zip holds the time of each file, so it differs from run to run: it says what this run sent, and the digest of the app's own files, which the step that works out the
          # release gave, is what is compared with main). The record step writes both in the summary once the code is published.
          zip_sha256=$(sha256sum "$RUNNER_TEMP/cases-source.zip" | cut -d ' ' -f 1)
          echo "zip_sha256=$zip_sha256" >> "$GITHUB_OUTPUT"
          echo "The SHA-256 of the sources archive that goes to the Operator is $zip_sha256."

      - name: Publish the cases to the function app from inside the network, in the Operator
        id: publish_cases
        if: inputs.action == 'cases'
        # The container group is given 1200 seconds: a start of one to two minutes, the sign-in and the look at the names, the build of the libraries (seconds, with two attempts of at most five minutes each) and five attempts of the
        # publish (the package goes in seconds, but a site that has just been made may need a few minutes before it takes one, with a minute between the attempts). A run that is stuck is stopped at 20 minutes, the group is deleted,
        # and the log shows where it stood. The tool deletes the group at the end of every run, and the limit of the step is a second line, five minutes behind that.
        timeout-minutes: 25
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
          CASES_APP_PLAN: ${{ steps.params.outputs.cases_app_plan }}
          DEPLOY_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          DEPLOY_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # The code is published from inside the network, in a short-lived container group of the Operator (docs/proposals/07-private-by-default.md, phase 2), through the app's private endpoint: once an app is private, this runner
          # cannot reach its deployment site. This is the one way to publish, so that it is the one that is proven. The app stays public in this phase. The container signs in as the DEPLOY IDENTITY, the one that this job signed in
          # as and that holds the right to write to the app, with a token that GitHub issues to this run (a federated credential: no key, no password and no publish profile), so the Operator's own identity needs no right that writes.
          # The Operator is found by its name, as the checks find it, and nothing is changed here. On an estate that has none yet this step stops after the deploy, and the order is base, cases, operator, and then cases again.
          subnet_id="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          if ! grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            echo "::error::The identity id-meternaut-operator is not there. The action $ACTION publishes its code from inside the network, in the Operator, so run operator first, and then $ACTION again (the order on an estate that has none yet is base, cases, operator, and then cases again). The template was deployed, and the app was not given its code."
            exit 1
          fi
          if found=$(az rest --method get --url "https://management.azure.com${subnet_id}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
            echo "::error::The subnet snet-ops is not there. The action $ACTION publishes its code from inside the network, in the Operator, so run operator first, and then $ACTION again (the order on an estate that has none yet is base, cases, operator, and then cases again). The template was deployed, and the app was not given its code."
            exit 1
          else
            echo "::error::The subnet snet-ops could not be read: $found"
            exit 1
          fi
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          bytes=$(wc -c < "$RUNNER_TEMP/cases-source.zip" | tr -d ' ')
          # The deploy identity's token: the OpenID Connect token that GitHub issues to this run for the audience that its federated credential trusts, the one that azure/login asks for. It is requested here, right before the container
          # group is made, because it is valid for five minutes, and it is masked at once. It is written nowhere (not to the environment file, an output, a file of the run or the summary). It is on no command line either: the request
          # for it takes its bearer from a configuration on standard input, and the tool takes the token from the environment of that one command and sends it to the container group only as a secure value, which the group's
          # definition does not show and which the tool takes out of everything that it prints. Without a token nothing is published: the container could not sign in, so the step stops and says why.
          token=""
          note=""
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            note="the job has no token request for OpenID Connect (the id-token permission)"
          else
            curl_status=0
            answer=$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | curl --silent --fail --max-time 30 --config - "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" 2> /dev/null) || curl_status=$?
            if [ "$curl_status" != 0 ]; then
              note="the request for the token failed (curl exit code $curl_status)"
            else
              token=$(sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p' <<< "$answer")
              if [ -z "$token" ]; then
                note="the answer to the request for the token held none"
              else
                echo "::add-mask::$token"
              fi
            fi
            unset answer
          fi
          if [ -z "$token" ]; then
            echo "::error::Nothing was published: the container signs in as the deploy identity with a token of this run, and this run has none: $note."
            exit 1
          fi
          AZURE_FEDERATED_TOKEN="$token" python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-publish-$GITHUB_RUN_ID" \
            --subnet-id "$subnet_id" --identity-id "$identity_id" --image "$OPERATOR_IMAGE" --script operator/publish.sh \
            --secret-file "cases-source.zip=$RUNNER_TEMP/cases-source.zip" --secret-file "build-function-app.sh=tools/build-function-app.sh" \
            --env "PUBLISH_KIND=cases" --env "PUBLISH_PLAN=$CASES_APP_PLAN" --env "PUBLISH_APP=$FUNCTION_APP" --env "PUBLISH_RESOURCE_GROUP=$ENV_RESOURCE_GROUP" --env "PUBLISH_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "PUBLISH_CLIENT_ID=$DEPLOY_CLIENT_ID" --env "PUBLISH_TENANT_ID=$DEPLOY_TENANT_ID" --env "PUBLISH_FILE_BYTES=$bytes" --secure-env AZURE_FEDERATED_TOKEN \
            "${dns[@]}" --timeout-seconds 1200 --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete any container group of the publish of the cases that is left
        if: always() && inputs.action == 'cases' && steps.publish_cases.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the publish step started: every group that starts with
          # op-publish- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use, and a group that an earlier run left is taken too. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-publish- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-publish- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: Sign in to Azure again for the health check of the cases app in the Operator, because the publish in the Operator can take a quarter of an hour and a credential lasts five minutes
        if: inputs.action == 'cases'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait until the cases app answers
        id: health_cases
        if: inputs.action == 'cases'
        # The container group is given 1800 seconds: a start of one to two minutes and at most 60 tries of the health address, each a request of at most 15 seconds and ten seconds before the next. A site that has just been
        # given its code restarts, and a site whose subnet has just got its route table can need several minutes for its first start (the app's start limit is 600 seconds). A run that is stuck is stopped at 30 minutes, the
        # group is deleted, and the log shows where it stood. The tool deletes the group at the end of every run, and the limit of the step is a second line, five minutes behind that.
        timeout-minutes: 35
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
        run: |
          # The health address is asked from inside the network, in a short-lived container group of the Operator (docs/proposals/07-private-by-default.md), on the app's own name and through the app's private endpoint. Once the
          # app takes no public traffic this runner cannot reach it, and an answer over a public address would prove nothing about the path that people take: the platform's Application Gateway reaches the app over the same
          # endpoint. The tool is tools/console-check.py (operator/run-tool.sh runs it in the container, signed in as the Operator's own identity, which this check does not use: the health address needs no sign-in). The container
          # is given no token of the deploy identity. It stops with the reason unless the name resolves to a private address there. The Operator is found by its name, as the publish finds it, and nothing is changed here.
          subnet_id="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          client=""
          if grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            client=$(az rest --method get --url "https://management.azure.com${identity_id}?api-version=2023-01-31" --query properties.clientId --output tsv || true)
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$client"; then
            echo "::error::The identity id-meternaut-operator is not there. The action $ACTION asks the app's health address from inside the network, in the Operator, so run operator first, and then $ACTION again. The code was published, and the health of the app was not checked."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          if found=$(az rest --method get --url "https://management.azure.com${subnet_id}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
            echo "::error::The subnet snet-ops is not there. The action $ACTION asks the app's health address from inside the network, in the Operator, so run operator first, and then $ACTION again. The code was published, and the health of the app was not checked."
            exit 1
          else
            echo "::error::The subnet snet-ops could not be read: $found"
            exit 1
          fi
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          status=0
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-health-$GITHUB_RUN_ID" \
            --subnet-id "$subnet_id" --identity-id "$identity_id" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "console-check.py=tools/console-check.py" \
            --env "OPERATOR_CLIENT_ID=$client" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=console-check" --env "TOOL_ARGS=health --host $FUNCTION_APP.azurewebsites.net --tries 60 --interval 10 --timeout 15 --private" \
            "${dns[@]}" --timeout-seconds 1800 --summary "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" != 0 ]; then
            echo "::error::The cases app does not answer on /healthz from inside the network (the exit code is $status; the lines above say what the container saw: the address of the name, and the status of each try). Its platform log (the deployment site's /api/logs/docker) says why: a container that does not answer to the platform's start probe, after the subnet lost its route table, looks like this."
            exit "$status"
          fi

      - name: Delete any container group of the health check of the cases app that is left
        if: always() && inputs.action == 'cases' && steps.health_cases.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the health check started: every group that starts with
          # op-health- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use, and a group that an earlier run left is taken too. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-health- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-health- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: Sign in to Azure a fourth time for the check of the cases, because the third sign-in's credential lasts five minutes too
        if: inputs.action == 'cases'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record the release that runs on the cases app, in its tags and in the summary
        id: record_release
        if: inputs.action == 'cases'
        env:
          BUILD_COMMIT: ${{ steps.release.outputs.build_commit }}
          PACKAGE_SHA256: ${{ steps.release.outputs.package_sha256 }}
          ZIP_SHA256: ${{ steps.pack.outputs.zip_sha256 }}
          SITE_ID: ${{ steps.cases.outputs.site }}
        run: |
          # Release integrity (docs/proposals/10-ai-security-and-governance.md, "The release that runs"). The code was published and the app answers, so only now is the release written as two tags of the function app, which a
          # reader of the resource group sees (the settings of an app need a right to read that a reader does not hold): meternaut-build-commit and meternaut-package-sha256. A tag is merged in with the tags call of Azure Resource
          # Manager and touches nothing else of the app. The template wrote the same two values as the app's settings BUILD_COMMIT and PACKAGE_SHA256, which the in-app check reads; a deploy takes the tags off, and this step
          # puts them back only after a publish that went through, so a run that stops before it leaves no tag that says otherwise. tools/drift-check.py compares the commit with main (UNKNOWN when there is none, FAIL when the
          # app's files are not those of main). Values, not secrets: the commit and a digest.
          if ! grep -Eq '^[0-9a-f]{40}$' <<< "$BUILD_COMMIT" || ! grep -Eq '^[0-9a-f]{64}$' <<< "$PACKAGE_SHA256" || ! grep -Eq '^[0-9a-f]{64}$' <<< "$ZIP_SHA256"; then
            echo "::error::The release of this run is not known (the commit, the digest of the app's files or the digest of the archive is missing or is not hexadecimal), so it cannot be recorded. The code was published; nothing was recorded."
            exit 1
          fi
          body=$(printf '{"operation":"Merge","properties":{"tags":{"meternaut-build-commit":"%s","meternaut-package-sha256":"%s"}}}' "$BUILD_COMMIT" "$PACKAGE_SHA256")
          az rest --method patch --url "https://management.azure.com${SITE_ID}/providers/Microsoft.Resources/tags/default?api-version=2021-04-01" --body "$body" --only-show-errors --output none
          read -r commit_tag digest_tag <<< "$(az rest --method get --url "https://management.azure.com${SITE_ID}?api-version=2024-04-01" --query 'join(`" "`, [to_string(tags."meternaut-build-commit"), to_string(tags."meternaut-package-sha256")])' --output tsv)"
          if [ "$commit_tag" != "$BUILD_COMMIT" ] || [ "$digest_tag" != "$PACKAGE_SHA256" ]; then
            echo "::error::The tags of the cases app, read back from Azure, are not the release of this run. The code was published; the record is not trustworthy until a run of cases writes it."
            exit 1
          fi
          {
            echo "### The release that the cases app runs"
            echo
            echo "- Commit: \`$BUILD_COMMIT\`"
            echo "- Digest of the app's own files: \`$PACKAGE_SHA256\` (the setting \`PACKAGE_SHA256\` and the tag \`meternaut-package-sha256\`; \`python3 tools/source-digest.py src/case-functions\` works it out for any commit, and it is what \`tools/drift-check.py\` compares with main)"
            echo "- SHA-256 of the sources archive that this run sent to the Operator, which built the package from it and the hash-locked libraries inside it: \`$ZIP_SHA256\` (an archive holds the time of each file, so this one differs from run to run: it says what this run sent)"
            echo "- SHA-256 of the exact package that the Operator built and published: the line \`the cases package that is published has the SHA-256 ...\` of the publish step, above in this summary (it is the hash of the bytes that went to the app, and it differs from run to run too)"
            echo "- Read back from Azure: the tags \`meternaut-build-commit\` and \`meternaut-package-sha256\` of the function app are these two values."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "The release is recorded: commit $BUILD_COMMIT, digest of the app's files $PACKAGE_SHA256."

      - name: Say whether the integration subnet carries the route table of the landing zone's network manager
        if: inputs.action == 'cases'
        env:
          CASES_SUBNET: ${{ steps.params.outputs.cases_subnet_name }}
        run: |
          # The network manager puts its route table on a new subnet some minutes after the subnet is made (70 seconds the first time, five minutes the second), and an app on the subnet cannot
          # resolve a name, and so cannot start, before that: the wait for the app above is what holds the run, and the start limit of the app (600 seconds) lets the first start wait for the table.
          # This only says what the landing zone has done, so that a start that took long can be read. It never fails the run.
          vnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut"
          for name in snet-pe "$CASES_SUBNET"; do
            table=$(az rest --method get --url "https://management.azure.com${vnet}/subnets/${name}?api-version=2025-05-01" --query properties.routeTable.id --output tsv || true)
            if [ -n "$table" ] && [ "$table" != "None" ]; then
              echo "The subnet $name carries the route table ${table##*/}."
            else
              echo "::warning::The subnet $name carries no route table."
            fi
          done

      - name: The cases app lists its four functions
        if: inputs.action == 'cases'
        env:
          SITE_ID: ${{ steps.cases.outputs.site }}
        run: |
          python3 tools/cases-check.py functions --site "$SITE_ID" --minutes 15 | tee "$RUNNER_TEMP/case-functions.txt"
          # The app's own system-assigned identity is read from the app. Its object id is not printed: the log and the summary of a public repository are public, so it is masked at once and the summary says only whether the app has one.
          system_principal=$(az rest --method get --url "https://management.azure.com${SITE_ID}?api-version=2024-04-01" --query identity.principalId --output tsv 2>/dev/null || true)
          has_identity=no
          if grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$system_principal"; then
            has_identity=yes
            printf '::add-mask::%s\n::add-mask::%s\n' "$system_principal" "${system_principal^^}"
          fi
          {
            echo "### The cases app"
            echo
            echo '```'
            cat "$RUNNER_TEMP/case-functions.txt"
            echo '```'
            echo
            echo "The cases app has an identity of its own, a system-assigned one: $has_identity. Its object id is not printed here, because this summary is public; the tools that need it read it from the app (tools/access-requirements.py with --cases-site), and a person reads it with their own sign-in. It is the app's own system-assigned identity. It reads the pilot subscription with two roles (Reader and Cost Management Reader), and it sends the letters with one Exchange role. This workflow gives none of them (environment/BOOTSTRAP.md). Until they exist, a run ends with an authorization error that \`cases-run\` shows. The application (client) id that the mailbox tool asks for cannot be read from the app, and the deployment identity may not read the directory: the owner's session reads it from the service principal."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the first integration subnet of the cases app, snet-web, when it is still there and nothing uses it
        if: inputs.action == 'cases'
        run: |
          # snet-web lost the route table of the landing zone's network manager and was replaced by snet-cases (CHANGELOG.md). The platform lets go of the link between an app plan and a subnet
          # some time after the app has left the subnet, and until then the subnet cannot be deleted: that is said, and the next run of the action tries again. Any other refusal stops the run.
          subnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-web"
          if ! found=$(az rest --method get --url "https://management.azure.com${subnet}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            if grep -Eqi 'NotFound|404' <<< "$found"; then
              echo "The subnet snet-web is not there: nothing to remove."
              exit 0
            fi
            echo "::error::The subnet snet-web could not be read: $found"
            exit 1
          fi
          if refused=$(az rest --method delete --url "https://management.azure.com${subnet}?api-version=2025-05-01" --only-show-errors 2>&1); then
            echo "The subnet snet-web is removed."
          elif grep -Eqi 'InUseSubnetCannotBeDeleted|ServiceAssociationLink|is in use' <<< "$refused"; then
            echo "::warning::The subnet snet-web is still linked to the app plan by the platform, so it cannot be removed yet. The next run of the action cases removes it."
          else
            echo "::error::The subnet snet-web could not be removed: $refused"
            exit 1
          fi

      - name: Remove the retired runner identity of the first loop, when it is still there and nothing holds it
        if: inputs.action == 'cases'
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
        run: |
          # The first version of the loop made id-meternaut-runner, an identity that changed Azure with one custom role (CHANGELOG.md, AGENTS.md rule 29). The owner rejected a standing right to write
          # for a tool: the role and its assignment were removed by hand on 2026-11-05, and the template no longer makes the identity or attaches it. A deployment never removes what a template stops
          # making, so it is removed here, by its name, and only when the cases app does not carry it and no role is assigned to it in the project's group. Anything else stops the run and says why.
          identity="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-meternaut-runner"
          if ! principal=$(az rest --method get --url "https://management.azure.com${identity}?api-version=2023-01-31" --query properties.principalId --output tsv 2>&1); then
            if grep -Eqi 'NotFound|404' <<< "$principal"; then
              echo "The identity id-meternaut-runner is not there: nothing to remove."
              exit 0
            fi
            echo "::error::The identity id-meternaut-runner could not be read: $principal"
            exit 1
          fi
          [ -z "$principal" ] || printf '::add-mask::%s\n::add-mask::%s\n' "$principal" "${principal^^}"
          site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$FUNCTION_APP"
          carried=$(az rest --method get --url "https://management.azure.com${site}?api-version=2024-04-01" --query identity.userAssignedIdentities --output json 2>/dev/null || true)
          if grep -qi 'id-meternaut-runner' <<< "$carried"; then
            echo "::error::The cases app still carries id-meternaut-runner, so it is not removed. The template no longer attaches it: run the action cases again."
            exit 1
          fi
          assigned=$(az rest --method get --url "https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01&%24filter=principalId%20eq%20%27${principal}%27" --query "length(value)" --output tsv)
          if [ "$assigned" != "0" ]; then
            echo "::error::$assigned role assignment(s) of id-meternaut-runner are left at or around the project's group, so it is not removed. A person removes them first, with tools/access-requirements.py retire."
            exit 1
          fi
          az rest --method delete --url "https://management.azure.com${identity}?api-version=2023-01-31" --only-show-errors
          echo "The identity id-meternaut-runner is removed."

      - name: Before the Watch is started, the cases app lists its four functions
        if: inputs.action == 'cases-run'
        env:
          SITE_NAME: ${{ steps.params.outputs.cases_function_app_name }}
        run: |
          # The list of the functions is a read through Azure Resource Manager, so it is made from here. It comes first: a container group of the Operator is made only for an app that is ready.
          site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$SITE_NAME"
          python3 tools/cases-check.py functions --site "$site" --minutes 5

      - name: Start one Watch and read its History
        id: watch
        if: inputs.action == 'cases-run'
        # The check waits up to 30 minutes for the end of the Watch, and the container group is given 40 (2400 seconds); the tool deletes the group at the end of every run, and the limit of the step is a second line behind that.
        timeout-minutes: 50
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
          INSIGHTS_NAME: ${{ steps.params.outputs.appinsights_name }}
          OPERATOR_IDENTITY_ID: ${{ steps.operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.operator.outputs.subnet_id }}
        run: |
          # One message in the control queue starts one Watch now. The app writes the History of the run to its telemetry, which is read by the same tool.
          # The Watch changes no resource of the estate: it reads Azure and calls the AI Gateway with its own identity and no key (the Detective and the Skeptic, chat completions: every model call of
          # Meternaut goes through the gateway, AGENTS.md rule 15 (c), docs/proposals/08-ai-gateway.md). With the investigation on (the cases app has the address of the Foundry
          # project, which the action cases passes on once the action foundry has made the project) it also creates its agents and conversations in its own Foundry project, and those agents call their models through
          # the project's connection and the AI Gateway while the switch AGENTS_VIA_AI_GATEWAY (tools/environment-params.py, True since the owner's order of 2026-11-07) is on, and an answer of the Agent Service that
          # says why it could not is in the History in words (docs/proposals/08-ai-gateway.md, step 2). With the switch set to False, the way back, they call the models of that resource directly, which AGENTS.md rule 15 (c)
          # allows only as the owner's written exception.
          # tools/cases-check.py runs inside the network, in a container group of the Operator, as it ran on this runner before, with the same arguments. It loads the helpers of tools/check-helpers.py from its own folder, so the two files go into the container's secret volume. The container signs in with the Operator's own identity (no key: it holds Storage Queue Data Contributor on the control queue and Reader on the group),
          # operator/run-tool.sh runs the tool and gives its exit code, and the container is told that it is in a GitHub Actions run, which it is (tools/operator-run.py refuses anywhere else; AGENTS.md rule 18).
          insights="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Insights/components/$INSIGHTS_NAME"
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          # The Watch reads every subscription that the app's identity can read, so its History names resources of other teams. This log and this summary are public, so the tool is asked for counts only (--counts-only): no name of a
          # resource, no resource group, no subscription and no text of a finding or of a warning is printed, and the History itself stays in the app's telemetry, where the owner reads it.
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-check-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "cases-check.py=tools/cases-check.py" --secret-file "check-helpers.py=tools/check-helpers.py" \
            --env "GITHUB_ACTIONS=true" --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=cases-check" --env "TOOL_ARGS=run --storage-account $STORAGE_ACCOUNT --insights $insights --minutes 30 --counts-only" \
            "${dns[@]}" --timeout-seconds 2400 --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete any container group of the checks that is left
        if: always() && steps.watch.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the check step started: every group
          # that starts with op-check- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use, and a group that an earlier
          # run left is taken too. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-check- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-check- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: Say which plan the web page runs on
        if: inputs.action == 'page-latency'
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
          WANTED_KIND: ${{ steps.params.outputs.cases_app_plan }}
        run: |
          # A read, so that the measurement below says what it measured: the plan of the cases app, as Azure reports it, and the kind that tools/environment-params.py asks for. Nothing is changed.
          site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$FUNCTION_APP"
          if ! plan=$(az rest --method get --url "https://management.azure.com${site}?api-version=2024-04-01" --query properties.serverFarmId --output tsv 2>&1); then
            if grep -Eqi 'NotFound|\b404\b' <<< "$plan"; then
              echo "::error::The cases app is not there, so there is no web page to measure. Run cases first. Nothing was changed."
            else
              echo "::error::The cases app could not be read: $plan"
            fi
            exit 1
          fi
          tier=$(az rest --method get --url "https://management.azure.com${plan}?api-version=2024-04-01" --query sku.tier --output tsv)
          echo "The cases app runs on the plan ${plan##*/}, a $tier plan. tools/environment-params.py asks for $WANTED_KIND."
          {
            echo "### The web page runs on the plan \`${plan##*/}\` ($tier)"
            echo
            echo "CASES_APP_PLAN in tools/environment-params.py is $WANTED_KIND."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure how fast the web page answers, from inside the network, in the Operator
        id: latency
        if: inputs.action == 'page-latency'
        # The measurement takes the minutes that were asked for (20 at the most) and the container group is given those and five more, 1500 seconds at the most, because a group has to finish within 25 minutes: a start of one to
        # two minutes, and a last request that may wait up to 75 seconds. The tool deletes the group at the end of every run, and the limit of the step is a second line, five minutes behind that.
        timeout-minutes: 30
        env:
          MINUTES: ${{ inputs.minutes }}
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
          OPERATOR_IDENTITY_ID: ${{ steps.operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.operator.outputs.subnet_id }}
        run: |
          # tools/console-check.py latency runs inside the network, in a container group of the Operator, as the health check and the front-door check do, because a closed app answers nobody outside the network: it asks the app's own name
          # over the app's private endpoint, and requires that the name resolves to a private address there (--private). It asks /healthz, which needs no sign-in, so no credential is sent, the container signs in as the Operator's own
          # identity, which the measurement does not use, and it is given no token of the deploy identity. It only reads. A request every ten seconds for the minutes asked for, a quiet gap, and three requests after it; the tool's
          # lines and its summary are the log of the container, which the step summary shows. Its exit code is the rule of docs/proposals/07-private-by-default.md: 0 when no request took more than 15 seconds and none was not 200.
          if ! [[ "$MINUTES" =~ ^[0-9]{1,2}$ ]] || [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 20 ]; then
            echo "::error::The input minutes is a whole number from 1 to 20: the Operator's container group has to finish within 25 minutes. Nothing was done."
            exit 1
          fi
          seconds=$((MINUTES * 60 + 300))
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          status=0
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-latency-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "console-check.py=tools/console-check.py" \
            --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=console-check" --env "TOOL_ARGS=latency --host $FUNCTION_APP.azurewebsites.net --private --minutes $MINUTES --interval 10" \
            "${dns[@]}" --timeout-seconds "$seconds" --summary "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/latency.log" || status=$?
          {
            echo "### How fast the web page answers: $MINUTES minutes, from inside the network"
            echo
            echo '```'
            sed -n -E 's/^\| (latency: [0-9]+ requests, p50.*|after the quiet gap: .*|verdict: .*)$/\1/p' "$RUNNER_TEMP/latency.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error::The measurement did not pass (exit code $status). When the web page is on Flex Consumption and the lines above end with a verdict that says that the rule is not met, the stall is there: report the numbers to the owner, who decides (he ordered Flex Consumption; CASES_APP_PLAN in tools/environment-params.py goes to Basic only on his word, and then cases is run; docs/proposals/07-private-by-default.md). Otherwise the measurement itself failed (the lines above say what the container saw: which address the app's name resolved to there, which has to be a private one) and nothing was decided. Nothing was changed."
            exit "$status"
          fi

      - name: Delete any container group of the latency measurement that is left
        if: always() && inputs.action == 'page-latency' && steps.latency.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the measurement started: every group that starts with
          # op-latency- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use, and a group that an earlier run left is taken too. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-latency- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-latency- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: Plant the waste
        id: plant
        if: inputs.action == 'plant'
        run: |
          # Waste of Meternaut's own, in the project's resource group (environment/cases/planted.bicep): an unattached disk and, when asked, an
          # unassigned public IP address and a virtual machine that nothing uses (plant_vm: with its network interface and its OS disk, no public IP
          # address, no account and no key), each tagged meternaut-planted. The Watch finds them, two AI roles judge them, and a person approves: the
          # change then runs with that person's own permissions (Meternaut holds no right to change Azure). Nothing that belongs to another project
          # is touched, and nothing is deleted. The what-if is shown first.
          python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/cases/planted.bicep --parameters "$RUNNER_TEMP/planted.parameters.json"
          disk=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/cases/planted.bicep --parameters "$RUNNER_TEMP/planted.parameters.json" \
            --name "plant-$GITHUB_RUN_ID" --output diskName)
          if ! printf '%s' "$disk" | grep -Eq '^planted-disk-[a-z0-9]{1,12}$'; then
            echo "::error::The deployment did not return the name of the planted disk."
            exit 1
          fi
          echo "disk=$disk" >> "$GITHUB_OUTPUT"

      - name: What was planted
        if: inputs.action == 'plant'
        run: |
          {
            echo "### Planted waste in $ENV_RESOURCE_GROUP"
            echo
            echo '```'
            az resource list --resource-group "$ENV_RESOURCE_GROUP" --query "[?tags.\"meternaut-planted\"].{name:name, type:type, planted:tags.\"meternaut-planted\", location:location}" --output table
            echo '```'
            if [ "$PLANT_VM" = "true" ]; then
              echo
              echo "### The machine, as Azure shows it"
              echo
              echo '```'
              az vm show --resource-group "$ENV_RESOURCE_GROUP" --name "planted-vm-$PLANTED_ID" --show-details --query "{name:name, size:hardwareProfile.vmSize, power:powerState, provisioning:provisioningState, publicIp:publicIps}" --output table
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Knock at the console's front door
        if: steps.params.outputs.door_in_operator != 'true' && (inputs.action == 'loop-check' || inputs.action == 'cases')
        # Each request can wait up to a minute when the platform's front end is slow, and the loop has five tries: the limit keeps the queue of the hub free.
        timeout-minutes: 20
        env:
          CONSOLE_HOST: ${{ steps.params.outputs.console_host }}
          CONSOLE_HOST_SET: ${{ steps.params.outputs.console_host_set }}
        run: |
          # Without a sign-in nobody gets a page: the sign-in sends a visitor to Microsoft Entra, or, while it is not set up, the app refuses every request.
          # That holds for the return address of the Azure Resource Manager sign-in (/arm/return, with and without a code) like for every other page.
          # A made-up sign-in header is not served either. The site may need a minute after a publish.
          # The door is the name that people open: the console's host name on the platform's Application Gateway when the secret CONSOLE_HOST_NAME is set, which is the real front door then (the request
          # goes from this runner through the gateway to the app's private endpoint, and the check also asks that the sign-in's return address names that host and not the app's own name), and the app's own
          # name when it is not. A closed app answers nobody outside the network, so when the app takes no public traffic and no host name is set this step does not run: the next step makes the same check
          # from inside the network, in the Operator (the output door_in_operator of the settings step says which of the two runs).
          expect=refuse
          if [ -n "$CONSOLE_APP_CLIENT_ID" ]; then expect=signin; fi
          proxied=()
          if [ "$CONSOLE_HOST_SET" = true ]; then proxied=(--proxied); fi
          for attempt in 1 2 3 4 5; do
            if python3 tools/console-check.py door --host "$CONSOLE_HOST" --expect "$expect" "${proxied[@]}" --summary "$GITHUB_STEP_SUMMARY"; then
              exit 0
            fi
            echo "The front door did not answer as expected (attempt $attempt of 5)."
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          echo "::error::The console's front door is not shut as it should be."
          exit 1

      - name: Knock at the web page's front door from inside the network, in the Operator
        id: door_operator
        if: steps.params.outputs.door_in_operator == 'true' && (inputs.action == 'loop-check' || inputs.action == 'cases')
        # The group is given 900 seconds: a start of one to two minutes and one pass of the tool, which asks 15 addresses, each at most three times of at most a minute. A run that is stuck is stopped at 15 minutes, the group
        # is deleted, and the log shows where it stood. The tool deletes the group at the end of every run, and the limit of the step is a second line, ten minutes behind that.
        timeout-minutes: 25
        env:
          FUNCTION_APP: ${{ steps.params.outputs.cases_function_app_name }}
        run: |
          # The cases app takes no public traffic and no host name of a gateway is set (the output door_in_operator of the settings step), so the step before this one did not run: a closed app answers nobody outside the
          # network, and this runner has nothing to knock at. The same check is made from inside the network, in a short-lived container group of the Operator (docs/proposals/07-private-by-default.md), at the app's own name,
          # which resolves there to the address of the app's private endpoint, and the tool is told to require that (--private): an answer over a public address would prove nothing about the path that people take.
          # The tool is tools/console-check.py, run through operator/run-tool.sh as the health check of the cases app is. The answers that it expects do not change: without a sign-in nobody gets a page, which is a redirect
          # to the sign-in when the sign-in is set up and the app's own refusal when it is not. The check only reads. It sends no credential, the container signs in as the Operator's own identity, which the check does
          # not use, and it is given no token of the deploy identity. There is no second try: in the action cases the wait until the app answers comes first, each request of the tool is tried three times, and a person
          # runs loop-check again. The Operator is found by its name, as the publish and the health check find it, and nothing is changed here.
          subnet_id="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          client=""
          if grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            client=$(az rest --method get --url "https://management.azure.com${identity_id}?api-version=2023-01-31" --query properties.clientId --output tsv || true)
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$client"; then
            echo "::error::The identity id-meternaut-operator is not there. The action $ACTION asks the web page's front door from inside the network, in the Operator, because the cases app takes no public traffic and no host name is set, so run operator first (the order is base, cases, operator), and then $ACTION again. The front door was not checked."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          if found=$(az rest --method get --url "https://management.azure.com${subnet_id}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
                        echo "::error::The subnet snet-ops is not there. The action $ACTION asks the web page's front door from inside the network, in the Operator, because the cases app takes no public traffic and no host name is set, so run operator first (the order is base, cases, operator), and then $ACTION again. The front door was not checked."
            exit 1
          else
            echo "::error::The subnet snet-ops could not be read: $found"
            exit 1
          fi
          expect=refuse
          if [ -n "$CONSOLE_APP_CLIENT_ID" ]; then expect=signin; fi
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          status=0
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-door-$GITHUB_RUN_ID" \
            --subnet-id "$subnet_id" --identity-id "$identity_id" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "console-check.py=tools/console-check.py" \
            --env "OPERATOR_CLIENT_ID=$client" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=console-check" --env "TOOL_ARGS=door --host $FUNCTION_APP.azurewebsites.net --expect $expect --private" \
            "${dns[@]}" --timeout-seconds 900 --summary "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" != 0 ]; then
            echo "::error::The web page's front door is not shown to be shut from inside the network (the exit code is $status; the lines above say what the container saw: which address the app's name resolved to there, which has to be a private one, and what each request got). Nothing was changed."
            exit "$status"
          fi

      - name: Delete any container group of the front-door check that is left
        if: always() && (inputs.action == 'loop-check' || inputs.action == 'cases') && steps.door_operator.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the front-door check in the Operator started: every group that
          # starts with op-door- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use, and a group that an earlier run left is taken too. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-door- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-door- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: The control queue that the Operator is given a role on is there
        if: inputs.action == 'operator'
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
          CASES_QUEUE: ${{ steps.params.outputs.cases_queue_name }}
        run: |
          # The Operator puts the control message that starts a Watch in the queue, so it is given Storage Queue Data Contributor on the control queue cases-control (made by the action cases). The template only reads it,
          # so it has to be there: the order is base, cases, operator. This step only reads, and stops before anything is changed.
          url="https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT/queueServices/default/queues/$CASES_QUEUE?api-version=2023-05-01"
          if queue=$(az rest --method get --url "$url" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$queue"; then
            queue=""
          else
            echo "::error::The control queue $CASES_QUEUE could not be read: $queue"
            exit 1
          fi
          if [ "$queue" != "$CASES_QUEUE" ]; then
            echo "::error::The control queue $CASES_QUEUE is not there. Run cases first (after base): it makes the queue."
            echo "::error::The Operator is given a role on the control queue, so the actions base and cases run before operator. Nothing was changed."
            exit 1
          fi
          echo "The control queue is there."

      - name: Deploy the Operator, its identity and the subnet of its container groups
        if: inputs.action == 'operator'
        run: |
          # The identity id-meternaut-operator, the subnet snet-ops (delegated to container groups, with a network security group of its own, and made only while it is not there:
          # AGENTS.md rule 27) and two roles (environment/operator/main.bicep): Reader on the project's resource group, and Storage Queue Data Contributor on the control queue
          # cases-control. No key anywhere. Nothing runs between two runs of the Operator.
          client=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/operator/main.bicep --parameters "$RUNNER_TEMP/operator.parameters.json" \
            --name "operator-$GITHUB_RUN_ID" --output identityClientId)
          if ! printf '%s' "$client" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::The deployment did not return the client id of the Operator's identity."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          echo "The Operator's identity and the subnet of its container groups are in resource group $ENV_RESOURCE_GROUP."

      - name: The resource provider of Container Instances is registered in the subscription
        if: inputs.action == 'operator-probe'
        run: |
          # The workflow's identity cannot register a resource provider (environment/BOOTSTRAP.md): a person does, once. A state that cannot be read is said and does not stop the run: the request
          # that makes the container group then says what is wrong.
          state=$(az provider show --namespace Microsoft.ContainerInstance --query registrationState --output tsv 2>/dev/null || true)
          case "$state" in
            Registered) echo "Microsoft.ContainerInstance is registered in the subscription." ;;
            "") echo "::warning::The registration of Microsoft.ContainerInstance could not be read. If the container group cannot be made for that reason, a person registers the provider once (environment/BOOTSTRAP.md)." ;;
            *)
              echo "::error::Microsoft.ContainerInstance is $state in the subscription, and the workflow's identity cannot register it. A person does that once (environment/BOOTSTRAP.md, the section on the Operator). Nothing was changed."
              exit 1 ;;
          esac

      - name: Wait until the landing zone has put its route table on the Operator's subnet
        if: inputs.action == 'operator' || inputs.action == 'operator-probe'
        timeout-minutes: 25
        run: |
          # The landing zone's network manager puts a route table on a new subnet some minutes after the subnet is made (70 seconds the first time, five minutes the second: CHANGELOG.md, 2026-11-05),
          # and a container group on the subnet gets its way out through that table. The endpoint subnet is the yardstick: when it carries no table, the landing zone puts none on this network and
          # there is nothing to wait for. After the action operator the table is waited for, for up to 20 minutes; before a probe it is read once and said, because the probe is what shows whether
          # a group gets out. This step needs no credential that it has not used already, so the sign-in of the first step is enough.
          vnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut"
          table_of() {
            az rest --method get --url "https://management.azure.com${vnet}/subnets/${1}?api-version=2025-05-01" --query properties.routeTable.id --output tsv || true
          }
          reference=$(table_of snet-pe)
          if [ -z "$reference" ] || [ "$reference" = "None" ]; then
            echo "The endpoint subnet carries no route table, so the landing zone puts none on this network: there is nothing to wait for."
            exit 0
          fi
          attempts=40
          if [ "$ACTION" != "operator" ]; then attempts=1; fi
          for attempt in $(seq 1 "$attempts"); do
            table=$(table_of snet-ops)
            if [ -n "$table" ] && [ "$table" != "None" ]; then
              echo "The subnet snet-ops carries the route table ${table##*/}."
              exit 0
            fi
            echo "snet-ops carries no route table yet (check $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then sleep 30; fi
          done
          if [ "$ACTION" = "operator" ]; then
            echo "::error::The landing zone's network manager has put a route table on snet-pe and has not put one on snet-ops in 20 minutes. A container group on snet-ops may have no way out. Nothing else was changed: run operator again later."
            exit 1
          fi
          echo "::warning::snet-ops carries no route table. The probe shows whether a container group on it gets out."

      - name: Run the probe in the Operator
        id: probe
        if: inputs.action == 'operator-probe'
        # The tool deletes its container group at the end of every run, and a stuck container is given up after 20 minutes: the limit is a second line behind that. The group is given 1200 seconds and
        # not the 900 that the first probe had, because the build test of the cases app's libraries adds up to two attempts of four minutes in the worst case (a run takes two to four minutes).
        timeout-minutes: 25
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          CASES_APP: ${{ steps.params.outputs.cases_function_app_name }}
          DEPLOY_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          DEPLOY_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # operator/probe.sh runs in a container group on snet-ops, as the Operator's identity, and prints one line for each thing that it finds out: whether the identity signs in, which names resolve
          # to private addresses, which addresses a container group reaches, whether a secret volume of the size of a small package arrives, whether the deploy identity signs in there with a token of this
          # run, whether the cases app's libraries can be built there from the hash-locked lock file, and what the deployment site of the cases app answers. tools/operator-run.py makes the group
          # through Azure Resource Manager, reads its log while it runs, and deletes it in every case. The log holds no token and no secret, and goes into the run's summary.
          scope="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP"
          subnet_id="$scope/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          # The Operator's identity is found by its name in the project's group, and its client id is read from the identity itself: the workflow reads no identity with az identity, and names no
          # identity resource type outside the one path that removes the retired runner identity (tools/tests/test_environment_template.py guards both).
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          client=""
          if grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            client=$(az rest --method get --url "https://management.azure.com${identity_id}?api-version=2023-01-31" --query properties.clientId --output tsv || true)
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$client"; then
            echo "::error::The identity id-meternaut-operator is not there. Run operator first."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          # The names that have a private endpoint must resolve to a private address. The cases app has one (the action cases makes it), and the landing zone's policy
          # registers the names of an endpoint, the app's and its deployment site's, in its central zone some minutes after the endpoint is there. Until then, or where the landing zone has no policy
          # for those names, the answer is public, and the probe says FAIL: a private address was expected. The deployment site has a check of its own in the probe, which also asks for the status of a GET.
          private_names="$STORAGE_ACCOUNT.queue.core.windows.net $STORAGE_ACCOUNT.blob.core.windows.net $FOUNDRY_ACCOUNT.services.ai.azure.com $CASES_APP.azurewebsites.net"
          scm_hosts="$CASES_APP.scm.azurewebsites.net"
          # The last two of the first fourteen are inferred and not read in a source: the host of a release asset, and the storage host that workflow artifacts come from (it resolves in public DNS).
          # The one after them is the main site of the cases app, asked without a sign-in: the console's health address, which needs none.
          urls="https://mcr.microsoft.com/ https://management.azure.com/ https://login.microsoftonline.com/ https://api.github.com/ https://codeload.github.com/ https://github.com/ https://pipelines.actions.githubusercontent.com/ https://objects.githubusercontent.com/ https://pypi.org/ https://files.pythonhosted.org/ https://api.applicationinsights.io/ https://api.loganalytics.io/ https://release-assets.githubusercontent.com/ https://productionresultssa0.blob.core.windows.net/ https://$CASES_APP.azurewebsites.net/healthz"
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          # A file of 400,000 bytes travels in the request as a secret volume, so that the probe can say whether a secret volume takes a file of that size whole. It did on 2026-11-06: with the lock file and the probe's own
          # script the request held 466,104 bytes of files, the largest that is known to have been taken (tools/operator-run.py, MAX_FILE_BYTES, has the evidence and the cap).
          size=400000
          head -c "$size" /dev/urandom > "$RUNNER_TEMP/size-test"
          # The cases app's lock file travels in the request, whole (the tool refuses more than 480,000 bytes of files): the probe builds the
          # libraries in the container from it, with the pip command of tools/build-function-app.sh, and says whether the interpreter of the image can do that.
          lock=src/case-functions/requirements.txt
          lock_bytes=$(wc -c < "$lock" | tr -d ' ')
          # The deploy identity's token: the OpenID Connect token that GitHub issues to this run for the audience that its federated credential trusts, the one that azure/login asks for. It is requested here, right
          # before the container group is made, because it is valid for five minutes, and it is masked at once. It is written nowhere (not to the environment file, an output, a file of the run or the summary).
          # It is on no command line either: the request for it takes its bearer from a configuration on standard input, and the tool takes the token from the environment of that one command and sends it
          # to the container group only as a secure value, which the group's definition does not show and which the tool takes out of everything that it prints. Where there is no token, the probe is
          # told why, says so in the check of the deploy identity, and goes on with the others.
          token=""
          note=""
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            note="the job has no token request for OpenID Connect (the id-token permission)"
          else
            curl_status=0
            answer=$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | curl --silent --fail --max-time 30 --config - "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" 2> /dev/null) || curl_status=$?
            if [ "$curl_status" != 0 ]; then
              note="the request for the token failed (curl exit code $curl_status)"
            else
              token=$(sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p' <<< "$answer")
              if [ -z "$token" ]; then
                note="the answer to the request for the token held none"
              else
                echo "::add-mask::$token"
              fi
            fi
            unset answer
          fi
          secure=()
          note_args=()
          if [ -n "$token" ]; then
            secure=(--secure-env AZURE_FEDERATED_TOKEN)
          else
            echo "::warning::The probe goes on without a token for the deploy identity: $note."
            note_args=(--env "PROBE_TOKEN_NOTE=$note")
          fi
          AZURE_FEDERATED_TOKEN="$token" python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-probe-$GITHUB_RUN_ID" \
            --subnet-id "$subnet_id" --identity-id "$identity_id" --image "$OPERATOR_IMAGE" --script operator/probe.sh \
            --secret-file "size-test=$RUNNER_TEMP/size-test" --secret-file "cases-requirements.txt=$lock" \
            --env "OPERATOR_CLIENT_ID=$client" --env "OPERATOR_GROUP=$ENV_RESOURCE_GROUP" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "PROBE_NAMES=$private_names" --env "PROBE_PRIVATE_NAMES=$private_names $scm_hosts" --env "PROBE_URLS=$urls" --env "PROBE_SIZE_BYTES=$size" \
            --env "PROBE_SCM_HOSTS=$scm_hosts" --env "PROBE_LOCK_BYTES=$lock_bytes" \
            --env "PROBE_DEPLOY_CLIENT_ID=$DEPLOY_CLIENT_ID" --env "PROBE_DEPLOY_TENANT_ID=$DEPLOY_TENANT_ID" "${note_args[@]}" "${secure[@]}" \
            "${dns[@]}" --timeout-seconds 1200 --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete any container group of the probe that is left
        if: always() && inputs.action == 'operator-probe' && steps.probe.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the probe step started: every group
          # that starts with op-probe- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use, and a group that an earlier
          # run left is taken too. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-probe- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-probe- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: The network, the Foundry resource of the agents and the Operator are there, the service is offered here, and the deploy identity may give the roles of the AI Gateway
        if: inputs.action == 'aigateway'
        env:
          NETWORK_EXISTS: ${{ steps.network.outputs.network_exists }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          DEPLOYER_ID: ${{ steps.me.outputs.oid }}
        run: |
          # Everything that can be known before anything is changed is read here, so that a gateway is not made and then left without a role. This step only reads. The AI Gateway builds on the virtual network (its
          # subnet goes into it), on the Foundry resource of the agents (the gateway's identity gets a role on it, and the template reads it) and on the Operator (its identity gets a role on the gateway, and the
          # template reads it): the order is foundry and cases, operator, then aigateway.
          if [ ! -f "$RUNNER_TEMP/aigateway.parameters.json" ]; then
            echo "::error::The virtual network has no free range for the gateway's subnet: it needs a /26, or a /27 at the least, that none of the other subnets uses. Nothing was changed. A person frees or adds a range (docs/proposals/08-ai-gateway.md)."
            exit 1
          fi
          if [ "$NETWORK_EXISTS" != true ]; then
            echo "::error::The virtual network is not there. Run model-side first: the gateway's subnet goes into it. Nothing was changed."
            exit 1
          fi
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.CognitiveServices/accounts --query "[?name=='$FOUNDRY_ACCOUNT'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The Foundry resource $FOUNDRY_ACCOUNT of the agents is not in $ENV_RESOURCE_GROUP. Run foundry first (the order is foundry and cases, then operator, then aigateway). Nothing was changed."
            exit 1
          fi
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].name" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The identity id-meternaut-operator is not there. Run operator first: it gets AI Gateway Models User on the gateway and runs the check. Nothing was changed."
            exit 1
          fi
          echo "The virtual network, the Foundry resource $FOUNDRY_ACCOUNT and the Operator's identity are there."
          # The service is a preview and is offered in a few regions. A list that cannot be read is said and does not stop the run: the deploy then says what is wrong.
          region=$(tr '[:upper:]' '[:lower:]' <<< "$ENV_LOCATION" | tr -d ' ')
          if ! offered=$(az provider show --namespace Microsoft.ApiManagement --query "resourceTypes[?resourceType=='aigateways'].locations[]" --output tsv 2>&1); then
            echo "::warning::The regions of the AI Gateway could not be read ($offered). If the service is not offered in $ENV_LOCATION, the deploy says so."
          elif [ -z "$offered" ]; then
            echo "::error::The resource provider Microsoft.ApiManagement does not list the resource type aigateways in this subscription. The AI Gateway is a preview service and has to be offered to the subscription first (docs/proposals/08-ai-gateway.md). Nothing was changed."
            exit 1
          elif ! tr '[:upper:]' '[:lower:]' <<< "$offered" | tr -d ' ' | grep -Fxq "$region"; then
            echo "::error::The AI Gateway is not offered in $ENV_LOCATION; the provider lists: $(paste -sd, - <<< "$offered"). The preview is offered in a few regions only. Nothing was changed."
            exit 1
          else
            echo "The resource type aigateways is offered in $ENV_LOCATION."
          fi
          # The deploy identity may give a role to a service principal only for the roles that the condition of its right to assign roles lists (environment/BOOTSTRAP.md). The template gives Foundry User (to the
          # gateway's identity, on the Foundry resource) and AI Gateway Models User (to the Operator's identity, on the gateway). Azure would refuse the second after the gateway was made, so it is looked for here.
          # A run that is signed in as a person (the runs from the owner's own machine, 2026-11-08 to 2026-11-11, were) holds Owner or User Access Administrator on the group or above it (the tenant's root group too), with no condition:
          # such a person may give any role, and the look at the condition below is not needed. An assignment of Owner or User Access Administrator that carries a condition is not counted.
          foundry_user=53ca6127-db72-4b80-b1b0-d745d6d5456d
          models_user=a6b68e3d-a1f0-4c60-8678-237c050cf4ea
          administrator=f58310d9-a9f6-439a-9e8d-f62e7b41a168
          owner=8e3af657-a8ff-443c-a75c-2fe8c4bcb635
          user_access_administrator=18d7d88d-d35e-4fb5-a5c3-7773c20a72d9
          group="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP"
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$DEPLOYER_ID"; then
            echo "::error::The object id of the deploy identity was not read from its token, so its right to assign roles cannot be looked at. Nothing was changed."
            exit 1
          fi
          deployer="${DEPLOYER_ID,,}"
          if ! listed=$(az role assignment list --assignee-object-id "$deployer" --scope "$group" --include-inherited --fill-principal-name false --fill-role-definition-name false \
            --query "[].[scope, roleDefinitionId, condition]" --output tsv --only-show-errors 2>&1); then
            echo "::error::The role assignments of the deploy identity on the group could not be read: $listed. Nothing was changed."
            exit 1
          fi
          held=no
          condition=""
          unrestricted=no
          while IFS=$'\t' read -r scope definition rule; do
            if [ -z "$scope" ]; then continue; fi
            if [ "${scope,,}" = "${group,,}" ] && [[ "${definition,,}" == */"$administrator" ]]; then held=yes; condition="$rule"; fi
            if [[ "${definition,,}" == */"$owner" || "${definition,,}" == */"$user_access_administrator" ]] && { [ -z "$rule" ] || [ "$rule" = None ]; } \
              && { [ "${scope,,}" = "${group,,}" ] || [[ "${group,,}" == "${scope,,}"/* ]] || [ "$scope" = "/" ] || [[ "${scope,,}" == /providers/microsoft.management/managementgroups/* ]]; }; then
              unrestricted=yes
            fi
          done <<< "$listed"
          if [ "$unrestricted" = yes ]; then
            echo "The identity holds Owner or User Access Administrator on the group or above it, with no condition: it may give any role."
            exit 0
          fi
          if [ "$held" != yes ]; then
            echo "::error::The deploy identity holds no assignment of Role Based Access Control Administrator on the group, and none of Owner or User Access Administrator on the group or above it, so the roles of the AI Gateway cannot be given. Nothing was changed."
            exit 1
          fi
          if [ -z "$condition" ] || [ "$condition" = "None" ]; then
            echo "The deploy identity's right to assign roles has no condition: it may give any role."
            exit 0
          fi
          lists=$(grep -Eio 'GuidEquals *\{[^}]*\}' <<< "$condition" || true)
          total=$(grep -c . <<< "$lists" || true)
          for entry in "$foundry_user:Foundry User" "$models_user:AI Gateway Models User"; do
            id="${entry%%:*}"
            name="${entry#*:}"
            holding=$(grep -ic "$id" <<< "$lists" || true)
            if [ "$total" -lt 1 ] || [ "$holding" -ne "$total" ]; then
              echo "::error::The condition of the deploy identity's right to assign roles does not list $name ($id) for a write and for a delete. The template of the AI Gateway gives that role, and Azure would refuse it after the gateway was made. A person adds the id once, with their own sign-in, on the owner's written word (environment/BOOTSTRAP.md, the section on the AI Gateway). Nothing was changed."
              exit 1
            fi
          done
          echo "The condition of the deploy identity's right to assign roles lists Foundry User and AI Gateway Models User, for a write and for a delete."

      - name: Make the AI Gateway's subnet
        if: inputs.action == 'aigateway'
        env:
          AIGW_SUBNET_EXISTS: ${{ steps.network.outputs.aigw_subnet_exists }}
        run: |
          # The subnet is made first, and alone (environment/aigateway/subnet.bicep: delegated to Microsoft.App/environments, with a network security group of its own), and the gateway only after the landing zone's route table is on it
          # (the steps below). The landing zone's network manager writes to a new subnet some minutes after it is made, the service takes the subnet when the gateway is made and treats it as read-only afterwards, and a failed
          # creation of the gateway may keep the subnet for a long time, so the first creation of the gateway must not race with the network manager: it sees the subnet as the landing zone leaves it (docs/proposals/08-ai-gateway.md).
          # The subnet is made once and never undone (AGENTS.md rule 27): the network step read from Azure whether it is there, and when it is, it is left alone, with everything that the landing zone added to it.
          if [ "$AIGW_SUBNET_EXISTS" = true ]; then
            echo "The subnet snet-aigw is in Azure already: it is left alone, with everything that the landing zone added to it (AGENTS.md rule 27)."
            exit 0
          fi
          name=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/aigateway/subnet.bicep --parameters "$RUNNER_TEMP/aigateway-subnet.parameters.json" \
            --name "aigateway-subnet-$GITHUB_RUN_ID" --output subnetName)
          if [ "$name" != snet-aigw ]; then
            echo "::error::The deployment made the subnet $name, not snet-aigw, which is the name that the gateway's template and the read-back use. The gateway was not made."
            exit 1
          fi
          echo "The subnet $name is in resource group $ENV_RESOURCE_GROUP. The gateway is made after the landing zone's route table is on it."

      - name: Wait until the landing zone has put its route table on the AI Gateway's subnet
        if: inputs.action == 'aigateway'
        timeout-minutes: 25
        run: |
          # The landing zone's network manager puts a route table on a new subnet some minutes after the subnet is made (70 seconds the first time, five minutes the second: CHANGELOG.md, 2026-11-05). The gateway is not made yet:
          # it is made on the subnet as the landing zone leaves it, and not while the network manager is still writing to the subnet, because the service takes the subnet when the gateway is made and treats it as read-only
          # afterwards. The gateway also reaches the Foundry resource, and the landing zone's DNS, through that subnet. The endpoint subnet is the yardstick: when it carries no table, the landing zone puts none on this network
          # and there is nothing to wait for. The table that it added is said by its name. This step needs no credential that it has not used already, so the sign-in of the first step is enough; the sign-in after it is renewed
          # before the gateway is made.
          vnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut"
          table_of() {
            az rest --method get --url "https://management.azure.com${vnet}/subnets/${1}?api-version=2025-05-01" --query properties.routeTable.id --output tsv || true
          }
          reference=$(table_of snet-pe)
          if [ -z "$reference" ] || [ "$reference" = "None" ]; then
            echo "The endpoint subnet carries no route table, so the landing zone puts none on this network: there is nothing to wait for."
            exit 0
          fi
          attempts=40
          for attempt in $(seq 1 "$attempts"); do
            table=$(table_of snet-aigw)
            if [ -n "$table" ] && [ "$table" != "None" ]; then
              echo "The landing zone added the route table ${table##*/} to the subnet snet-aigw."
              exit 0
            fi
            echo "snet-aigw carries no route table yet (check $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then sleep 30; fi
          done
          echo "::error::The landing zone's network manager has put a route table on snet-pe and has not put one on snet-aigw in 20 minutes. The gateway was not made, because it is made on the subnet as the landing zone leaves it. Nothing else was changed: run aigateway again later, which repeats only what is missing."
          exit 1

      - name: Sign in to Azure again for the gateway, because the subnet's deploy and the wait for the route table can take up to 25 minutes and the first sign-in's credential lasts five minutes
        if: inputs.action == 'aigateway'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the AI Gateway, its models and aliases, and its roles
        id: aigateway
        if: inputs.action == 'aigateway'
        env:
          EXPECTED_NAME: ${{ steps.params.outputs.aigateway_name }}
        run: |
          # Step 1 of 2 (docs/proposals/08-ai-gateway.md): the gateway and what it holds, and nothing of the agents but the role below. The subnet snet-aigw is not made here: the steps above made it (environment/aigateway/subnet.bicep, delegated to
          # Microsoft.App/environments, with a network security group of its own, and made only while it is not there: AGENTS.md rule 27) and waited until the landing zone had put its route table on it, so that the gateway is made
          # on the subnet as the landing zone leaves it. This template makes the gateway with a system-assigned identity and that subnet as its backend subnet, the Foundry User role for its identity on the Foundry resource,
          # one provider, a model and an alias for each model of environment/models.json with content safety at Medium, and AI Gateway Models User for the Operator's identity (environment/aigateway/main.bicep).
          # The frontend of the service is public and no template can change that; no API key and no private DNS object is made. The limits and the built-in key are handled by the steps below.
          # With the switch AGENTS_VIA_AI_GATEWAY on (step 2, tools/environment-params.py, True since the owner's order of 2026-11-07) the file also carries the object id of the Foundry project's identity, and the template gives that
          # identity AI Gateway Models User on the gateway too (the role that the condition of the deploy identity's right to assign roles lists already). The connection itself is made by the action foundry.
          name=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/aigateway/main.bicep --parameters "$RUNNER_TEMP/aigateway.parameters.json" \
            --name "aigateway-$GITHUB_RUN_ID" --output gatewayName)
          if [ "$name" != "$EXPECTED_NAME" ]; then
            echo "::error::The deployment made the AI Gateway $name, not $EXPECTED_NAME, which is the name that the later steps read back. Nothing else was changed."
            exit 1
          fi
          echo "The AI Gateway $name is in resource group $ENV_RESOURCE_GROUP."

      - name: Sign in to Azure again for the limits, the built-in key and the read-back of the AI Gateway, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'aigateway'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply the gateway-wide limits to the AI Gateway
        if: inputs.action == 'aigateway'
        env:
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
        run: |
          # A token limit, a request rate limit and a cost limit for the day and one for the month, for each caller and across all models (environment/aigateway/policies.json, held by the builder to the models and to
          # the owner's standing limit, AGENTS.md rule 15 (g)). They live in the policies of the gateway's default workspace, which only a PATCH changes, and a PATCH replaces the whole array: the tool reads the array,
          # merges the file into it, writes it only when it differs, and reads it again (tools/aigateway-prep.py).
          python3 tools/aigateway-prep.py policies --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --gateway "$GATEWAY_NAME" \
            --file "$RUNNER_TEMP/aigateway-policies.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete the built-in key of the AI Gateway when the service lets it be deleted
        if: inputs.action == 'aigateway'
        env:
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
        run: |
          # The service makes a key named master on every gateway and has no switch to refuse key authentication. Nothing of this project uses a key (AGENTS.md rule 23), so the key is read, deleted when it is there and
          # read again, by its name alone: no value is read or printed. When the service refuses, the lines say so plainly as a finding that is recorded, and the run goes on: the key then exists and is unused.
          python3 tools/aigateway-prep.py remove-key --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --gateway "$GATEWAY_NAME" --summary "$GITHUB_STEP_SUMMARY"

      - name: Read the AI Gateway back
        if: inputs.action == 'aigateway'
        # Each read of Azure waits two minutes at the most (the tool's --timeout); this limit holds the whole step even when many pages are slow.
        timeout-minutes: 20
        env:
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          VNET_NAME: ${{ steps.params.outputs.vnet_name }}
          SUBNET_NAME: ${{ steps.params.outputs.aigateway_subnet_name }}
          OPERATOR_IDENTITY: ${{ steps.params.outputs.operator_identity_name }}
          PROJECT_PRINCIPAL: ${{ steps.params.outputs.foundry_project_principal }}
          CASES_PRINCIPAL: ${{ steps.params.outputs.cases_app_principal }}
        run: |
          # A deployment that says Succeeded does not say that the gateway came out as the template wrote it. The run fails unless the gateway is Succeeded, its backend subnet is the one of the template and is delegated,
          # it has a system-assigned identity, the provider, every model (with content safety at Medium), every alias and every limit are as written, the Operator's identity holds AI Gateway Models User on the gateway,
          # the cases app's identity holds it too (when the app has an identity: the settings step read it from the app), the gateway's identity holds Foundry User on the Foundry resource, and no API key but the built-in one exists. publicNetworkAccess is printed as the service reports it and is not judged: the frontend is
          # public, because the service has no private one. Only GET requests; the names of the API keys are read, never a value.
          # With the switch AGENTS_VIA_AI_GATEWAY on (tools/environment-params.py, True since the owner's order of 2026-11-07), the settings step has read the object id of the Foundry project's identity, and the read-back also
          # fails unless that identity holds AI Gateway Models User on the gateway. Off, that part of the call is what it was.
          project=()
          if [ -n "$PROJECT_PRINCIPAL" ]; then project=(--project-principal "$PROJECT_PRINCIPAL"); fi
          cases=()
          if [ -n "$CASES_PRINCIPAL" ]; then cases=(--cases-principal "$CASES_PRINCIPAL"); fi
          python3 tools/aigateway-prep.py read-back --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --gateway "$GATEWAY_NAME" --vnet "$VNET_NAME" --subnet "$SUBNET_NAME" \
            --foundry-account "$FOUNDRY_ACCOUNT" --operator-identity "$OPERATOR_IDENTITY" --models environment/models.json --policies "$RUNNER_TEMP/aigateway-policies.json" --summary "$GITHUB_STEP_SUMMARY" "${project[@]}" "${cases[@]}"

      - name: Find the Operator, which runs the AI Gateway check from inside the network
        id: aigw_operator
        if: inputs.action == 'aigateway-check'
        run: |
          # The check calls the gateway with the Operator's own token, from inside the network, as the identity that holds AI Gateway Models User on the gateway (the template gives it that role). So the Operator has to be there
          # first, and the gateway after it. It is found by its name, as the other checks find it, and nothing is changed here.
          subnet_id="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          client=""
          if grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            client=$(az rest --method get --url "https://management.azure.com${identity_id}?api-version=2023-01-31" --query properties.clientId --output tsv || true)
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$client"; then
            echo "::error::The identity id-meternaut-operator is not there. The action $ACTION runs its check in the Operator, so run operator first (the order is foundry and cases, operator, aigateway). Nothing was changed."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          if found=$(az rest --method get --url "https://management.azure.com${subnet_id}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
            echo "::error::The subnet snet-ops is not there. The action $ACTION runs its check in the Operator, so run operator first (the order is foundry and cases, operator, aigateway). Nothing was changed."
            exit 1
          else
            echo "::error::The subnet snet-ops could not be read: $found"
            exit 1
          fi
          echo "The Operator's identity and its subnet are there."
          {
            echo "identity_id=$identity_id"
            echo "client_id=$client"
            echo "subnet_id=$subnet_id"
          } >> "$GITHUB_OUTPUT"

      - name: Read the host name of the AI Gateway from the service
        id: aigw_host
        if: inputs.action == 'aigateway-check'
        env:
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
        run: |
          # The host name is read from the service (properties.frontend.defaultHostname) and never made up: the check sends a token to it, and the tool refuses a host that is not under .ai.gateway.azure.com.
          gateway="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.ApiManagement/aigateways/$GATEWAY_NAME"
          if ! host=$(az rest --method get --url "https://management.azure.com${gateway}?api-version=2025-09-01-preview" --query properties.frontend.defaultHostname --output tsv 2>&1); then
            if grep -Eqi 'NotFound|\b404\b' <<< "$host"; then
              echo "::error::The AI Gateway $GATEWAY_NAME is not there. Run aigateway first (after foundry and operator). Nothing was changed."
            else
              echo "::error::The AI Gateway $GATEWAY_NAME could not be read: $host"
            fi
            exit 1
          fi
          if ! grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.ai\.gateway\.azure\.com$' <<< "$host"; then
            echo "::error::The service did not report a host name under .ai.gateway.azure.com for the gateway $GATEWAY_NAME (it may be still starting). Nothing was changed."
            exit 1
          fi
          printf '::add-mask::%s\n' "$host"
          echo "The service reports the host name of the gateway $GATEWAY_NAME."
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Run the AI Gateway check in the Operator
        id: aigw_check
        if: inputs.action == 'aigateway-check'
        # The check makes a handful of requests and the group is given 15 minutes (900 seconds); the tool deletes the group at the end of every run, and the limit of the step is a second line behind that.
        timeout-minutes: 25
        env:
          ALIASES: ${{ steps.params.outputs.aigateway_aliases }}
          GATEWAY_HOST: ${{ steps.aigw_host.outputs.host }}
          OPERATOR_IDENTITY_ID: ${{ steps.aigw_operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.aigw_operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.aigw_operator.outputs.subnet_id }}
        run: |
          # tools/aigateway-check.py runs inside the network, in a container group of the Operator. The container gets the tool in its secret volume, signs in with the Operator's own identity (no key: it holds AI Gateway
          # Models User on the gateway), asks for a token for the gateway, and sends one small chat completion to each alias, then one request with no token and one with an alias that does not exist. It prints
          # statuses and usage numbers only. operator/run-tool.sh runs the tool and gives its exit code, and the container is told that it is in a GitHub Actions run, which it is (tools/operator-run.py refuses anywhere
          # else). A role that was given a few minutes ago may not have applied yet (up to ten minutes): the tool then says so.
          args="run --host $GATEWAY_HOST"
          for alias in $ALIASES; do args="$args --alias $alias"; done
          # A container group does not take the DNS servers of the virtual network, so it is given the landing zone's.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-aigw-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "aigateway-check.py=tools/aigateway-check.py" \
            --env "GITHUB_ACTIONS=true" --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=aigateway-check" --env "TOOL_ARGS=$args" \
            "${dns[@]}" --timeout-seconds 900 --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete any container group of the AI Gateway check that is left
        if: always() && inputs.action == 'aigateway-check' && steps.aigw_check.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line, and it runs whenever the check step started: every group that starts with
          # op-aigw- and carries the tool's tag is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-aigw- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-aigw- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: The base, the Foundry resource and the rights that the AI security needs are there
        if: inputs.action == 'governance'
        env:
          DEPLOYER_ID: ${{ steps.me.outputs.oid }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
        run: |
          # Everything that can be known before anything is changed is read here, so that the AI security is not made half and then left: a right or a resource provider that is not there stops the run now, with the right, the person
          # who gives it and the place (environment/BOOTSTRAP.md, the section on the AI security). This step only reads. The identities of the access list were looked for by the step that worked out the settings, which stops by
          # name when one is not there (the cases app's identity is made by cases, the Foundry project's by foundry, the Operator's by operator).
          for provider in Microsoft.Authorization Microsoft.Insights Microsoft.OperationalInsights Microsoft.PolicyInsights; do
            if ! state=$(az provider show --namespace "$provider" --query registrationState --output tsv 2>&1); then
              echo "::error::The registration of the resource provider $provider could not be read: $state. Nothing was changed."
              exit 1
            fi
            if [ "$state" != "Registered" ]; then
              echo "::error::The resource provider $provider is ${state:-not registered} in the subscription, and the AI security needs it. A person who may register a resource provider in the subscription (Contributor or Owner there) registers it once, with their own sign-in: environment/BOOTSTRAP.md, the section on the AI security,                             step G2 (az provider register --namespace $provider). The deploy identity holds no right on the subscription, so it cannot. Nothing was changed."
              exit 1
            fi
          done
          echo "The resource providers of the AI security are registered."
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.OperationalInsights/workspaces --query "[?name=='log-meternaut'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The workspace log-meternaut is not in $ENV_RESOURCE_GROUP. Run base first: the alert rules read it and the workbook is made on it. Nothing was changed."
            exit 1
          fi
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.CognitiveServices/accounts --query "[?name=='$FOUNDRY_ACCOUNT'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The Foundry resource $FOUNDRY_ACCOUNT of the agents is not in $ENV_RESOURCE_GROUP. Run foundry first: the policy is about its model deployments. Nothing was changed."
            exit 1
          fi
          echo "The workspace and the Foundry resource are there."
          # The deploy identity writes a policy assignment only with a role that holds Microsoft.Authorization/policyAssignments/write: Resource Policy Contributor, or Owner. Contributor cannot, and the deploy identity holds Contributor
          # and a limited right to assign roles, so a person gives it the role once. It is looked for on the group and above it. An assignment that Azure would refuse after the alert rules were made is found here.
          resource_policy_contributor=36243c78-bf99-498c-9df9-86d9f8d28608
          owner=8e3af657-a8ff-443c-a75c-2fe8c4bcb635
          group="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP"
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$DEPLOYER_ID"; then
            echo "::error::The object id of the deploy identity was not read from its token, so its right to write a policy assignment cannot be looked at. Nothing was changed."
            exit 1
          fi
          deployer="${DEPLOYER_ID,,}"
          if ! listed=$(az role assignment list --assignee-object-id "$deployer" --scope "$group" --include-inherited --fill-principal-name false --fill-role-definition-name false \
            --query "[].[scope, roleDefinitionId]" --output tsv --only-show-errors 2>&1); then
            echo "::error::The role assignments of the deploy identity on the group could not be read: $listed. Nothing was changed."
            exit 1
          fi
          held=no
          while IFS=$'\t' read -r scope definition; do
            if [ -z "$scope" ]; then continue; fi
            if [ "${group,,}" != "${scope,,}" ] && [[ "${group,,}" != "${scope,,}"/* ]] && [ "$scope" != "/" ] && [[ "${scope,,}" != /providers/microsoft.management/managementgroups/* ]]; then continue; fi
            if [[ "${definition,,}" == */"$resource_policy_contributor" || "${definition,,}" == */"$owner" ]]; then held=yes; fi
          done <<< "$listed"
          if [ "$held" != yes ]; then
            echo "::error::The deploy identity holds no role that can write a policy assignment on the group (Resource Policy Contributor, or Owner): Contributor cannot, and the policy of the AI security is an assignment. A person who may assign roles on the group (Owner or User Access Administrator there) gives it Resource Policy Contributor once, with their own sign-in: environment/BOOTSTRAP.md, the section on the AI security, step G1 (tools/governance-setup.py grant). Nothing was changed."
            exit 1
          fi
          echo "The deploy identity holds a role on the group that can write a policy assignment."

      - name: Deploy the policy, the alert rules and the workbook of the AI security
        id: governance
        if: inputs.action == 'governance'
        run: |
          # Azure Policy at the project's resource group (the built-in policies for approved models and for model eligibility, at the effect Audit or Deny that tools/environment-params.py says; no exemption, no identity, no remediation),
          # the action group that mails ENV_ALERT_EMAILS, one alert rule for each signal, the workbook Meternaut AI security, the retention of the AI Gateway's two telemetry tables, and the Foundry resource's diagnostic setting
          # only where the landing zone has made none (environment/governance/main.bicep). Nothing is deleted, and nothing outside the project's group is touched.
          name=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/governance/main.bicep --parameters "$RUNNER_TEMP/aisec/governance.parameters.json" \
            --name "governance-$GITHUB_RUN_ID" --output actionGroupName)
          if [ "$name" != "ag-meternaut-ai-security" ]; then
            echo "::error::The deployment returned the action group $name, not ag-meternaut-ai-security."
            exit 1
          fi
          echo "The action group $name is in resource group $ENV_RESOURCE_GROUP."

      - name: Sign in to Azure again for the read-back of the AI security, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'governance'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the AI security back from Azure
        if: inputs.action == 'governance'
        timeout-minutes: 20
        run: |
          # A deployment that says Succeeded does not say that the policy, the alert rules and the workbook came out as the template wrote them (AGENTS.md rule 19). The run fails unless the two assignments of the AI security are on
          # the group with the effects of tools/environment-params.py and enforced, every alert rule is on and tells the owner by e-mail, the workbook is there, and a diagnostic setting sends the Foundry resource's logs to a workspace.
          # The policy exemptions are judged against what the owner accepted (the secret DRIFT_ACCEPTED_EXEMPTIONS): unset, the line says UNKNOWN and prints what it found. Only GET requests (tools/drift-check.py).
          flags=()
          if [ -n "${DRIFT_ACCEPTED_EXEMPTIONS:-}" ]; then flags+=(--accepted-exemptions "$DRIFT_ACCEPTED_EXEMPTIONS"); fi
          python3 tools/drift-check.py --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --models environment/models.json --policies environment/aigateway/policies.json \
            --access-list environment/aigateway/contracts.json --only I-policy-assignments,I-alerts,I-diagnostics --summary "$GITHUB_STEP_SUMMARY" "${flags[@]}"

      - name: The AI Gateway is there, the provider is registered, the component reports its endpoints and the gateway's identity may send to them
        if: inputs.action == 'gateway-telemetry'
        env:
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
          INSIGHTS_NAME: ${{ steps.params.outputs.appinsights_name }}
        run: |
          # The exporter has three prerequisites that nothing here can make (environment/aigateway/telemetry.bicep says why). Each is read before anything is changed, so that the exporter is not made and then left to send into
          # nothing: the AI Gateway is there with an identity of its own; the resource provider Microsoft.Monitor is registered (a person registers it, step G2); the component reports its OpenTelemetry endpoints (the action base
          # turns the ingestion on, and the platform makes the endpoints a few minutes later); and the gateway's identity holds Monitoring Metrics Publisher on the component's data collection rule (a person gives it, step G3,
          # because the rule is in a resource group that the platform manages). This step only reads.
          group="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP"
          gateway="$group/providers/Microsoft.ApiManagement/aigateways/$GATEWAY_NAME"
          if ! principal=$(az rest --method get --url "https://management.azure.com${gateway}?api-version=2025-09-01-preview" --query identity.principalId --output tsv 2>&1); then
            if grep -Eqi 'NotFound|\b404\b' <<< "$principal"; then
              echo "::error::The AI Gateway $GATEWAY_NAME is not there. Run aigateway first: the exporter is a child of the gateway. Nothing was changed."
            else
              echo "::error::The AI Gateway $GATEWAY_NAME could not be read: $principal"
            fi
            exit 1
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$principal"; then
            echo "::error::The AI Gateway $GATEWAY_NAME has no identity of its own that can be read, and it is the identity that sends the telemetry. Nothing was changed."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$principal" "${principal^^}"
          if ! state=$(az provider show --namespace Microsoft.Monitor --query registrationState --output tsv 2>&1); then
            echo "::error::The registration of the resource provider Microsoft.Monitor could not be read: $state. Nothing was changed."
            exit 1
          fi
          if [ "$state" != "Registered" ]; then
            echo "::error::The resource provider Microsoft.Monitor is ${state:-not registered} in the subscription, and the telemetry goes to a managed Azure Monitor workspace that needs it. A person who may register a resource provider in the subscription (Contributor or Owner there) registers it once, with their own sign-in: environment/BOOTSTRAP.md, the section on the AI security, step G2 (az provider register --namespace Microsoft.Monitor). The deploy identity holds no right on the subscription. Nothing was changed."
            exit 1
          fi
          echo "The AI Gateway is there with an identity, and the resource provider Microsoft.Monitor is registered."
          component="$group/providers/Microsoft.Insights/components/$INSIGHTS_NAME"
          if ! answer=$(az rest --method get --url "https://management.azure.com${component}?api-version=2020-02-02" \
            --query 'join(`" "`, [to_string(properties.OTLPLogsEndpoint), to_string(properties.OTLPTracesEndpoint), to_string(properties.OTLPMetricsEndpoint), to_string(properties.DataCollectionRuleResourceId)])' --output tsv 2>&1); then
            echo "::error::The Application Insights component $INSIGHTS_NAME could not be read: $answer"
            exit 1
          fi
          read -r logs traces metrics rule <<< "$answer"
          for endpoint in "$logs" "$traces" "$metrics"; do
            if ! grep -Eq '^https://' <<< "$endpoint"; then
              echo "::error::The component $INSIGHTS_NAME reports no OpenTelemetry endpoint yet. The action base turns its OpenTelemetry ingestion on (while GATEWAY_TELEMETRY in tools/environment-params.py is True), and the platform makes the endpoints a few minutes later: run base, wait ten minutes, and run $ACTION again. Nothing was changed."
              exit 1
            fi
          done
          echo "The component reports its three OpenTelemetry endpoints."
          # The data collection rule is in a resource group that the platform manages, behind a deny assignment, so the role cannot be given by a template or by the deploy identity: a person gives it. A role that is missing would make
          # the exporter send into a refusal, with no word from the service, so it is looked for here when it can be read, and the read-back after the deploy says whether the telemetry arrives.
          monitoring_metrics_publisher=3913510d-42f4-4e42-8a64-420c390055eb
          if ! grep -Eq '^/subscriptions/.+/providers/Microsoft\.Insights/dataCollectionRules/.+$' <<< "$rule"; then
            echo "::warning::The component does not report its data collection rule, so the role of the gateway's identity on it cannot be looked at here. The read-back after the deploy says whether the telemetry reaches the workspace; if it does not, give the role (environment/BOOTSTRAP.md, step G3)."
          elif ! held=$(az role assignment list --assignee-object-id "${principal,,}" --scope "$rule" --fill-principal-name false --fill-role-definition-name false --query "[].roleDefinitionId" --output tsv --only-show-errors 2>&1); then
            echo "::warning::The role assignments on the data collection rule could not be read ($held), so the role of the gateway's identity cannot be looked at here. If the telemetry does not arrive, give the role (environment/BOOTSTRAP.md, step G3)."
          elif ! grep -qi "/$monitoring_metrics_publisher\$" <<< "$held"; then
            echo "::error::The AI Gateway's identity does not hold Monitoring Metrics Publisher on the data collection rule of the component. The rule is in a resource group that the platform manages, behind a deny assignment and outside the project's group: the deploy identity holds no right there, and no template can give the role. A person who holds a role assignment right on that rule gives it once, with their own sign-in: environment/BOOTSTRAP.md, the section on the AI security, step G3 (tools/governance-setup.py grant). A role takes up to ten minutes to apply. Nothing was changed."
            exit 1
          else
            echo "The AI Gateway's identity holds Monitoring Metrics Publisher on the data collection rule."
          fi

      - name: Deploy the telemetry exporter of the AI Gateway
        id: telemetry
        if: inputs.action == 'gateway-telemetry'
        run: |
          # One exporter on the gateway's default workspace, with the three OpenTelemetry endpoints of the component, the gateway's own identity and no key, and payloadCapture false (environment/aigateway/telemetry.bicep).
          # A template of its own, so that it can never stop the gateway, its models or its roles.
          name=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/aigateway/telemetry.bicep --parameters "$RUNNER_TEMP/aisec/gateway-telemetry.parameters.json" \
            --name "gateway-telemetry-$GITHUB_RUN_ID" --output exporterName)
          if [ "$name" != "appinsights" ]; then
            echo "::error::The deployment returned the exporter $name, not appinsights."
            exit 1
          fi
          echo "The exporter $name is on the AI Gateway."

      - name: Sign in to Azure again for the read-back of the telemetry exporter, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'gateway-telemetry'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the telemetry exporter back from Azure
        if: inputs.action == 'gateway-telemetry'
        timeout-minutes: 20
        run: |
          # The run fails unless the exporter says that it sends logs, traces and metrics to the project's component with the gateway's own identity and no key, and that payloadCapture is false (no prompt and no answer
          # is sent). Whether records arrive is seen in the workbook Meternaut AI security a few minutes after the first call of the gateway: a new role takes up to ten minutes to apply. Only GET requests.
          python3 tools/drift-check.py --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --models environment/models.json --policies environment/aigateway/policies.json \
            --access-list environment/aigateway/contracts.json --only I-telemetry --summary "$GITHUB_STEP_SUMMARY"

      - name: Check for drift from the control plane, with reads only
        id: drift
        if: inputs.action == 'drift-check'
        timeout-minutes: 30
        env:
          CASES_PUBLIC_ACCESS: ${{ steps.params.outputs.cases_public_network_access }}
        run: |
          # The control-plane half of the drift check of the AI security (tools/drift-check.py; docs/design/07-safeguards-and-drift.md: the check never rests on an app that it watches). It reads Azure Resource Manager with the
          # deploy identity, and nothing else: GET requests, and the two queries that need a POST (Azure Resource Graph for the policy compliance, and Application Insights for the lines that the app's own check logged). It says PASS,
          # FAIL or UNKNOWN for each control, and UNKNOWN is never PASS. The in-app half (the agents' definitions, tools and instructions, which only the Foundry project's private data plane shows) is the app's own daily check
          # (drift-daily, cases/drift.py): this tool reads the lines that it logs, so an app that has gone silent is a FAIL here (I-heartbeat), and a control that the app says has failed is a FAIL here (I-inapp-results).
          # The run fails when a control fails, and the summary says which of them are fail-closed (the agents run outside what was designed): then a person switches the investigation off until the cause is fixed.
          # The policy exemptions and the non-compliant Deny policies are judged against what the owner accepted (the secrets DRIFT_ACCEPTED_EXEMPTIONS and DRIFT_ACCEPTED_DENY): unset, those lines say UNKNOWN and
          # print what they found, so that he can accept it. The release that the cases app runs is compared with this commit of main, by its tags and by the digest of the app's own files.
          # HOOK, the in-network half: the live agents of the Foundry project (their definitions, tools and instructions against environment/agents.lock.json) can only be read from inside the network, because the project's
          # data plane is private. The change of the agent harness brings tools/agents-drift.py for that, and adds one step for this action right after this one, run by the Operator the way the check actions are
          # (operator/run-tool.sh). It writes the same report shape ({control, layer, state, detail, readAt}, ids with the prefix A-) and nothing here waits for it.
          flags=()
          if [ -n "${DRIFT_ACCEPTED_EXEMPTIONS:-}" ]; then flags+=(--accepted-exemptions "$DRIFT_ACCEPTED_EXEMPTIONS"); fi
          if [ -n "${DRIFT_ACCEPTED_DENY:-}" ]; then flags+=(--accepted-deny "$DRIFT_ACCEPTED_DENY"); fi
          python3 tools/drift-check.py --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --models environment/models.json --policies environment/aigateway/policies.json \
            --access-list environment/aigateway/contracts.json --commit "$GITHUB_SHA" --app-dir src/case-functions --cases-public-access "$CASES_PUBLIC_ACCESS" \
            --json "$RUNNER_TEMP/drift.json" --summary "$GITHUB_STEP_SUMMARY" "${flags[@]}"

      - name: Find the Operator, which runs the AI security checks from inside the network
        id: aisec_operator
        if: inputs.action == 'agents-drift' || inputs.action == 'foundry-evals' || inputs.action == 'foundry-redteam' || inputs.action == 'agent365-check'
        run: |
          # The tools of the AI security run inside the network, in a container group of the Operator, because the Foundry project's data plane has no public access. They sign in as the Operator's own
          # identity (no key). The Operator has to be there first, and it is found by its name, as the other checks find it. Nothing is changed here.
          subnet_id="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/snet-ops"
          identity_id=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --name id-meternaut-operator --query "[0].id" --output tsv || true)
          client=""
          if grep -Eq '^/subscriptions/' <<< "$identity_id"; then
            client=$(az rest --method get --url "https://management.azure.com${identity_id}?api-version=2023-01-31" --query properties.clientId --output tsv || true)
          fi
          if ! grep -Eq '^[0-9a-fA-F-]{36}$' <<< "$client"; then
            echo "::error::The identity id-meternaut-operator is not there. The action $ACTION runs its tool in the Operator, so run operator first. Nothing was changed."
            exit 1
          fi
          printf '::add-mask::%s\n::add-mask::%s\n' "$client" "${client^^}"
          if found=$(az rest --method get --url "https://management.azure.com${subnet_id}?api-version=2025-05-01" --query name --output tsv 2>&1); then
            :
          elif grep -Eqi 'NotFound|\b404\b' <<< "$found"; then
            echo "::error::The subnet snet-ops is not there. The action $ACTION runs its tool in the Operator, so run operator first. Nothing was changed."
            exit 1
          else
            echo "::error::The subnet snet-ops could not be read: $found"
            exit 1
          fi
          echo "The Operator's identity and its subnet are there."
          {
            echo "identity_id=$identity_id"
            echo "client_id=$client"
            echo "subnet_id=$subnet_id"
          } >> "$GITHUB_OUTPUT"

      - name: Read the host name of the AI Gateway from the service, for the drift check
        id: aisec_host
        if: inputs.action == 'agents-drift'
        env:
          GATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
        run: |
          # The drift check holds the project's connection to the gateway against the host name that the service reports (properties.frontend.defaultHostname), never one that is made up.
          gateway="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.ApiManagement/aigateways/$GATEWAY_NAME"
          if ! host=$(az rest --method get --url "https://management.azure.com${gateway}?api-version=2025-09-01-preview" --query properties.frontend.defaultHostname --output tsv 2>&1); then
            if grep -Eqi 'NotFound|\b404\b' <<< "$host"; then
              echo "::error::The AI Gateway $GATEWAY_NAME is not there. Run aigateway first. Nothing was changed."
            else
              echo "::error::The AI Gateway $GATEWAY_NAME could not be read: $host"
            fi
            exit 1
          fi
          if ! grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.ai\.gateway\.azure\.com$' <<< "$host"; then
            echo "::error::The service did not report a host name under .ai.gateway.azure.com for the gateway $GATEWAY_NAME. Nothing was changed."
            exit 1
          fi
          printf '::add-mask::%s\n' "$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Run the drift check of the agents in the Operator
        id: aisec_drift
        if: inputs.action == 'agents-drift'
        # The tool makes about ten GET calls and the group is given 15 minutes (900 seconds); the tool deletes the group at the end of every run, and the limit of the step is a second line behind that.
        timeout-minutes: 25
        env:
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.foundry_project_endpoint }}
          GATEWAY_HOST: ${{ steps.aisec_host.outputs.host }}
          OPERATOR_IDENTITY_ID: ${{ steps.aisec_operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.aisec_operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.aisec_operator.outputs.subnet_id }}
        run: |
          # tools/agents-drift.py reads the Foundry project (the list of agents, each locked agent, the list of connections: GET only) as the Operator, and judges what it reads by the rules of the app's own drift
          # check (cases/drift_rules.py), against agents.lock.json. It prints one line for each control in the report shape of every drift check, and exits 1 when a control failed. The files of the app that it
          # uses ride in the secret volume next to it (the volume is flat: the tool finds them in its own folder).
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-aisec-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "agents-drift.py=tools/agents-drift.py" --secret-file "aisec-helpers.py=tools/aisec-helpers.py" \
            --secret-file "lockfile.py=src/case-functions/cases/lockfile.py" --secret-file "plaintext.py=src/case-functions/cases/plaintext.py" \
            --secret-file "drift_rules.py=src/case-functions/cases/drift_rules.py" --secret-file "agents.lock.json=src/case-functions/cases/agents.lock.json" \
            --env "GITHUB_ACTIONS=true" --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=agents-drift" --env "TOOL_ARGS=run --endpoint $FOUNDRY_ENDPOINT --gateway-host $GATEWAY_HOST" \
            "${dns[@]}" --timeout-seconds 900 --summary "$GITHUB_STEP_SUMMARY"

      - name: Run the evaluations of the Investigator in the Operator
        id: aisec_evals
        if: inputs.action == 'foundry-evals'
        # The replay makes up to 12 responses for each of 28 cases, then the evaluation runs wait up to 15 minutes each; the tool stops itself at the seconds of evaluation/limits.json (3,300). The group is given
        # 60 minutes (3600 seconds, the most that tools/operator-run.py allows); the tool deletes the group at the end of every run, and the limit of the step is a second line behind that.
        timeout-minutes: 75
        env:
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.foundry_project_endpoint }}
          EVALS_COMMAND: ${{ inputs.evals_command }}
          EVALS_JUDGE: ${{ inputs.evals_judge }}
          OPERATOR_IDENTITY_ID: ${{ steps.aisec_operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.aisec_operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.aisec_operator.outputs.subnet_id }}
        run: |
          # tools/foundry-evals.py: probe reads, run replays the invented cases through the Investigator (every model call goes through the AI Gateway: the replayed agent's model is the project's connection, a judge is the
          # connection too, never a deployment) and sends the interactions to Foundry as an evaluation run, rule and rule-apply print or make the continuous evaluation rule. The spend cap is evaluation/limits.json,
          # in the secret volume next to the tool, and the tool prints how many calls of a model it counted, so that the number can be held against the gateway's own telemetry. A run that the project does not finish
          # is printed as UNKNOWN, not as a pass.
          case "$EVALS_COMMAND" in
            probe) args="probe --endpoint $FOUNDRY_ENDPOINT" ;;
            run) args="run --endpoint $FOUNDRY_ENDPOINT --judge $EVALS_JUDGE --wait-seconds 900" ;;
            rule) args="rule --endpoint $FOUNDRY_ENDPOINT" ;;
            rule-apply) args="rule --endpoint $FOUNDRY_ENDPOINT --apply" ;;
            *)
              echo "::error::evals_command is probe, run, rule or rule-apply. Nothing was changed."
              exit 1
              ;;
          esac
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-aisec-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "foundry-evals.py=tools/foundry-evals.py" --secret-file "aisec-helpers.py=tools/aisec-helpers.py" \
            --secret-file "lockfile.py=src/case-functions/cases/lockfile.py" --secret-file "plaintext.py=src/case-functions/cases/plaintext.py" \
            --secret-file "drift_rules.py=src/case-functions/cases/drift_rules.py" --secret-file "agents.lock.json=src/case-functions/cases/agents.lock.json" \
            --secret-file "cases.jsonl=evaluation/cases.jsonl" --secret-file "thresholds.json=evaluation/thresholds.json" --secret-file "limits.json=evaluation/limits.json" \
            --env "GITHUB_ACTIONS=true" --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=foundry-evals" --env "TOOL_ARGS=$args" \
            "${dns[@]}" --timeout-seconds 3600 --summary "$GITHUB_STEP_SUMMARY"

      - name: Run the red team on a synthetic copy of the Investigator in the Operator
        id: aisec_redteam
        if: inputs.action == 'foundry-redteam'
        # The copy is made, attacked and deleted; the cloud red team waits up to 15 minutes, and the dataset attacks are 20 responses. The group is given 60 minutes (3600 seconds, the most that tools/operator-run.py allows); the tool deletes the copy
        # whatever happened and deletes the group at the end of every run; the limit of the step is a second line behind that.
        timeout-minutes: 75
        env:
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.foundry_project_endpoint }}
          REDTEAM_MODE: ${{ inputs.redteam_mode }}
          OPERATOR_IDENTITY_ID: ${{ steps.aisec_operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.aisec_operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.aisec_operator.outputs.subnet_id }}
        run: |
          # tools/foundry-redteam.py attacks a SYNTHETIC COPY, never the production Investigator: a prompt agent with the locked instructions of the Investigator (evaluation/investigator-instructions.txt, held
          # against the hash in the lock before anything is made), the same model alias through the same AI Gateway connection, no tools, and a name that starts meternaut-redteam-copy-. It deletes the copy at the
          # end, whatever happened, and says if it could not. Every model call is held to evaluation/limits.json and counted.
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-aisec-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "foundry-redteam.py=tools/foundry-redteam.py" --secret-file "aisec-helpers.py=tools/aisec-helpers.py" \
            --secret-file "lockfile.py=src/case-functions/cases/lockfile.py" --secret-file "plaintext.py=src/case-functions/cases/plaintext.py" \
            --secret-file "drift_rules.py=src/case-functions/cases/drift_rules.py" --secret-file "agents.lock.json=src/case-functions/cases/agents.lock.json" \
            --secret-file "thresholds.json=evaluation/thresholds.json" --secret-file "limits.json=evaluation/limits.json" \
            --secret-file "investigator-instructions.txt=evaluation/investigator-instructions.txt" --secret-file "redteam-prompts.jsonl=evaluation/redteam-prompts.jsonl" \
            --env "GITHUB_ACTIONS=true" --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=foundry-redteam" --env "TOOL_ARGS=run --endpoint $FOUNDRY_ENDPOINT --mode $REDTEAM_MODE --wait-seconds 900" \
            "${dns[@]}" --timeout-seconds 3600 --summary "$GITHUB_STEP_SUMMARY"

      - name: Check Agent 365 and Microsoft Entra Agent ID in the Operator
        id: aisec_agent365
        if: inputs.action == 'agent365-check'
        # The check makes about ten GET calls and the group is given 10 minutes (600 seconds).
        timeout-minutes: 20
        env:
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          OPERATOR_IDENTITY_ID: ${{ steps.aisec_operator.outputs.identity_id }}
          OPERATOR_CLIENT_ID: ${{ steps.aisec_operator.outputs.client_id }}
          OPERATOR_SUBNET_ID: ${{ steps.aisec_operator.outputs.subnet_id }}
        run: |
          # tools/agent365-check.py reads Microsoft Graph (the licence, the agent identities, their owners and sponsors) and the Foundry resource's Agent 365 logging flag, and prints what a person has to do
          # for the rest (MANUAL lines with the portal path). It changes nothing. The Graph reads need Graph application roles on the Operator's identity, which nobody has granted yet: until then they print
          # UNKNOWN (HTTP 403), not a pass. The same tool runs in the owner's own session with his sign-in.
          account="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$FOUNDRY_ACCOUNT"
          dns=()
          for server in ${ENV_DNS_SERVERS//,/ }; do dns+=(--dns-server "$server"); done
          python3 tools/operator-run.py run --resource-group "$ENV_RESOURCE_GROUP" --name "op-aisec-$GITHUB_RUN_ID" \
            --subnet-id "$OPERATOR_SUBNET_ID" --identity-id "$OPERATOR_IDENTITY_ID" --image "$OPERATOR_IMAGE" --script operator/run-tool.sh \
            --secret-file "agent365-check.py=tools/agent365-check.py" --secret-file "aisec-helpers.py=tools/aisec-helpers.py" \
            --env "GITHUB_ACTIONS=true" --env "OPERATOR_CLIENT_ID=$OPERATOR_CLIENT_ID" --env "OPERATOR_SUBSCRIPTION=$ENV_SUBSCRIPTION_ID" \
            --env "TOOL_NAME=agent365-check" --env "TOOL_ARGS=run --name-prefix meternaut --account-id $account" \
            "${dns[@]}" --timeout-seconds 600 --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete any container group of the AI security checks that is left
        if: always() && (inputs.action == 'agents-drift' || inputs.action == 'foundry-evals' || inputs.action == 'foundry-redteam' || inputs.action == 'agent365-check') && steps.aisec_operator.outcome != 'skipped'
        run: |
          # The tool deletes its group at the end of every run. A step that was cancelled or killed cannot do that, so this is the second line: every group that starts with op-aisec- and carries the tool's tag
          # is deleted. Runs of this workflow never overlap (the concurrency group), so none of them is a group in use. Nothing else is touched.
          python3 tools/operator-run.py cleanup --resource-group "$ENV_RESOURCE_GROUP" --prefix op-aisec- --older-than-minutes 0 \
            || echo "::warning::A container group whose name starts with op-aisec- may be left in resource group $ENV_RESOURCE_GROUP. A person deletes it; it costs cents an hour."

      - name: Work out the Teams bot's settings
        id: teams_params
        if: inputs.action == 'teams'
        run: |
          # The bot shares what the cases app's parameter file holds (the region, the owner, the storage account of the base, the people and the host name that the web page is opened at), so that the two cannot disagree, and it makes its two own names
          # from the same digest as the cases app's name. The file is checked against the compiled template before Azure is asked. Nothing here reads Azure.
          python3 tools/teams-params.py --cases-params "$RUNNER_TEMP/cases.parameters.json" --out "$RUNNER_TEMP/teams.parameters.json" >> "$GITHUB_OUTPUT"
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/teams.parameters.json" --template "$RUNNER_TEMP/teams.json" --label teams

      - name: The base, the function subnet and the resource provider of the Azure Bot Service are there, which the Teams bot builds on
        if: inputs.action == 'teams'
        env:
          STORAGE_ACCOUNT: ${{ steps.params.outputs.storage_account_name }}
          INSIGHTS_NAME: ${{ steps.params.outputs.appinsights_name }}
          FUNCTION_SUBNET: ${{ steps.params.outputs.function_subnet_name }}
        run: |
          # Reads only, and stops before anything is changed. The bot shares the base's storage account (its host storage, its code package and the loop's tables) and the telemetry component, and it runs in the function subnet that the model side made
          # (several Flex Consumption apps may share one subnet: Learn, "Flex Consumption plan"). The workflow's identity cannot register a resource provider (environment/BOOTSTRAP.md): a person does that once.
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.Storage/storageAccounts --query "[?name=='$STORAGE_ACCOUNT'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The storage account $STORAGE_ACCOUNT is not in $ENV_RESOURCE_GROUP. Run base first: the bot shares it. Nothing was changed."
            exit 1
          fi
          found=$(az resource list --resource-group "$ENV_RESOURCE_GROUP" --resource-type Microsoft.Insights/components --query "[?name=='$INSIGHTS_NAME'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The Application Insights component $INSIGHTS_NAME is not in $ENV_RESOURCE_GROUP. Run base first: the bot sends its telemetry to it. Nothing was changed."
            exit 1
          fi
          subnet="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/vnet-meternaut/subnets/$FUNCTION_SUBNET"
          if ! delegations=$(az rest --method get --url "https://management.azure.com${subnet}?api-version=2025-05-01" --query "properties.delegations[].properties.serviceName" --output tsv 2>&1); then
            echo "::error::The subnet $FUNCTION_SUBNET could not be read, or it is not there (run model-side first): $delegations"
            exit 1
          fi
          if ! grep -Fxq 'Microsoft.App/environments' <<< "$delegations"; then
            echo "::error::The subnet $FUNCTION_SUBNET is delegated to ${delegations:-nothing}, and a Flex Consumption app needs a subnet that is delegated to Microsoft.App/environments. Nothing was changed."
            exit 1
          fi
          echo "The storage account, the Application Insights component and the function subnet are there."
          state=$(az provider show --namespace Microsoft.BotService --query registrationState --output tsv 2>/dev/null || true)
          case "$state" in
            Registered) echo "Microsoft.BotService is registered in the subscription." ;;
            "") echo "::warning::The registration of Microsoft.BotService could not be read. If the Azure Bot resource cannot be made for that reason, a person registers the provider once, with the Azure CLI or in the portal." ;;
            *)
              echo "::error::Microsoft.BotService is $state in the subscription, and the workflow's identity cannot register it. A person does that once, with the Azure CLI or in the portal. Nothing was changed."
              exit 1 ;;
          esac

      - name: Deploy the Teams bot
        id: teams
        if: inputs.action == 'teams'
        run: |
          # The user-assigned identity that is the bot, the Azure Bot resource with its Teams channel (the free tier, no key), a Flex Consumption plan, a function app of its own with two functions, and its roles on the base's storage account
          # (environment/teams/main.bicep). It is the one public endpoint of the project, made only on the owner's written request (the first step of the job after the checkout). No key, no secret, no app registration.
          client=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/teams/main.bicep --parameters "$RUNNER_TEMP/teams.parameters.json" \
            --name "teams-$GITHUB_RUN_ID" --output botClientId)
          if ! printf '%s' "$client" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::The deployment did not return the client id of the bot's identity."
            exit 1
          fi
          echo "bot_client_id=$client" >> "$GITHUB_OUTPUT"
          echo "The Teams bot is deployed. The client id of its identity, which is the bot's app id, is $client."

      - name: Build the Teams bot's package
        if: inputs.action == 'teams'
        run: |
          # The package `cases` with the bot's own entry in place of the cases app's, so that the public app has two functions and none of the cases app's (tools/build-teams-bot.sh). The libraries are the wheels of the hash-locked
          # requirements.txt for Linux and Python 3.13, installed only when they match the hashes.
          bash tools/build-teams-bot.sh "$RUNNER_TEMP/teams-bot" "$RUNNER_TEMP/teams-bot.zip"

      - name: Sign in to Azure again for the publish of the Teams bot, because the first sign-in's credential lasts five minutes
        if: inputs.action == 'teams'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish the code to the Teams bot's function app
        if: inputs.action == 'teams'
        timeout-minutes: 25
        env:
          BOT_APP: ${{ steps.teams_params.outputs.teams_bot_app_name }}
        run: |
          # The bot's app is public, and so is its deployment site, so the runner publishes straight to it with the deploy identity's own sign-in. The command, its flags and its attempts are the ones that the runner used for the cases app on Flex
          # Consumption while that app was public (operator/publish.sh, publish_flex). It has NOT been run for this app: the first run of this action shows whether it goes through, and a site that has just been made may need a minute.
          for attempt in 1 2 3; do
            if message=$(timeout 600 az functionapp deployment source config-zip --resource-group "$ENV_RESOURCE_GROUP" --name "$BOT_APP" --src "$RUNNER_TEMP/teams-bot.zip" --build-remote false --only-show-errors --output none 2>&1); then
              echo "The package is published to $BOT_APP (attempt $attempt of 3)."
              exit 0
            fi
            echo "::warning::The publish did not go through (attempt $attempt of 3): ${message:0:600}"
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error::The code could not be published to $BOT_APP. The app is made and was not given its code: running teams again repeats only what is missing."
          exit 1

      - name: Sign in to Azure again for the read-back of the Teams bot, because the publish can take a quarter of an hour
        if: inputs.action == 'teams'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the Teams bot back from Azure and knock at its door with no token
        if: inputs.action == 'teams'
        timeout-minutes: 30
        env:
          BOT_APP: ${{ steps.teams_params.outputs.teams_bot_app_name }}
          BOT_NAME: ${{ steps.teams_params.outputs.teams_bot_name }}
        run: |
          # A deployment that says Succeeded does not say that the resource came out as the template wrote it (AGENTS.md rule 19), so tools/teams-check.py reads the identity (which holds no role), the Azure Bot resource, its Teams channel, the app and
          # its two functions back with GET requests, and fails for each thing that differs. Then it knocks at the public endpoint with no token: a request with none and a request with a token that is not one must both be refused with 401
          # and an empty body. A Flex Consumption app that has scaled to zero needs a start, so the knocks are tried again for up to five minutes. Nothing is repaired from here.
          host=$(az rest --method get --url "https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$BOT_APP?api-version=2024-04-01" --query properties.defaultHostName --output tsv)
          python3 tools/teams-check.py read-back --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" --app "$BOT_APP" --bot "$BOT_NAME" --identity id-meternaut-teams-bot --wait-seconds 600 --summary "$GITHUB_STEP_SUMMARY"
          python3 tools/teams-check.py door --host "$host" --tries 20 --interval 15 --summary "$GITHUB_STEP_SUMMARY"

      - name: What was done
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          AIGATEWAY_NAME: ${{ steps.params.outputs.aigateway_name }}
          FOUNDRY_ACCOUNT: ${{ steps.params.outputs.foundry_account_name }}
          FOUNDRY_PROJECT: ${{ steps.params.outputs.foundry_project_name }}
          FOUNDRY_ENDPOINT: ${{ steps.params.outputs.foundry_project_endpoint }}
          AGENTS_VIA_AI_GATEWAY: ${{ steps.params.outputs.agents_via_ai_gateway }}
          CONNECTION_NAME: ${{ steps.params.outputs.aigateway_connection_name }}
          CASES_PUBLIC_ACCESS: ${{ steps.params.outputs.cases_public_network_access }}
          CASES_APP_PLAN: ${{ steps.params.outputs.cases_app_plan }}
          GATEWAY_TELEMETRY: ${{ steps.params.outputs.gateway_telemetry }}
          TEAMS_BOT_APP: ${{ steps.teams_params.outputs.teams_bot_app_name }}
          TEAMS_BOT_CLIENT_ID: ${{ steps.teams.outputs.bot_client_id }}
        run: |
          {
            echo "### Hub: $ACTION, $JOB_STATUS"
            echo
            if [ "$JOB_STATUS" != "success" ]; then
              echo "**The run did not finish.** The log shows the step that failed; nothing below is promised."
              case "$ACTION" in
                what-if) echo "A what-if changes nothing." ;;
                model-side) echo "Part of the network may exist now: the virtual network, its subnets and their network security groups, and the budget. Running \`model-side\` again is safe and repeats only what is missing (an existing network is left alone). \`what-if\` shows what is there." ;;
                base) echo "Part of the base may exist now: the Log Analytics workspace, the Application Insights component, the storage account and its private endpoints. They cost money while they exist, the private endpoints most (about 5 euros a month each). Once the template has been deployed the storage account takes no public traffic, so this runner can no longer reach its queue: the Operator does. If the lines above stop at the step that reads the storage account back, Azure did not show the account as private and without a key. If they stop at the wait for the landing zone's policy, the endpoints are made and the lines say which endpoint is not registered yet. Running \`base\` again is safe and repeats only what is missing; \`what-if\` shows what is there." ;;
                retire-old) echo "The run stopped before it had deleted everything on its list, and the lines above say at which item and why (Azure refused, a management lock, or a resource that did not go within fifteen minutes). Nothing after that item was touched. Running \`retire-old\` again is safe: it reads each item first, and goes on with what is still there. If everything on the list was deleted and the lines stop at the function subnet \`snet-func\`, another app still holds it: the line names that app and its plan, the action \`cases\` is refused while that is so, and a person deletes that app or moves it to another subnet. If Azure refused the purge of the old model account, the account is deleted but its name and its quota are not free yet: the line says the one command that a person runs with their own sign-in." ;;
                retire-event-hubs) echo "The run stopped before it had deleted everything on its list, and the lines above say at which item and why (the control queue \`cases-control\` is not there, so nothing was deleted: run \`cases\` and then \`cases-run\` first; or Azure refused, a management lock, or a resource that did not go within fifteen minutes). Nothing after that item was touched. Running \`retire-event-hubs\` again is safe: it reads each item first, and goes on with what is still there." ;;
                foundry) echo "Part of the Foundry resource of the agents may exist now: the resource, its guardrail, its model deployments, the project, the connection for traces, the private endpoint and the two roles. The resource costs next to nothing while no agent runs in it (the private endpoint a few euros a month). Running \`foundry\` again is safe and repeats only what is missing; \`what-if\` shows what is there. The cases app was not changed: run \`cases\` only after a run of \`foundry\` that passed." ;;
                cases) echo "Part of the first cases may exist now: the identities, the plan, the function app, the control queue, the longer retention of the traces and the workbook. They cost next to nothing, except a Basic plan, which costs about 13 US dollars a month once it is there, used or not; a Flex Consumption plan costs nothing while the web page is idle. If the lines above stop at the check of the function subnet, nothing was changed: they say that the subnet is not there (run \`model-side\`), or which other app still holds it (the usage app, which the action \`retire-old\` deletes, with its plan: run that first, and it says when snet-func is free), and the web page's app is still where it was. If they stop at the step that clears what is in the way of the deploy, the lines say which thing was deleted and which was left, one line for each (the app of the other plan kind, its plan, a private endpoint of the app that is Disconnected, role assignments of an identity that is gone), each read back, a gateway time-out of the platform is tried again, and \`cases\` run again repeats only what is missing, whatever the earlier run did. If the deploy failed after the old app was removed, the web page is down until \`cases\` has run again, and the lines say why. If they stop at the wait for the landing zone's policy, the app and its endpoint are made and the app was not given its code: the lines say that the endpoint is not registered yet. If they stop at the step that publishes the code from inside the network, the app and its endpoint are made and the app was not given its code: the lines say that the Operator is not there (run \`operator\`, and then \`cases\` again: on an estate that has none the order is base, cases, operator, and then cases again) or what the container said. If they stop at the step that waits for the app to answer, the app was given its code and did not answer on \`/healthz\` from inside the network, in a container group of the Operator: the lines say which address its name resolved to there (a private one is required) and what each try got. If they stop at the front door, the console's address got something that it should not, or, when the cases app takes no public traffic and no host name is set, so that the check is made from inside the network, in the Operator, the Operator is not there (run \`operator\`, and then \`cases\` again) or the app's name did not resolve to a private address there: the lines say which. Running \`cases\` again is safe and repeats only what is missing; \`what-if\` shows what is there." ;;
                cases-run) echo "The control message may have been put in the queue, and the Watch may have run partly or not at all. The Operator put it there and read the telemetry from inside the network, in a container group named \`op-check-$GITHUB_RUN_ID\` that the last step of the run deletes if the tool could not. The lines above say how it ended, or which warnings and errors the cases app logged. A message that the Operator is not there means that \`operator\` has to be run first. A 401 or 403 when the message is put in the queue means that the Operator's role on the control queue is missing (\`operator\` assigns it) or has not applied yet (a role takes up to ten minutes). A 404 means that the queue is not there (\`cases\` makes it). It changes no resource of the estate; with the investigation on it may also have created agents and conversations in its own Foundry project before it stopped. Running \`cases-run\` again is safe." ;;
                page-latency) echo "A container group named \`op-latency-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. Nothing was changed: the measurement only reads. The lines above say how far it came: that the Operator is not there (run \`operator\` first), that the cases app is not there (run \`cases\` first), that the app's name did not resolve to a private address in the container, or which requests were slow or not answered. On a web page that is on Flex Consumption, a verdict that the rule is not met means that the stall of 2026-11-05 and 2026-11-08 is still there: run \`page-latency\` once more, and if it shows the same, report the numbers to the owner, who decides (he ordered Flex Consumption; CASES_APP_PLAN in tools/environment-params.py goes to Basic only on his word, and then \`cases\` is run; docs/proposals/07-private-by-default.md, the web page on Flex Consumption). Running \`page-latency\` again is safe." ;;
                plant) echo "Part of the planted waste may exist now (an unattached disk, maybe an unassigned public IP address, maybe a virtual machine with its network interface and its OS disk) in resource group \`$ENV_RESOURCE_GROUP\`, tagged for the loop. They cost a few cents to a few dollars a month, and a planted machine about 0.04 US dollars an hour while it runs (nothing for compute once it is stopped and released). Running \`plant\` again is safe: it makes a second planting under a new name. A person who approves a plan for planted waste changes it, with that person's own permissions." ;;
                loop-check) echo "The front door was not shut as it should be: a request without a sign-in got something other than a sign-in or the app's refusal, or, with a console host name set, the sign-in's return address did not name it, or, when the cases app takes no public traffic and no host name is set, so that the check is made from inside the network, in the Operator, the Operator is not there (run \`operator\` first) or the app's name did not resolve to a private address there. Nothing was changed. Do not hand the address to anybody until this passes." ;;
                operator) echo "Part of the Operator may exist now: its identity \`id-meternaut-operator\`, the network security group, the subnet \`snet-ops\`, the Reader role on resource group \`$ENV_RESOURCE_GROUP\` and the Storage Queue Data Contributor role on the control queue. If the lines above say that the control queue is not there, nothing was changed: run \`base\` and \`cases\` first. If the deploy was refused at the Reader role, the condition of the deploy identity's role-assignment right does not list Reader yet (environment/BOOTSTRAP.md, the section on the Operator) and nothing else was changed; Storage Queue Data Contributor is listed already. None of it costs anything while no container group runs. Running \`operator\` again is safe and repeats only what is missing." ;;
                operator-probe) echo "A container group named \`op-probe-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. The lines above say how far the probe came: an image that could not be pulled is the likely reason (the tool prints the group's events then), and a subnet with no way out looks the same. A run costs cents. Running \`operator-probe\` again is safe." ;;
                aigateway) echo "Part of the AI Gateway may exist now: the subnet \`snet-aigw\` with its network security group (made first, and only when it was not there), and then the gateway \`$AIGATEWAY_NAME\` with its own identity, its provider, its models and aliases, and its roles (the Operator's, and the cases app's when the app had an identity). It is a preview service that is free while the preview lasts (the proposal gives the meter and the date), and a subnet costs nothing. The step that failed says why. If the lines stop before the subnet is made, nothing was changed: they say which of the virtual network, the Foundry resource of the agents (run \`foundry\` first), the Operator (run \`operator\` first), the region or the condition of the deploy identity's right to assign roles is missing, and for the condition a person adds AI Gateway Models User once (environment/BOOTSTRAP.md, the section on the AI Gateway). If the subnet's deploy failed, the lines say why (for example that the range is taken) and the gateway was not made. If the lines stop at the wait for the landing zone's route table, the subnet exists and the gateway is not made, because it is made on the subnet as the landing zone leaves it: nothing else was done, and running \`aigateway\` again later leaves the subnet alone and repeats only what is missing. If the deploy of the gateway was refused at a role, the condition does not list that role. If they stop at the limits, the key or the read-back, the gateway is made and the lines say which thing differs: nothing is repaired from here, and the subnet cannot be changed once the gateway is made (the way back is to delete the gateway and make another). The frontend of the gateway is public and cannot be made private. The agents were not changed by this action. Running \`aigateway\` again is safe and repeats only what is missing." ;;
                aigateway-check) echo "A container group named \`op-aigw-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. Nothing of the gateway was changed. The lines above say which request got which status. A message that the Operator is not there means that \`operator\` has to be run first, and one that the gateway is not there means that \`aigateway\` has to be run first. A 401 or 403 for the request with the Operator's token means that its role on the gateway has not applied yet (a role takes up to ten minutes) or is missing (\`aigateway\` gives it), or that the service principal of Microsoft's AI Gateway data plane is not in the tenant: the tool says which of them it looks like, and a person creates the service principal once (environment/BOOTSTRAP.md, the section on the AI Gateway). Running \`aigateway-check\` again is safe." ;;
                agents-drift) echo "The drift check read the Foundry project from inside the network and a control failed, or the project could not be read. The lines above are one for each control: drift.fail names the control and says what differs (the agent, the tool or the connection by its name in the repository, never a text of the project); drift.unknown says why a control could not be told (a read that was refused: the Operator needs Foundry User on the project). Nothing was changed. A container group named \`op-aisec-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. Running \`agents-drift\` again is safe." ;;
                foundry-evals) echo "The evaluations stopped or failed. The lines above say which: a stored Investigator that is not what the lock says (nothing was run), the spend cap of evaluation/limits.json (the number of calls of a model is printed), a code threshold that was missed (PASS or FAIL for each), or a project that did not offer the evaluations API (probe says which route answers). A run of Foundry that never finishes is printed as UNKNOWN: on a Foundry resource without public network access it may need the evaluation networking. The conversations that the tool made are deleted by the tool. A container group named \`op-aisec-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. Running \`foundry-evals\` again is safe." ;;
                foundry-redteam) echo "The red team stopped or failed. The synthetic copy of the Investigator (its name starts with meternaut-redteam-copy-) is deleted by the tool whatever happened: the lines above say that it was, or give its name so that a person deletes it in the portal under Build, Agents. The production agent was never touched. A container group named \`op-aisec-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. Running \`foundry-redteam\` again is safe." ;;
                agent365-check) echo "The check of Agent 365 and Entra Agent ID reported a failure, or could not run. A check that Graph did not answer is UNKNOWN, not a failure: the Operator's identity holds no Graph roles until a tenant administrator grants them. Nothing was changed. A container group named \`op-aisec-$GITHUB_RUN_ID\` may have been made, and the last step of the run deletes it if the tool could not. Running \`agent365-check\` again is safe." ;;
                governance) echo "Part of the AI security may exist now in resource group \`$ENV_RESOURCE_GROUP\`: the policy assignments at the group, the action group, the alert rules, the workbook and the retention of the two telemetry tables. They cost next to nothing (the alert rules are a few euros a month in all: docs/proposals/10-ai-security-and-governance.md has the prices). The step that failed says why. If the lines stop before anything was changed, they say which right, who gives it and where: the deploy identity needs Resource Policy Contributor on the group (a person gives it once: step G1 of environment/BOOTSTRAP.md), a resource provider has to be registered (step G2), or an identity of the access list is not there yet (run \`cases\`, \`foundry\` and \`operator\` first). A policy assignment that Azure refused names the policy. Running \`governance\` again is safe and repeats only what is missing." ;;
                gateway-telemetry) echo "The telemetry exporter may exist now on the AI Gateway. If the lines stop before anything was changed, they say which prerequisite is missing and who makes it: the resource provider Microsoft.Monitor (a person registers it once: step G2 of environment/BOOTSTRAP.md), the OpenTelemetry endpoints of the component (the action \`base\` turns the ingestion on, and the platform makes the endpoints about ten minutes later), or Monitoring Metrics Publisher for the gateway's identity on the component's data collection rule (a person gives it once: step G3, and a role takes up to ten minutes to apply). If the read-back failed, the exporter differs from its template and the line says how: nothing is repaired from here. Running \`gateway-telemetry\` again is safe." ;;
                drift-check) echo "Nothing was changed: the check only reads. At least one control failed, or the check could not run. The summary lists every control as PASS, FAIL or UNKNOWN with what was read, and says which failed controls are fail-closed: for those the agents run outside what was designed, and a person switches the investigation off until the cause is fixed. A control that says UNKNOWN could not be read with the deploy identity's rights, or has no baseline that the owner accepted yet, and is never a PASS. Running \`drift-check\` again is safe." ;;
                teams) echo "Part of the Teams bot may exist now: its identity \`id-meternaut-teams-bot\`, the Azure Bot resource with its Teams channel, the plan and the function app \`$TEAMS_BOT_APP\`, and its roles on the base's storage account. The free tier of the bot and an idle Flex Consumption app cost next to nothing (docs/proposals/13-teams-and-outlook.md has the prices). If the lines above stop before the deploy, nothing was changed: they say what to run first (model-side, base, cases) or that a person registers the resource provider Microsoft.BotService once. If they stop at the publish, the app is made and was not given its code: the command is the one that the cases app was published with while it was public, and it has not been proved for this app, so the first run may show that it needs another way; running \`teams\` again repeats only what is missing. If they stop at the read-back or at the door, the lines say which thing is not as the template says or which request was not refused: nothing is repaired from here, and the endpoint answers every caller until a person looks at it, so read those lines before anything else. Running \`teams\` again is safe." ;;
              esac
            else
              case "$ACTION" in
                what-if) echo "Nothing was changed. Read the lists above: what the next steps would create or change in the project's resource group." ;;
                model-side) echo "The network is in resource group \`$ENV_RESOURCE_GROUP\`: the virtual network and its subnets (made once and then left alone, so the landing zone's route tables stay on them), their network security groups, and the budget. The model account that this action used to make was removed on 2026-11-07 (the action \`retire-old\` deletes it): nothing called it. Nothing of the owner's API Management instance was touched." ;;
                base) echo "The base is in resource group \`$ENV_RESOURCE_GROUP\`: a storage account (public network access Disabled, no Shared Key, its private endpoint connections Approved: read back from Azure) with the containers that every Functions host of the account shares, a Log Analytics workspace and an Application Insights component (no key), and three private endpoints that the landing zone has registered in its central zones: the storage account's. No app, no Cosmos DB account, no Event Hubs namespace and no event hub is made here: the cases app makes its own control queue in the storage account. This runner cannot reach the queue, and the Operator puts the control message in it. The Event Hubs namespace that the base used to make, and the usage recording, are not made any more; the actions \`retire-event-hubs\` and \`retire-old\` delete what is left of them." ;;
                retire-old) echo "What Meternaut does not use any more was deleted in resource group \`$ENV_RESOURCE_GROUP\`, and nothing else: the usage recording (the usage function app, its plan and its private endpoint, the Cosmos DB account and its private endpoint, and the event hubs \`ai-usage\`, \`pii-usage\` and \`usage-control\`) and the old model account (its private endpoint, and then the account, which was purged so that its name and its quota are free) and the identity \`id-meternaut-usage\`. The lines above say for each one whether it was deleted or was not there, and the role assignments that the deleted identities left behind, which are listed and not deleted. The function subnet \`snet-func\` was read back after the deletes: it is free (no app but the cases app and the Teams bot's app is integrated with it), so the action \`cases\` can put the web page's app on it if the app is on Flex Consumption (it is on Basic now, which does not use that subnet); the lines above say so and list the platform's links on the subnet, for information. The Event Hubs namespace (the action \`retire-event-hubs\` deletes it), the storage account, the workspace, Application Insights and every subnet were not touched. What the usage app's identity and the custom role Meternaut usage reader held in the owner's lab subscription is retired by a person, with \`tools/access-requirements.py retire --only W9,W10\` (environment/BOOTSTRAP.md), before this action, because that tool reads the usage app and its identity, which this action deletes. Running \`retire-old\` again is safe: it finds nothing." ;;
                retire-event-hubs) echo "The Event Hubs namespace that carried the control event was deleted in resource group \`$ENV_RESOURCE_GROUP\`, and nothing else: its private endpoint, the namespace (with its hub \`cases-control\` and that hub's consumer group, and whatever else was in it), and the container \`azure-webjobs-eventhub\` of the storage account, which held the namespace's checkpoints. The lines above say for each one whether it was deleted or was not there, and that each was read back until it was gone. The control message goes through the Storage queue \`cases-control\` in the storage account, which this action reads before it deletes anything and does not touch. The base, the cases app, the Operator and every other resource were not touched. Running \`retire-event-hubs\` again is safe: it finds nothing." ;;
                foundry) echo "The Foundry resource of the agents, \`$FOUNDRY_ACCOUNT\`, is in resource group \`$ENV_RESOURCE_GROUP\` and was read back from Azure: public network access and local authentication are off, project management is on, the project \`$FOUNDRY_PROJECT\` has an identity of its own, the models of environment/models.json are deployed with a guardrail that blocks jailbreaks and indirect attacks, the private endpoint is approved and the landing zone has registered its name, and the project sends its traces to Application Insights with its identity. The system-assigned identity of the cases app holds the Foundry User role on the project and nothing else there, and so do the Operator's identity (once the action operator has made it: the tools that check the agents read the project with it) and the project's own identity (for the continuous evaluation rule). The project endpoint is \`$FOUNDRY_ENDPOINT\`. No key was made, read or printed. The cases app was not changed: the next run of \`cases\` gives it that address." ;;
                cases) echo "The first cases are in resource group \`$ENV_RESOURCE_GROUP\`: a function app with four functions (a daily timer, a trigger on the control queue, a timer every minute for the loop and the console's web route), its identities (its own system-assigned one, which reads and stores the records and sends the letters, and \`id-meternaut-console-auth\`, which only presents the console's sign-in to Microsoft Entra and holds no role), the control queue in the base's storage account, a year of retention for the traces and the History workbook, and a private endpoint of its own for the console and its deployment site (the sub-resource \`sites\`), which the landing zone has registered in its central zone: the code is not published before that, so that a later probe finds the names. The app's public network access is \`$CASES_PUBLIC_ACCESS\` (the constant CASES_APP_PUBLIC_NETWORK_ACCESS in tools/environment-params.py). The app runs on the \`$CASES_APP_PLAN\` plan (the constant CASES_APP_PLAN in tools/environment-params.py): Basic (B1, always on, about 13 US dollars a month) was chosen on 2026-11-08, after a measurement found that the platform holds the web page's requests on Flex Consumption (which scales to zero and bills per execution), and Flex Consumption needs a measurement with \`page-latency\` that meets the rule twice (docs/proposals/07-private-by-default.md). The code was published from inside the network: a short-lived container group of the Operator signed in as the deploy identity with a token of this run, built the libraries from the hash-locked lock file (the sources went in the request, because the finished package is too big for it) and published the finished package through the app's private endpoint: with the Azure CLI's zip deployment command while the app is on Flex Consumption, as the usage app's was, and posted to the deployment site while it is on a Basic plan (the log shows that both names of the app resolve to private addresses there); the runner published nothing, and the check that the app answers is made from inside the network too: a second container group of the Operator asked the app's own health address over its private endpoint (the log shows that the name resolves to a private address there). The console's front door is knocked at from this runner, on the console's host name on the platform's Application Gateway when the secret CONSOLE_HOST_NAME is set (the check then also asks that the sign-in's return address names it), and on the app's own name when it is not; when the app takes no public traffic and no host name is set, a closed app answers nobody outside the network, so the same check is made from inside it: a third container group of the Operator asked the app's own name over its private endpoint, and sent no credential (the log shows that the name resolves to a private address there). The deploy identity holds no role on the control queue: the Operator puts the control message there. The Watch reads the pilot subscription with two roles; this workflow gives none of them, a person gives them on the owner's written word (environment/BOOTSTRAP.md), and until they exist a run ends with an authorization error. The Detective and the Skeptic call the AI Gateway (every model call of Meternaut goes through it: AGENTS.md rule 15 (c)), with the app's own identity and no key: the app reads no key and needs nothing of the owner's API Management instance. The gateway's host name was read from the service, and the app's identity holds AI Gateway Models User on the gateway only once the action \`aigateway\` has given it, which takes up to ten minutes to apply. Meternaut holds no right to change Azure. When a person approves a plan, the console sends that person to Microsoft Entra to sign in to Azure Resource Manager and runs the one change with that person's own permissions: Azure checks what that person may do, and its Activity Log names that person. The retired identity of the first loop, \`id-meternaut-runner\`, is removed when it is still there and nothing holds it. The app no longer carries the user-assigned identity that it used before, \`id-meternaut-cases\`. This workflow does not remove that identity: a person does, in the order of environment/BOOTSTRAP.md (its grants outside the project's group first, with tools/access-requirements.py retire, and the identity after that). The address of the Foundry project is given to the app only when the project is in Azure at that moment (the action \`foundry\` makes it); without it the investigation is off." ;;
                cases-run) echo "The Operator, from inside the network, put the control message in the queue and read the telemetry, with its own identity and no key; this runner put nothing in the queue and read no telemetry. One Watch ran and wrote its History to the cases app's telemetry and its records to the store; the lines above are that: the leads, what each case came to, what the models said and the tokens that were used. The tokens that the lines above count are those of the Detective and the Skeptic, which call the AI Gateway with the app's identity and no key (a 403 says that the app's identity does not hold AI Gateway Models User yet: the action aigateway gives it, and a new role takes up to ten minutes to apply),                 while the agents of the investigation call their models through the project's connection and the AI Gateway when the switch of step 2 (AGENTS_VIA_AI_GATEWAY in tools/environment-params.py) is on, and straight to the model deployments of their own Foundry project when it is off, which is the way back. No resource of the estate was changed; with the investigation on, the Watch also created its agents and conversations in its own Foundry project." ;;
                page-latency) echo "The Operator, from inside the network, asked the web page's \`/healthz\` over the app's private endpoint with no credential, and this runner asked nothing. The lines above are one line for each request (the time, the status and the seconds), then a quiet gap and the requests after it, and the summary: the count, the median, the 95th percentile, the slowest, and how many requests were not 200 or took more than 5 and more than 15 seconds. No request took more than 15 seconds and none was not 200, which is what the rule of docs/proposals/07-private-by-default.md asks of the web page on Flex Consumption. The decision needs two such measurements of 20 minutes each. Nothing was changed." ;;
                plant) echo "Waste of Meternaut's own is in resource group \`$ENV_RESOURCE_GROUP\`: an unattached disk (and, when asked, an unassigned public IP address and a virtual machine that nothing uses, with its network interface and its OS disk), tagged meternaut-planted. The next Watch finds it, and the loop takes it from there. Meternaut holds no right to delete it: the person who approves a plan for it needs the right to delete it in this group (or, for a machine or a disk, to stop it, resize it or change its tier), because the change runs with that person's own permissions." ;;
                loop-check) echo "The console's front door is shut: without a sign-in nobody gets a page (the return address of the Azure sign-in included), and a made-up sign-in header is not believed. The address that was knocked at is the console's host name on the platform's Application Gateway when the secret CONSOLE_HOST_NAME is set (the sign-in's return address then names it too), and the app's own name when it is not: from this runner while the app takes public traffic, and from inside the network, in the Operator, when it takes none and no host name is set (the lines above are the log of that container, and the app's name resolved there to a private address; no credential was sent)." ;;
                operator) echo "The Operator is in resource group \`$ENV_RESOURCE_GROUP\`: the identity \`id-meternaut-operator\`, the subnet \`snet-ops\` (delegated to container groups, with the landing zone's route table on it when the landing zone puts one on this network) and two roles for that identity: Reader on the group, and Storage Queue Data Contributor on the control queue \`cases-control\`, and nothing else. A new role takes up to ten minutes to apply, so wait before \`cases-run\`, which puts the control message in the queue with it. No container group exists, so nothing is paid until a run uses it. The next steps are \`operator-probe\`, which shows what a container on the subnet can reach, and \`cases-run\`, which runs its check tool in the Operator." ;;
                operator-probe) echo "The probe ran in a container group on \`snet-ops\` as the Operator's identity, and the group is deleted. The page above has one line for each check: \`ok\` and \`FAIL\` are facts about the landing zone and the network, not errors of the run. It also signed in as the deploy identity with a token of this run (which only the container group saw, as a secure value), built the cases app's libraries in the container from the lock file, and asked the cases app's deployment site for the status of a GET. docs/proposals/07-private-by-default.md says what each answer decides." ;;
                aigateway) echo "The AI Gateway \`$AIGATEWAY_NAME\` is in resource group \`$ENV_RESOURCE_GROUP\` and was read back from Azure: it is Succeeded, its backend subnet is \`snet-aigw\` (delegated to Microsoft.App/environments, with the landing zone's route table on it when the landing zone puts one on this network), and it has a system-assigned identity that holds Foundry User on the Foundry resource of the agents. It was made after the subnet: the action made the subnet first (or found it and left it alone), waited until the landing zone had put its route table on it, and only then made the gateway, so the gateway was made on the subnet as the landing zone left it. It has one provider, a model and an alias for each model of environment/models.json with content safety at Medium, and the gateway-wide limits of environment/aigateway/policies.json: a token limit, a request rate limit, and a cost limit for the day and one for the month, each counted for every caller alone. The Operator's identity holds AI Gateway Models User on the gateway, and so does the cases app's identity when the app had one (its Detective and Skeptic call the gateway with it). No API key was made: the service makes one named master, and the lines above say whether the service let it be deleted (a refusal is a recorded finding and not an error). THE FRONTEND OF THE GATEWAY IS PUBLIC. The service has no private frontend, and its own setting for one has no effect. A request needs a Microsoft Entra token and a role on the gateway, and there is no filter on the address (docs/proposals/08-ai-gateway.md). The agents were not changed by this action: they go through the gateway once \`foundry\` and \`cases\` have run with the switch of step 2 on. The Detective and the Skeptic call the gateway once the action \`cases\` has deployed the app, after the role has applied. A new role takes up to ten minutes to apply, and then \`aigateway-check\` calls each alias from inside the network." ;;
                aigateway-check) echo "The Operator, from inside the network, asked for a token for the AI Gateway with its own identity and no key, and sent one small chat completion to each alias. The lines above give each answer's status and the tokens that it used. The gateway also refused a request with no token and a request with an alias that does not exist, as it should. This runner did not call the gateway: the Operator did. The agents were not changed." ;;
                agents-drift) echo "The Operator, from inside the network, read the Foundry project with GET calls only (the agents with their stored definitions and the project's connections) and judged eight controls by the rules of the app's own drift check, against agents.lock.json. No control failed: the lines above are one for each control, drift.pass, or drift.unknown for a read that was refused or a shape that is not known. Nothing was changed. The app's own check runs every day at 05:10 UTC and writes the same lines to its traces; this is the second reader of them." ;;
                foundry-evals) echo "The Operator, from inside the network, ran the command of the input evals_command. probe only reads which route of the evaluations API the project answers. run replayed the invented cases of evaluation/cases.jsonl through the Investigator with every model call through the AI Gateway, held to evaluation/limits.json, and met the code thresholds of evaluation/thresholds.json: the lines above say PASS for each, or UNKNOWN for a part that the project did not offer or finish (never a pass), and how many calls of a model were counted, so that the number can be held against the gateway's own telemetry. rule prints the continuous evaluation rule, and rule-apply made it and read it back as enabled. The conversations of the replay were deleted by the tool. The agents were not changed." ;;
                foundry-redteam) echo "The Operator, from inside the network, attacked a synthetic copy of the Investigator (the locked instructions, the same model alias through the same AI Gateway connection, no tools, a name that starts with meternaut-redteam-copy-), never the production agent, and no attack got the copy to do what it must not. The lines above say which route ran, the cloud red team of Foundry or the dataset of invented attacks as the fallback, the counts by family, and how many calls of a model were counted, held to evaluation/limits.json. The copy was deleted and read back as gone. The agents were not changed." ;;
                agent365-check) echo "The Operator, from inside the network, read Microsoft Graph and the Foundry resource and changed nothing. The lines above are one for each control (A365-LICENSE, A365-IDENTITIES, A365-OWNERS, A365-LOGGING), each PASS or UNKNOWN, and the MANUAL lines list what only a person can check, with the portal path. A control that could not be read is UNKNOWN and never a pass: the Operator's identity holds no Graph role until a tenant administrator grants one. The agents were not changed." ;;
                governance) echo "The AI security is in resource group \`$ENV_RESOURCE_GROUP\` and was read back from Azure: the policy assignments for approved models and for model eligibility are on the group with the effect that tools/environment-params.py says (Audit until a run of \`drift-check\` has shown every deployment compliant, then Deny, which is one line there), enforced, with no exemption and no identity; the alert rules are on and tell the owner by e-mail (the e-mail holds the rule's name, a count and a link, and never a line of the telemetry); the workbook Meternaut AI security is there; and the logs of the Foundry resource go to a workspace. The landing zone's own policies were read and not assigned a second time. The heartbeat rule fires when the app's own daily drift check has logged nothing for 26 hours, so it may mail once until the app that carries that check has been deployed (\`cases\`). The next actions are \`drift-check\`, and \`gateway-telemetry\` once its prerequisites are in place." ;;
                gateway-telemetry) echo "The AI Gateway has a telemetry exporter, read back from Azure: it sends the gateway's logs, traces and metrics to the project's Application Insights component with the gateway's own identity and no key, and payloadCapture is false, so no prompt and no answer is sent. Records arrive a few minutes after the first call of the gateway (a new role takes up to ten minutes to apply): the workbook Meternaut AI security shows the calls by caller, the refusals and the use of the limits, and the alert rules read the same tables. Run \`aigateway-check\` or \`cases-run\` to make a call, and open the workbook." ;;
                drift-check) echo "Every control of the AI security was read from Azure and none failed: the summary lists each as PASS or UNKNOWN with what was read. UNKNOWN is never PASS: it says what the deploy identity could not read, or which baseline the owner has not accepted yet (the secrets DRIFT_ACCEPTED_EXEMPTIONS and DRIFT_ACCEPTED_DENY). Nothing was changed: the check only reads. The in-app half of the check (the agents' definitions in the Foundry project) is the app's own daily check, whose lines this check reads; the workflow drift.yml runs this same tool with an identity of its own that can only read." ;;
                teams) echo "The Teams bot is in resource group \`$ENV_RESOURCE_GROUP\`: the identity that is the bot (client id \`$TEAMS_BOT_CLIENT_ID\`, which is its app id and the botId of the Teams app), the Azure Bot resource with its Teams channel (the free tier, no key), and the function app \`$TEAMS_BOT_APP\` on Flex Consumption with two functions, the messaging endpoint and the timer that offers the cards. It was read back from Azure, and the door was knocked at: a request with no token and a request with a token that is not one were both refused with 401 and an empty body. The endpoint is public by design. This run does not prove that a card reaches a person: a person adds the app in Teams and the first card shows it. What people do by hand next is in docs/proposals/13-teams-and-outlook.md: build the Teams app package (python tools/teams-package.py build --bot-id the-client-id-above --site https://the-web-page-host --out teams-app.zip), a Teams administrator uploads it in the Teams admin center, and the people add the app." ;;
              esac
            fi
            # The route of the agents through the AI Gateway (the switch AGENTS_VIA_AI_GATEWAY in tools/environment-params.py, True since the owner's order of 2026-11-07: docs/proposals/08-ai-gateway.md, step 2): what the three
            # actions that it changes add to what is said above. With the switch off nothing is added.
            if [ "$AGENTS_VIA_AI_GATEWAY" = true ]; then
              echo
              if [ "$JOB_STATUS" != "success" ]; then
                if [ "$ACTION" = aigateway ]; then echo "**The switch of the agents' route is on.** The action also needs the Foundry project's identity, for AI Gateway Models User on the gateway. If the lines above stop at the settings, the project is not in Azure or has no identity of its own: run \`foundry\` first. Nothing was changed before that. The way back is the switch set to False in tools/environment-params.py."; fi
                if [ "$ACTION" = foundry ]; then echo "**The switch of the agents' route is on.** The action also needs the AI Gateway and makes the project's connection to it. If the lines above stop at the settings, the gateway is not in Azure: run \`aigateway\` first. Nothing was changed. If the deploy was refused at the connection, the service did not take a connection of the category ApiManagement with the project's own identity for the gateway's address. That is the open question of step 2 (docs/proposals/08-ai-gateway.md): nothing is repaired from here, no key is built (rule 23), and the owner decides. If the read-back failed, the lines say which property of the connection differs. The cases app was not changed. The way back is the switch set to False."; fi
                if [ "$ACTION" = cases ]; then echo "**The switch of the agents' route is on.** The action first checks that the project has the connection \`$CONNECTION_NAME\`, because the app is given model names that name it. If the lines above stop there, run \`aigateway\` and then \`foundry\` first. Nothing was deployed. The way back is the switch set to False."; fi
                if [ "$ACTION" = cases-run ]; then echo "**The switch of the agents' route is on.** With the investigation on, the agents' model calls go through the project's connection and the AI Gateway. When the Agent Service could not call the model, the History says so in words: the status and the code that the service answered with, and what to check."; fi
              else
                if [ "$ACTION" = aigateway ]; then echo "**The switch of the agents' route is on.** The Foundry project's identity holds AI Gateway Models User on the gateway (read back from Azure). A new role takes up to ten minutes to apply. The next action is \`foundry\`, which makes the project's connection to the gateway. The agents still call their model deployments until \`cases\` has run."; fi
                if [ "$ACTION" = foundry ]; then echo "**The switch of the agents' route is on.** The project has the connection \`$CONNECTION_NAME\` to the AI Gateway, with the project's own identity and no key. It was read back from Azure: its category, its authentication, its audience, its target, its models, and that it holds no credentials. WHETHER THE AGENT SERVICE CAN CALL THE GATEWAY THROUGH IT IS NOT KNOWN: only a run of the agents shows that. The next action is \`cases\`, which gives the app the model names that name the connection, and then \`cases-run\`."; fi
                if [ "$ACTION" = cases ]; then echo "**The switch of the agents' route is on.** The cases app was given the model names \`$CONNECTION_NAME/<alias>\` for the Investigator and the Skeptic: their model calls go through the project's connection and the AI Gateway, and no longer straight to the model deployments. \`cases-run\` shows whether the Agent Service can call the gateway. When it cannot, the History says why in words (the status and the code that the service gave), the investigation does not run, and the older path judges the leads. The way back is the switch set to False in tools/environment-params.py, and a run of \`cases\`."; fi
                if [ "$ACTION" = cases-run ]; then echo "**The switch of the agents' route is on.** With the investigation on, the agents' model calls of this run go through the project's connection and the AI Gateway, and the History line \`investigation.started\` names the models as \`$CONNECTION_NAME/<alias>\`. Read the investigation lines above: when the Agent Service could not call the model, the line says so in words."; fi
              fi
            fi
            if [ "$ACTION" = base ] && [ "$JOB_STATUS" = success ] && [ "$GATEWAY_TELEMETRY" = true ]; then echo "**The OpenTelemetry ingestion of the Application Insights component is on** (the constant GATEWAY_TELEMETRY in tools/environment-params.py): Azure makes a managed Azure Monitor workspace, a data collection endpoint and a data collection rule in a resource group that it manages, and the component reports its OpenTelemetry endpoints a few minutes later. The next step for the AI Gateway's telemetry is for a person to give the gateway's identity Monitoring Metrics Publisher on that rule (step G3 of environment/BOOTSTRAP.md), and then the action \`gateway-telemetry\`."; fi
          } >> "$GITHUB_STEP_SUMMARY"
