name: Hub

# The only way anything of the hub reaches Azure (AGENTS.md rule 18). "The hub" is the Citadel governance hub: the one
# gateway for every model call, here the owner's existing API Management instance with Microsoft's Citadel rules, and the
# private model account behind it. Nothing starts this workflow but a click on "Run workflow" in the Actions tab. It signs
# in to Azure with OpenID Connect and a credential that exists only for the main branch, so a copy of this file on any
# other branch cannot sign in. "what-if" reads and changes nothing.
# What it does, and what to set up once before the first run: environment/BOOTSTRAP.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "what-if: show what the next steps would change and change nothing. model-side: the gateway's identity, then the network, the model account with its private endpoint and the budget. gateway-prepare: attach the identity to the gateway and add the logger. gateway: add the Citadel module's objects to the gateway (without the two fragments that need the usage recording's Event Hub). contract: add the first contract (a product, its policy and its key) and test the gateway with that key. recording: the usage recording of the gateway's calls, which is a Log Analytics workspace, an Event Hubs namespace, a Cosmos DB account, a storage account and a Logic App with its workflows. recording-check: start the Logic App's copy job once and read what it wrote to Cosmos DB."
        type: choice
        required: true
        default: what-if
        options:
          - what-if
          - model-side
          - gateway-prepare
          - gateway
          - contract
          - recording
          - recording-check
      check_limits:
        description: "Only with contract: also prove the token limit, with one request larger than a minute's allowance and then a refusal by the gateway. It uses about a minute of the contract's tokens and blocks the key for up to a minute."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  hub:
    name: Hub (${{ inputs.action }})
    if: github.actor == 'tinodo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ACTION: ${{ inputs.action }}
      ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ENV_RESOURCE_GROUP: ${{ vars.ENV_RESOURCE_GROUP }}
      ENV_LOCATION: ${{ vars.ENV_LOCATION }}
      ENV_VNET_PREFIX: ${{ vars.ENV_VNET_PREFIX }}
      ENV_PE_SUBNET_PREFIX: ${{ vars.ENV_PE_SUBNET_PREFIX }}
      ENV_DNS_SERVERS: ${{ vars.ENV_DNS_SERVERS }}
      ENV_OWNER: ${{ vars.ENV_OWNER }}
      ENV_BUDGET_AMOUNT: ${{ vars.ENV_BUDGET_AMOUNT }}
      ENV_ALERT_EMAILS: ${{ vars.ENV_ALERT_EMAILS }}
      RECORDING_READER_IDS: ${{ vars.RECORDING_READER_IDS }}
      GATEWAY_RESOURCE_ID: ${{ secrets.GATEWAY_RESOURCE_ID }}
      GATEWAY_APPINSIGHTS_ID: ${{ secrets.GATEWAY_APPINSIGHTS_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the Citadel kit at the commit that was read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure-Samples/ai-hub-gateway-solution-accelerator
          ref: 81599b31dfbaee20ebd3a6d2ba9b07dde3c31814
          path: kit
          persist-credentials: false

      - name: Apply the patches to the kit's module
        run: |
          # environment/kit-patches/*.patch: what each one does, and why, is at its top. A patch that does not apply stops the run.
          for patch in environment/kit-patches/*.patch; do
            git -C kit apply --check "../$patch"
            git -C kit apply "../$patch"
          done

      - name: The tools, the templates and the kit's module pass their checks
        run: |
          python3 -m unittest discover -s tools/tests
          python3 tools/workflow-lint.py
          for template in environment/main.bicep environment/gateway/identity.bicep environment/gateway/logger.bicep environment/gateway/contract.bicep environment/recording/main.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
            az bicep lint --file "$template"
          done
          az bicep build --file environment/main.bicep --outfile "$RUNNER_TEMP/environment.json"
          az bicep build --file environment/gateway/logger.bicep --outfile "$RUNNER_TEMP/logger.json"
          az bicep build --file environment/gateway/contract.bicep --outfile "$RUNNER_TEMP/contract.json"
          az bicep build --file environment/recording/main.bicep --outfile "$RUNNER_TEMP/recording.json"
          az bicep build --file kit/bicep/infra/apim-gateway-upgrade/main.bicep --outfile "$RUNNER_TEMP/kit.json"

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the object id of the signed-in identity
        id: me
        run: |
          # The workflow's identity may not read the directory, so the id is read from the claims of its own token (nothing else of the
          # token is read or printed). The usage store is given a data role for this id, so that the check can read what the job wrote.
          oid=$(python3 tools/recording-check.py whoami)
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: Read the gateway and its Application Insights
        run: python3 tools/gateway-prep.py facts --apim "$GATEWAY_RESOURCE_ID" --insights "$GATEWAY_APPINSIGHTS_ID" --summary "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: The resource group is there
        run: az group show --name "$ENV_RESOURCE_GROUP" --query "{name:name, location:location, state:properties.provisioningState}" --output table

      - name: Read the start date of the budget
        id: budget
        run: |
          # A budget keeps its start date, so an existing one is read and passed on again; a new one starts in the current month.
          # The group's budgets are listed and filtered by name: a missing budget is an empty answer, so no error text is read
          # (the service's text for "not found" differs from one API to the next).
          url="https://management.azure.com/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Consumption/budgets?api-version=2024-08-01"
          start=$(az rest --method get --url "$url" --query "value[?name=='meternaut-hub'].properties.timePeriod.startDate | [0]" --output tsv)
          if [ -n "$start" ] && [ "$start" != "None" ]; then
            start="${start:0:10}"
            echo "The budget exists and started on $start."
          else
            start="$(date -u +%Y-%m-01)"
            echo "There is no budget yet; a new one starts on $start."
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Work out the settings
        id: params
        env:
          ENV_BUDGET_START: ${{ steps.budget.outputs.start }}
          RECORDING_DEPLOYER_ID: ${{ steps.me.outputs.oid }}
        run: |
          # The gateway identity does not exist before model-side has run, so this first pass is a preview: it gives the names.
          contract_files="--contract environment/contract.json --contract-policy environment/gateway/contract-policy.xml"
          outputs=$(python3 tools/environment-params.py build --models environment/models.json --out-dir "$RUNNER_TEMP" --preview $contract_files)
          echo "$outputs" >> "$GITHUB_OUTPUT"
          gateway_subscription=$(sed -n 's/^gateway_subscription=//p' <<< "$outputs")
          gateway_group=$(sed -n 's/^gateway_resource_group=//p' <<< "$outputs")
          identity_name=$(sed -n 's/^identity_name=//p' <<< "$outputs")
          # Where the identity exists already, its principal id goes into the files, so that a what-if shows the real role assignment.
          principal=$(az identity list --subscription "$gateway_subscription" --resource-group "$gateway_group" --query "[?name=='$identity_name'].principalId | [0]" --output tsv)
          if [ -n "$principal" ] && [ "$principal" != "None" ]; then
            echo "The gateway identity exists; its principal id is used."
            GATEWAY_PRINCIPAL_ID="$principal" python3 tools/environment-params.py build --models environment/models.json --out-dir "$RUNNER_TEMP" $contract_files > /dev/null
          else
            echo "The gateway identity does not exist yet; the role assignment is shown with a placeholder."
          fi
          # The files are checked against the templates that were compiled above, so a setting that no template takes is found before Azure is asked.
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/environment.parameters.json" --template "$RUNNER_TEMP/environment.json" --label environment
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/logger.parameters.json" --template "$RUNNER_TEMP/logger.json" --label logger
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/kit.parameters.json" --template "$RUNNER_TEMP/kit.json" --label kit
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/recording.parameters.json" --template "$RUNNER_TEMP/recording.json" --label recording
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/contract.parameters.json" --template "$RUNNER_TEMP/contract.json" --label contract

      - name: What the identity, the model side, the logger and the usage recording would change
        if: inputs.action == 'what-if'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
        run: |
          echo "::group::The gateway identity, in the gateway's resource group"
          python3 tools/az-deploy.py what-if --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template environment/gateway/identity.bicep
          echo "::endgroup::"
          echo "::group::The model side, in the project's resource group (the gateway identity's role is shown with a placeholder: the identity does not exist yet)"
          python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/main.bicep --parameters "$RUNNER_TEMP/environment.parameters.json" --restore-param restoreAccount
          echo "::endgroup::"
          echo "::group::The Application Insights logger, in the gateway's resource group"
          python3 tools/az-deploy.py what-if --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template environment/gateway/logger.bicep --parameters "$RUNNER_TEMP/logger.parameters.json"
          echo "::endgroup::"
          echo "::group::The usage recording, in the project's resource group (the gateway identity's role is shown with a placeholder until model-side has run)"
          python3 tools/az-deploy.py what-if --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/recording/main.bicep --parameters "$RUNNER_TEMP/recording.parameters.json"
          echo "::endgroup::"

      - name: Make the gateway identity
        id: identity
        if: inputs.action == 'model-side'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
        run: |
          principal=$(python3 tools/az-deploy.py create --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template environment/gateway/identity.bicep --name "identity-$GITHUB_RUN_ID" --output principalId)
          if ! printf '%s' "$principal" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::The deployment did not return the principal id of the gateway identity."
            exit 1
          fi
          echo "principal=$principal" >> "$GITHUB_OUTPUT"

      - name: Work out the settings with the identity's principal
        if: inputs.action == 'model-side'
        env:
          GATEWAY_PRINCIPAL_ID: ${{ steps.identity.outputs.principal }}
          ENV_BUDGET_START: ${{ steps.budget.outputs.start }}
          RECORDING_DEPLOYER_ID: ${{ steps.me.outputs.oid }}
        run: |
          python3 tools/environment-params.py build --models environment/models.json --out-dir "$RUNNER_TEMP" > /dev/null
          python3 tools/environment-params.py check --params "$RUNNER_TEMP/environment.parameters.json" --template "$RUNNER_TEMP/environment.json" --label environment

      - name: Deploy the network, the model account, its private endpoint and the budget
        if: inputs.action == 'model-side'
        env:
          EXPECTED_ENDPOINT: ${{ steps.params.outputs.endpoint }}
        run: |
          endpoint=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/main.bicep --parameters "$RUNNER_TEMP/environment.parameters.json" \
            --name "environment-$GITHUB_RUN_ID" --output endpoint --restore-param restoreAccount)
          if [ "${endpoint%/}" != "$EXPECTED_ENDPOINT" ]; then
            echo "::error::The deployed account answers on ${endpoint%/}, not on $EXPECTED_ENDPOINT. Nothing was added to the gateway."
            exit 1
          fi

      - name: Wait until the landing zone has registered the endpoint's name
        if: inputs.action == 'model-side' || inputs.action == 'gateway-prepare' || inputs.action == 'gateway'
        env:
          PRIVATE_ENDPOINT: ${{ steps.params.outputs.private_endpoint }}
        run: |
          found=$(az network private-endpoint list --resource-group "$ENV_RESOURCE_GROUP" --query "[?name=='$PRIVATE_ENDPOINT'].name | [0]" --output tsv)
          if [ -z "$found" ] || [ "$found" = "None" ]; then
            echo "::error::The private endpoint $PRIVATE_ENDPOINT is not there. Run model-side first."
            exit 1
          fi
          # After model-side the policy needs about ten minutes, so it is waited for; for the later actions it must be done.
          attempts=40
          if [ "$ACTION" != "model-side" ]; then attempts=1; fi
          for attempt in $(seq 1 "$attempts"); do
            zones=$(az network private-endpoint dns-zone-group list --resource-group "$ENV_RESOURCE_GROUP" \
              --endpoint-name "$PRIVATE_ENDPOINT" --query "[].privateDnsZoneConfigs[].privateDnsZoneId" --output tsv || true)
            if grep -qi 'privatelink.cognitiveservices.azure.com' <<< "$zones"; then
              echo "The landing zone's policy has registered $PRIVATE_ENDPOINT in the central private DNS zone."
              exit 0
            fi
            echo "Not registered yet (check $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then sleep 60; fi
          done
          echo "::error::The landing zone's policy has not registered $PRIVATE_ENDPOINT in the central private DNS zone. Nothing was added to the gateway. Wait, or look at the policy compliance of the endpoint; do not create a private DNS zone."
          exit 1

      - name: Find the gateway identity
        id: found
        if: inputs.action == 'gateway-prepare' || inputs.action == 'gateway' || inputs.action == 'recording'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
          IDENTITY_NAME: ${{ steps.params.outputs.identity_name }}
        run: |
          identity=$(az identity list --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" --query "[?name=='$IDENTITY_NAME'].id | [0]" --output tsv)
          if [ -z "$identity" ] || [ "$identity" = "None" ]; then
            echo "::error::The gateway identity $IDENTITY_NAME is not there. Run model-side first: it makes the identity and gives it its role on the model account."
            exit 1
          fi
          echo "identity_id=$identity" >> "$GITHUB_OUTPUT"

      - name: Attach the identity to the gateway, keeping what it has
        if: inputs.action == 'gateway-prepare'
        env:
          IDENTITY_ID: ${{ steps.found.outputs.identity_id }}
        run: python3 tools/gateway-prep.py attach-identity --apim "$GATEWAY_RESOURCE_ID" --identity "$IDENTITY_ID"

      - name: Add the Application Insights logger that the module expects
        if: inputs.action == 'gateway-prepare'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
        run: |
          python3 tools/az-deploy.py create --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template environment/gateway/logger.bicep --parameters "$RUNNER_TEMP/logger.parameters.json" --name "logger-$GITHUB_RUN_ID"

      - name: Wait until the gateway has finished updating
        if: inputs.action == 'gateway-prepare'
        run: python3 tools/gateway-prep.py wait --apim "$GATEWAY_RESOURCE_ID"

      - name: The gateway is ready for the Citadel module
        if: inputs.action == 'gateway'
        env:
          IDENTITY_ID: ${{ steps.found.outputs.identity_id }}
        run: python3 tools/gateway-prep.py prepared --apim "$GATEWAY_RESOURCE_ID" --identity "$IDENTITY_ID"

      - name: What the Citadel module would change in the gateway
        if: inputs.action == 'what-if' || inputs.action == 'gateway'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
          IDENTITY_NAME: ${{ steps.params.outputs.identity_name }}
        run: |
          identity=$(az identity list --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" --query "[?name=='$IDENTITY_NAME'].id | [0]" --output tsv)
          logger=$(az rest --method get --url "https://management.azure.com${GATEWAY_RESOURCE_ID}/loggers?api-version=2024-05-01" --query "value[?name=='appinsights-logger'].name | [0]" --output tsv)
          if [ -z "$identity" ] || [ "$identity" = "None" ] || [ -z "$logger" ] || [ "$logger" = "None" ]; then
            echo "The Citadel module cannot be previewed yet: it looks up the gateway identity and the logger appinsights-logger, and they do not exist before model-side and gateway-prepare have run. Its list is the module's own: two inference APIs, policy fragments, backends and pools, named values, and the service-level logging setting. A what-if after those two shows the exact diff."
            exit 0
          fi
          python3 tools/az-deploy.py what-if --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template kit/bicep/infra/apim-gateway-upgrade/main.bicep --parameters "$RUNNER_TEMP/kit.parameters.json"

      - name: Add the Citadel module's objects to the gateway
        if: inputs.action == 'gateway'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
        run: |
          python3 tools/az-deploy.py create --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template kit/bicep/infra/apim-gateway-upgrade/main.bicep --parameters "$RUNNER_TEMP/kit.parameters.json" --name "gateway-$GITHUB_RUN_ID"

      - name: What the gateway holds now
        if: inputs.action == 'gateway'
        run: |
          az rest --method get --url "https://management.azure.com${GATEWAY_RESOURCE_ID}/apis?api-version=2024-05-01" --query "value[].{name:name, path:properties.path}" --output table

      - name: The two model APIs refuse a call that is not made with a contract's key
        if: inputs.action == 'gateway'
        run: |
          # The rule is in the kit's API policies through environment/kit-patches/contract-required.patch; this reads it back from the instance.
          for api in universal-llm-api azure-openai-api; do
            policy=$(az rest --method get --url "https://management.azure.com${GATEWAY_RESOURCE_ID}/apis/${api}/policies/policy?api-version=2024-05-01&format=rawxml" --query properties.value --output tsv)
            if ! grep -q 'contract_required' <<< "$policy"; then
              echo "::error::The policy of $api does not hold the rule that refuses a call without a contract's key."
              exit 1
            fi
            echo "$api: a call that is not made with a contract's key is refused."
          done

      - name: What the first contract would change in the gateway
        if: inputs.action == 'what-if' || inputs.action == 'contract'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
          CONTRACT_APIS: ${{ steps.params.outputs.contract_apis }}
        run: |
          # The contract grants the two inference APIs that the Citadel module makes, so it can only be added after "gateway".
          present=$(az rest --method get --url "https://management.azure.com${GATEWAY_RESOURCE_ID}/apis?api-version=2024-05-01" --query "value[].name" --output tsv)
          missing=""
          for api in ${CONTRACT_APIS//,/ }; do
            if ! grep -Fxq "$api" <<< "$present"; then missing="$missing $api"; fi
          done
          if [ -n "$missing" ]; then
            if [ "$ACTION" = "contract" ]; then
              echo "::error::The gateway has no API named:$missing. Run gateway first: the contract grants the APIs that the Citadel module makes."
              exit 1
            fi
            echo "The contract cannot be previewed yet: the gateway has no API named:$missing. It is a product that grants those APIs, with a policy and one subscription; a what-if after gateway shows the exact diff."
            exit 0
          fi
          python3 tools/az-deploy.py what-if --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template environment/gateway/contract.bicep --parameters "$RUNNER_TEMP/contract.parameters.json"

      - name: Add the first contract to the gateway
        if: inputs.action == 'contract'
        env:
          GATEWAY_SUBSCRIPTION: ${{ steps.params.outputs.gateway_subscription }}
          GATEWAY_GROUP: ${{ steps.params.outputs.gateway_resource_group }}
        run: |
          python3 tools/az-deploy.py create --subscription "$GATEWAY_SUBSCRIPTION" --resource-group "$GATEWAY_GROUP" \
            --template environment/gateway/contract.bicep --parameters "$RUNNER_TEMP/contract.parameters.json" --name "contract-$GITHUB_RUN_ID"

      - name: Test the gateway with the contract's key
        if: inputs.action == 'contract'
        env:
          CONTRACT_SUBSCRIPTION: ${{ steps.params.outputs.contract_subscription }}
          CHECK_LIMITS: ${{ inputs.check_limits }}
        run: |
          # The key is read from the gateway for this test only: it is masked at once, handed to the test through the
          # environment of that one command, and stored nowhere (not in a secret, an output, the environment file or the summary).
          gateway_url=$(az rest --method get --url "https://management.azure.com${GATEWAY_RESOURCE_ID}?api-version=2024-05-01" --query properties.gatewayUrl --output tsv)
          key=$(az rest --method post --url "https://management.azure.com${GATEWAY_RESOURCE_ID}/subscriptions/${CONTRACT_SUBSCRIPTION}/listSecrets?api-version=2024-05-01" --query primaryKey --output tsv)
          echo "::add-mask::$key"
          flags=""
          if [ "$CHECK_LIMITS" = "true" ]; then flags="--limits"; fi
          set +e
          GATEWAY_SMOKE_KEY="$key" python3 tools/environment-smoke.py --url "${gateway_url%/}/models/chat/completions" $flags > "$RUNNER_TEMP/smoke.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/smoke.txt"
          {
            echo "### The gateway tested with the contract's key"
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Deploy the usage recording
        id: recording
        if: inputs.action == 'recording'
        run: |
          # A Log Analytics workspace and an Application Insights component, a storage account, an Event Hubs namespace with its two
          # hubs, a Cosmos DB account (serverless) with its seven containers, the Logic App on a Workflow Standard plan with its Azure
          # Monitor Logs connection, and the one role that each caller needs on the one resource it uses (environment/recording/main.bicep).
          site=$(python3 tools/az-deploy.py create --subscription "$ENV_SUBSCRIPTION_ID" --resource-group "$ENV_RESOURCE_GROUP" \
            --template environment/recording/main.bicep --parameters "$RUNNER_TEMP/recording.parameters.json" \
            --name "recording-$GITHUB_RUN_ID" --output logicAppId)
          if ! printf '%s' "$site" | grep -Eq '^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+/providers/Microsoft\.Web/sites/[A-Za-z0-9-]+$'; then
            echo "::error::The deployment did not return the resource id of the Logic App."
            exit 1
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Publish the usage workflows to the Logic App
        if: inputs.action == 'recording'
        env:
          LOGIC_APP: ${{ steps.params.outputs.logic_app_name }}
        run: |
          # The five workflows are the kit's own, as they are in src/usage-ingestion-logicapp; only the design-time host that the
          # folder's own .funcignore names is left out. A site that has just been made may need a minute before it takes a package.
          package="$RUNNER_TEMP/usage-logicapp.zip"
          (cd kit/src/usage-ingestion-logicapp && zip -qr "$package" . -x 'workflow-designtime/*' -x '.funcignore')
          unzip -l "$package" | tail -n 1
          for attempt in 1 2 3; do
            if az webapp deploy --resource-group "$ENV_RESOURCE_GROUP" --name "$LOGIC_APP" --src-path "$package" --type zip --only-show-errors; then
              exit 0
            fi
            echo "The publish did not go through (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error::The workflows could not be published to $LOGIC_APP."
          exit 1

      - name: The Logic App lists its workflows
        if: inputs.action == 'recording'
        env:
          SITE_ID: ${{ steps.recording.outputs.site }}
          LOGIC_APP: ${{ steps.params.outputs.logic_app_name }}
        run: |
          python3 tools/recording-check.py workflows --site "$SITE_ID" --expect 5 --minutes 10 | tee "$RUNNER_TEMP/workflows.txt"
          principal=$(az webapp identity show --resource-group "$ENV_RESOURCE_GROUP" --name "$LOGIC_APP" --query principalId --output tsv)
          {
            echo "### The Logic App"
            echo
            echo '```'
            cat "$RUNNER_TEMP/workflows.txt"
            echo '```'
            echo
            echo "Identity of the Logic App (object id): \`$principal\`. Its copy job reads the gateway's Application Insights with it, which needs one role in the gateway's subscription (environment/BOOTSTRAP.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What the project's resource group holds now
        if: inputs.action == 'recording'
        run: az resource list --resource-group "$ENV_RESOURCE_GROUP" --query "sort_by([].{name:name, type:type}, &type)" --output table

      - name: Start the copy job once and read what it wrote
        if: inputs.action == 'recording-check'
        env:
          LOGIC_APP: ${{ steps.params.outputs.logic_app_name }}
          COSMOS_ACCOUNT: ${{ steps.params.outputs.cosmos_account_name }}
        run: |
          site="/subscriptions/$ENV_SUBSCRIPTION_ID/resourceGroups/$ENV_RESOURCE_GROUP/providers/Microsoft.Web/sites/$LOGIC_APP"
          python3 tools/recording-check.py run --site "$site" --cosmos-account "$COSMOS_ACCOUNT" --summary "$GITHUB_STEP_SUMMARY"

      - name: What was done
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ACCOUNT_NAME: ${{ steps.params.outputs.account_name }}
          CONTRACT_NAME: ${{ steps.params.outputs.contract_name }}
        run: |
          {
            echo "### Hub: $ACTION, $JOB_STATUS"
            echo
            if [ "$JOB_STATUS" != "success" ]; then
              echo "**The run did not finish.** The log shows the step that failed; nothing below is promised."
              case "$ACTION" in
                what-if) echo "A what-if changes nothing." ;;
                model-side) echo "The gateway identity, the network, the model account and the private endpoint may exist now (the endpoint costs a few euros a month while it does). Running \`model-side\` again is safe and repeats only what is missing. \`what-if\` shows what is there." ;;
                gateway-prepare) echo "The identity may be attached to the gateway and the logger may exist. Running \`gateway-prepare\` again is safe and repeats only what is missing. The gateway's service-level logging setting before the change is in the first list of this page." ;;
                gateway) echo "Some of the module's objects may be in the gateway already. Running \`gateway\` again is safe and repeats only what is missing. The gateway's service-level logging setting before the change is in the first list of this page." ;;
                contract) echo "The contract's product, its policy and its subscription may be in the gateway already, and the test of the gateway with its key may have failed after that. Running \`contract\` again is safe: it repeats only what is missing and runs the test again." ;;
                recording) echo "Part of the usage recording may exist now: the Log Analytics workspace, the storage account, the Event Hubs namespace, the Cosmos DB account, the Logic App and its connection. They cost money while they exist, the Logic App's plan most (about 160 euros a month). Running \`recording\` again is safe and repeats only what is missing; \`what-if\` shows what is there." ;;
                recording-check) echo "The copy job may have run and written nothing, or not at all. The lines above say how each of its actions ended and what the usage store holds. Running \`recording-check\` again is safe." ;;
              esac
            else
              case "$ACTION" in
                what-if) echo "Nothing was changed. Read the lists above: what the next steps would create, and the gateway as it is now." ;;
                model-side) echo "The model account \`$ACCOUNT_NAME\` is behind a private endpoint in resource group \`$ENV_RESOURCE_GROUP\`, the gateway identity has its role on it, and the landing zone has registered the endpoint's name. The gateway has not been touched." ;;
                gateway-prepare) echo "The identity is attached to the gateway (its own identity is kept) and the logger is there. The Citadel module has not been applied: a what-if now shows its exact diff." ;;
                gateway) echo "The Citadel module's objects are in the gateway, without its two usage-recording fragments. A call to the two model APIs is refused unless it is made with the key of a contract, so nobody can call them (the instance's all-access key included) until the first contract exists." ;;
                contract) echo "The contract \`$CONTRACT_NAME\` is in the gateway: a product that grants the two inference APIs, its policy (the models and the token limits) and one subscription. The checks above ran against the gateway with that subscription's key, which is stored nowhere." ;;
                recording) echo "The usage recording is in resource group \`$ENV_RESOURCE_GROUP\`: Event Hubs, a Cosmos DB account (serverless), a storage account, the Logic App with the kit's five workflows, and a workspace and an Application Insights component of its own. The gateway identity may send to the two event hubs and the Logic App may read them; nothing sends to them yet. The copy job needs one role in the gateway's subscription before it can read the gateway's Application Insights (environment/BOOTSTRAP.md); then \`recording-check\` starts it once and reads what it wrote." ;;
                recording-check) echo "The copy job ran and the usage store was read with the workflow's identity. The lines above are what is in it. The job writes only what the gateway recorded after its marker, so a first run writes the marker and nothing else." ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"
