<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 720" width="1340" height="720" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <title id="t">The same Recommendation at five levels of access</title>
  <desc id="d">Five columns show the value tile, the price basis, the saving word, the purchase path and what more access would buy for the same invented one-year compute commitment, under billing reach, subscription with costs, subscription without costs, a partner-sold subscription and pay-as-you-go.</desc>
  <rect width="1340" height="720" fill="#F3F2F1"/>
  <text x="32" y="46" font-size="22" font-weight="700" fill="#242424" text-anchor="start">The same Recommendation at five levels of access</text>
  <text x="32" y="72" font-size="13.5" font-weight="400" fill="#5C5C5C" text-anchor="start">An invented example: a one-year compute commitment for the order platform. Only the figure, the words and the purchase path change; the care does not.</text>
  <rect x="32" y="100" width="248" height="560" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
  <rect x="32" y="100" width="248" height="72" rx="8" fill="#0F6CBD"/>
  <rect x="32" y="156" width="248" height="16" rx="0" fill="#0F6CBD"/>
  <text x="48" y="126" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">A. Billing reach</text>
  <text x="48" y="146" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">EA or direct MCA, with a billing role</text>
  <rect x="46" y="190" width="220" height="176" rx="6" fill="#EBF3FC" stroke="#9FC7EE" stroke-width="1"/>
  <text x="58" y="222" font-size="19" font-weight="700" fill="#0F6CBD" text-anchor="start">About €4,300 a month</text>
  <text x="58" y="242" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Range €3,700 to €4,900</text>
  <rect x="58" y="252" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#9FC7EE" stroke-width="1"/>
  <text x="68" y="272" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">At your agreement's rates</text>
  <rect x="58" y="330" width="118" height="22" rx="11" fill="#E7F4E7"/>
  <text x="67" y="345" font-size="12" font-weight="700" fill="#0E700E" text-anchor="start">Expected saving</text>
  <text x="48" y="394" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">Buying it</text>
  <text x="48" y="414" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">Two people approve one plan bound to</text>
  <text x="48" y="432" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">a stored price check. The approver's</text>
  <text x="48" y="450" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">own sign-in places the order; the AI</text>
  <text x="48" y="468" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">that wrote it cannot.</text>
  <text x="48" y="500" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">What more access would buy</text>
  <text x="48" y="520" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">Nothing to add: the price sheet and</text>
  <text x="48" y="538" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">your commitments are readable.</text>
  <rect x="294" y="100" width="248" height="560" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
  <rect x="294" y="100" width="248" height="72" rx="8" fill="#0F6CBD"/>
  <rect x="294" y="156" width="248" height="16" rx="0" fill="#0F6CBD"/>
  <text x="310" y="126" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">B. Subscription with costs</text>
  <text x="310" y="146" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">Cost Management Reader on the</text>
  <text x="310" y="160" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">subscription</text>
  <rect x="308" y="190" width="220" height="176" rx="6" fill="#EBF3FC" stroke="#9FC7EE" stroke-width="1"/>
  <text x="320" y="222" font-size="19" font-weight="700" fill="#0F6CBD" text-anchor="start">About €4,100 a month</text>
  <text x="320" y="242" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Range €3,500 to €4,700</text>
  <rect x="320" y="252" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#9FC7EE" stroke-width="1"/>
  <text x="330" y="272" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">At the rates on your bill</text>
  <rect x="320" y="330" width="118" height="22" rx="11" fill="#E7F4E7"/>
  <text x="329" y="345" font-size="12" font-weight="700" fill="#0E700E" text-anchor="start">Expected saving</text>
  <text x="310" y="394" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">Buying it</text>
  <text x="310" y="414" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">The AI writes the request for your</text>
  <text x="310" y="432" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">billing owner. Two people approve</text>
  <text x="310" y="450" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">the request here first.</text>
  <text x="310" y="482" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">What more access would buy</text>
  <text x="310" y="502" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">With the price sheet, agreement</text>
  <text x="310" y="520" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">rates could replace billed rates on</text>
  <text x="310" y="538" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">14 open Recommendations.</text>
  <rect x="556" y="100" width="248" height="560" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
  <rect x="556" y="100" width="248" height="72" rx="8" fill="#0F6CBD"/>
  <rect x="556" y="156" width="248" height="16" rx="0" fill="#0F6CBD"/>
  <text x="572" y="126" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">C. Subscription without costs</text>
  <text x="572" y="146" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">Resource roles only</text>
  <rect x="570" y="190" width="220" height="176" rx="6" fill="#EBF3FC" stroke="#9FC7EE" stroke-width="1"/>
  <text x="582" y="222" font-size="19" font-weight="700" fill="#0F6CBD" text-anchor="start">About €4,900 a month</text>
  <text x="582" y="242" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Range €4,200 to €5,600</text>
  <rect x="582" y="252" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#9FC7EE" stroke-width="1"/>
  <text x="592" y="272" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">At list prices. I cannot see</text>
  <text x="592" y="288" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">your rates.</text>
  <rect x="582" y="330" width="118" height="22" rx="11" fill="#FFF4CE"/>
  <text x="591" y="345" font-size="12" font-weight="700" fill="#7A5200" text-anchor="start">Scenario saving</text>
  <text x="572" y="394" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">Buying it</text>
  <text x="572" y="414" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">The AI writes the request for your</text>
  <text x="572" y="432" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">billing owner, as a scenario. Two</text>
  <text x="572" y="450" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">people approve the request; the</text>
  <text x="572" y="468" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">owner's quote settles the number.</text>
  <text x="572" y="500" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">What more access would buy</text>
  <text x="572" y="520" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">With cost access on this</text>
  <text x="572" y="538" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">subscription, scenarios could become</text>
  <text x="572" y="556" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">expected savings. List prices</text>
  <text x="572" y="574" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">overstate what you pay.</text>
  <rect x="818" y="100" width="248" height="560" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
  <rect x="818" y="100" width="248" height="72" rx="8" fill="#0F6CBD"/>
  <rect x="818" y="156" width="248" height="16" rx="0" fill="#0F6CBD"/>
  <text x="834" y="126" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">D. Partner-sold (CSP)</text>
  <text x="834" y="146" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">Billing belongs to the partner</text>
  <rect x="832" y="190" width="220" height="176" rx="6" fill="#EBF3FC" stroke="#9FC7EE" stroke-width="1"/>
  <text x="844" y="222" font-size="19" font-weight="700" fill="#0F6CBD" text-anchor="start">About €4,700 a month</text>
  <text x="844" y="242" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Range €4,100 to €5,300</text>
  <rect x="844" y="252" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#9FC7EE" stroke-width="1"/>
  <text x="854" y="272" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">At retail rates. Your</text>
  <text x="854" y="288" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">partner's rates are not</text>
  <text x="854" y="304" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">visible.</text>
  <rect x="844" y="330" width="118" height="22" rx="11" fill="#FFF4CE"/>
  <text x="853" y="345" font-size="12" font-weight="700" fill="#7A5200" text-anchor="start">Scenario saving</text>
  <text x="834" y="394" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">Buying it</text>
  <text x="834" y="414" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">The AI writes the request for your</text>
  <text x="834" y="432" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">partner. Their quote settles the</text>
  <text x="834" y="450" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">number; two people approve the</text>
  <text x="834" y="468" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">request here. If your partner allows</text>
  <text x="834" y="486" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">it, an Owner can buy in the portal.</text>
  <text x="834" y="518" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">What more access would buy</text>
  <text x="834" y="538" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">The partner's discount is not</text>
  <text x="834" y="556" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">visible to me, and usage covered by</text>
  <text x="834" y="574" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">a reservation shows no charge in</text>
  <text x="834" y="592" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">your own view.</text>
  <rect x="1080" y="100" width="248" height="560" rx="8" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="1"/>
  <rect x="1080" y="100" width="248" height="72" rx="8" fill="#0F6CBD"/>
  <rect x="1080" y="156" width="248" height="16" rx="0" fill="#0F6CBD"/>
  <text x="1096" y="126" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">E. Pay-as-you-go</text>
  <text x="1096" y="146" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">Online Services Agreement; no billing</text>
  <text x="1096" y="160" font-size="11" font-weight="400" fill="#E6F0FA" text-anchor="start">account scope</text>
  <rect x="1094" y="190" width="220" height="176" rx="6" fill="#EBF3FC" stroke="#9FC7EE" stroke-width="1"/>
  <text x="1106" y="222" font-size="19" font-weight="700" fill="#0F6CBD" text-anchor="start">About €2,600 a month</text>
  <text x="1106" y="242" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Range €2,200 to €3,000</text>
  <rect x="1106" y="252" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#9FC7EE" stroke-width="1"/>
  <text x="1116" y="272" font-size="12" font-weight="600" fill="#0F6CBD" text-anchor="start">At the rates on your bill</text>
  <rect x="1106" y="330" width="118" height="22" rx="11" fill="#E7F4E7"/>
  <text x="1115" y="345" font-size="12" font-weight="700" fill="#0E700E" text-anchor="start">Expected saving</text>
  <text x="1096" y="394" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">Buying it</text>
  <text x="1096" y="414" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">A reservation for the steady</text>
  <text x="1096" y="432" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">machines only: a savings plan is not</text>
  <text x="1096" y="450" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">available on this agreement. Two</text>
  <text x="1096" y="468" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">people approve the request; someone</text>
  <text x="1096" y="486" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">with Owner or Reservation Purchaser</text>
  <text x="1096" y="504" font-size="12.5" font-weight="400" fill="#242424" text-anchor="start">then decides whether to buy.</text>
  <text x="1096" y="536" font-size="12.5" font-weight="700" fill="#242424" text-anchor="start">What more access would buy</text>
  <text x="1096" y="556" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">A pay-as-you-go bill is at list</text>
  <text x="1096" y="574" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">prices. Commitment purchases are not</text>
  <text x="1096" y="592" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">shown on this account. A web sign-up</text>
  <text x="1096" y="610" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">under a Microsoft Customer Agreement</text>
  <text x="1096" y="628" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">belongs in column A or B.</text>
  <text x="32" y="698" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Every column keeps the same buttons: Explain, Challenge, Teach and Talk to a person. A scenario is never called an expected saving, and a request is never called a purchase.</text>
</svg>
