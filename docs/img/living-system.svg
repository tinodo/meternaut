<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The living system</title>
  <desc id="d">Five faculties — Study, Survey, Test, Act and Grow — arranged around one shared memory. The world, the open Commons, the customer's estate, the customer's agreement and the people surround them. Knowledge and work flow in both directions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <radialGradient id="mem" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#4a7bf0"/>
      <stop offset="1" stop-color="#5b46d6"/>
    </radialGradient>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="c1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="c2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="c3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="c4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
    <marker id="c5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="172" fill="#f8fafc" font-size="23" font-weight="700" letter-spacing="2">THE LIVING SYSTEM</text>
  <text x="40" y="196" fill="#cbd5e1" font-size="13">five faculties around one shared memory.</text>
  <text x="40" y="214" fill="#cbd5e1" font-size="13">No first step. No last step.</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="13">Everything feeds everything.</text>

  <!-- external: world, commons, estate, agreement, people -->
  <g>
    <rect x="40" y="40" width="270" height="88" rx="14" fill="#0f1a30" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
    <text x="58" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="2">THE WORLD</text>
    <text x="58" y="88" fill="#cbd5e1" font-size="12">documents · prices · specs · release</text>
    <text x="58" y="106" fill="#cbd5e1" font-size="12">notes · the community · Azure itself</text>
    <path d="M310,92 C410,92 460,118 520,128" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c1)"/>

    <rect x="890" y="40" width="270" height="88" rx="14" fill="#0f1a30" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
    <text x="908" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="2">THE COMMONS · OPEN</text>
    <text x="908" y="88" fill="#cbd5e1" font-size="12">Atlas · Actions · Detectors ·</text>
    <text x="908" y="106" fill="#cbd5e1" font-size="12">test cases — reviewed, versioned</text>
    <path d="M890,92 C790,92 740,118 680,128" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>

    <rect x="1004" y="284" width="170" height="102" rx="14" fill="#0f1a30" stroke="#34d399" stroke-opacity="0.55" stroke-width="2"/>
    <text x="1022" y="311" fill="#34d399" font-size="13" font-weight="700" letter-spacing="2">THE ESTATE</text>
    <text x="1022" y="333" fill="#cbd5e1" font-size="12">subscriptions · bills</text>
    <text x="1022" y="351" fill="#cbd5e1" font-size="12">telemetry · code · wikis</text>
    <text x="1022" y="369" fill="#cbd5e1" font-size="12">history · directory</text>
    <path d="M1004,336 L958,333" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>

    <rect x="360" y="770" width="480" height="58" rx="14" fill="#0f1a30" stroke="#f472b6" stroke-opacity="0.55" stroke-width="2"/>
    <text x="380" y="795" fill="#f472b6" font-size="13" font-weight="700" letter-spacing="2">PEOPLE</text>
    <text x="380" y="815" fill="#cbd5e1" font-size="12">owners · FinOps · finance · engineers · security — they decide, teach and review</text>
    <path d="M430,770 L430,738" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
    <path d="M770,770 L770,738" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>

    <rect x="908" y="618" width="196" height="88" rx="14" fill="#0f1a30" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2"/>
    <text x="926" y="645" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="2">THE AGREEMENT</text>
    <text x="926" y="667" fill="#cbd5e1" font-size="12">EA · MCA · partner · PAYG</text>
    <text x="926" y="685" fill="#cbd5e1" font-size="12">what it may see and buy</text>
    <path d="M908,656 L852,654" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
  </g>

  <!-- spokes: every faculty reads and writes the shared memory -->
  <g stroke="#64748b" stroke-width="2.2" fill="none">
    <line x1="600" y1="294" x2="600" y2="214" marker-start="url(#g)" marker-end="url(#g)"/>
    <line x1="719.8" y1="381.1" x2="795.9" y2="356.3" marker-start="url(#g)" marker-end="url(#g)"/>
    <line x1="674.1" y1="521.9" x2="721.1" y2="586.7" marker-start="url(#g)" marker-end="url(#g)"/>
    <line x1="525.9" y1="521.9" x2="478.9" y2="586.7" marker-start="url(#g)" marker-end="url(#g)"/>
    <line x1="480.2" y1="381.1" x2="404.1" y2="356.3" marker-start="url(#g)" marker-end="url(#g)"/>
  </g>

  <!-- ring: hand-offs between neighbours (a loop, not a pipeline) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M671.2,181.7 Q779.0,173.6 804.6,278.7" stroke="#38bdf8" marker-end="url(#c1)"/>
    <path d="M848.6,414.1 Q889.7,514.1 797.7,570.9" stroke="#34d399" marker-end="url(#c2)"/>
    <path d="M682.5,654.6 Q600.0,724.6 517.5,654.6" stroke="#fbbf24" marker-end="url(#c3)"/>
    <path d="M402.3,570.9 Q310.3,514.1 351.4,414.1" stroke="#f472b6" marker-end="url(#c4)"/>
    <path d="M395.4,278.7 Q421.0,173.6 528.8,181.7" stroke="#a78bfa" marker-end="url(#c5)"/>
  </g>
  <g font-size="11.5" font-style="italic" fill="#cbd5e1">
    <text x="815" y="212">news that touches you</text>
    <text x="882" y="506">unexplained spend</text>
    <text x="600" y="714" text-anchor="middle">tested cases</text>
    <text x="318" y="506" text-anchor="end">outcomes</text>
    <text x="418" y="196" text-anchor="end">gaps to learn</text>
  </g>

  <!-- the memory -->
  <circle cx="600" cy="420" r="120" fill="url(#mem)" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="2"/>
  <g text-anchor="middle" fill="#ffffff">
    <text x="600" y="371" font-size="17" font-weight="700" letter-spacing="3">THE MEMORY</text>
    <text x="600" y="398" font-size="12.5">Atlas — Azure's economics</text>
    <text x="600" y="418" font-size="12.5">Estate Model · Lesson Book</text>
    <text x="600" y="438" font-size="12.5">Ledger</text>
    <text x="600" y="470" font-size="11" font-style="italic" fill-opacity="0.9">every claim carries its receipts</text>
  </g>

  <!-- the five faculties -->
  <g text-anchor="middle">
    <circle cx="600" cy="130" r="78" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-width="3.5"/>
    <text x="600" y="123" fill="#38bdf8" font-size="21" font-weight="700" letter-spacing="2">STUDY</text>
    <text x="600" y="145" fill="#e2e8f0" font-size="11.5">learns Azure itself</text>
    <text x="600" y="161" fill="#e2e8f0" font-size="11.5">reads · decodes · checks</text>

    <circle cx="875.8" cy="330.4" r="78" fill="#34d399" fill-opacity="0.13" stroke="#34d399" stroke-width="3.5"/>
    <text x="875.8" y="323" fill="#34d399" font-size="21" font-weight="700" letter-spacing="2">SURVEY</text>
    <text x="875.8" y="345" fill="#e2e8f0" font-size="11.5">knows this estate:</text>
    <text x="875.8" y="361" fill="#e2e8f0" font-size="11.5">intent, owners, rhythm</text>

    <circle cx="770.5" cy="654.6" r="78" fill="#fbbf24" fill-opacity="0.13" stroke="#fbbf24" stroke-width="3.5"/>
    <text x="770.5" y="647" fill="#fbbf24" font-size="21" font-weight="700" letter-spacing="2">TEST</text>
    <text x="770.5" y="669" fill="#e2e8f0" font-size="11.5">asks, doubts, checks</text>
    <text x="770.5" y="685" fill="#e2e8f0" font-size="11.5">hypotheses, evidence</text>

    <circle cx="429.5" cy="654.6" r="78" fill="#f472b6" fill-opacity="0.13" stroke="#f472b6" stroke-width="3.5"/>
    <text x="429.5" y="647" fill="#f472b6" font-size="21" font-weight="700" letter-spacing="2">ACT</text>
    <text x="429.5" y="669" fill="#e2e8f0" font-size="11.5">changes things with</text>
    <text x="429.5" y="685" fill="#e2e8f0" font-size="11.5">people · actions</text>

    <circle cx="324.2" cy="330.4" r="78" fill="#a78bfa" fill-opacity="0.13" stroke="#a78bfa" stroke-width="3.5"/>
    <text x="324.2" y="323" fill="#a78bfa" font-size="21" font-weight="700" letter-spacing="2">GROW</text>
    <text x="324.2" y="345" fill="#e2e8f0" font-size="11.5">predicts and scores</text>
    <text x="324.2" y="361" fill="#e2e8f0" font-size="11.5">evaluation · open Commons</text>
  </g>

  <!-- legend -->
  <text x="40" y="792" fill="#94a3b8" font-size="12">arrows: knowledge and work flowing in both directions</text>
</svg>
